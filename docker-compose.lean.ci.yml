# CI ONLY — READ the layer cache. Never merged into the base file: `type=gha` speaks to the GitHub
# Actions cache backend, which does not exist on a laptop, so `docker compose -f docker-compose.lean.yml
# up` must stay usable without it.
#
# The composition job builds once, runs image-checks on those images, and then boots them
# together. Read main's layers here; writing is only enabled by the main-only override.
services:
  proxy:
    build:
      cache_from: ["type=gha,scope=lean-proxy"]
  app:
    build:
      cache_from: ["type=gha,scope=lean-app"]
  sql:
    build:
      cache_from: ["type=gha,scope=lean-sql"]
  events:
    build:
      cache_from: ["type=gha,scope=lean-events"]
  browser:
    build:
      cache_from: ["type=gha,scope=lean-browser"]
