# A TEST FIXTURE, not a shipped file: default_rate_limits.yml with the anonymous mint at 2/hour/ip, doubled for a holder, so a
# refusal is a request or two away instead of never (the shipped default closes it outright).
policies:
  # was DOORS.ANON_MINT — closed by default; a deployment that wants open minting ships its own file.
  anon_mint:      { max: 2,   window: 1h,  key: ip,    burst: 2 }
  # was DOORS.LOGIN_SEND — per ADDRESS, not per ip: an office behind one NAT is many people.
  login_send:     { max: 5,   window: 1h,  key: email }
  # was DOORS.LOGIN_VERIFY — generous; the guess cap per CODE is Better Auth's (5).
  login_verify:   { max: 60,  window: 15m, key: ip }
  oauth_register: { max: 30,  window: 1m,  key: ip }
  oauth_token:    { max: 30,  window: 1m,  key: ip }
  mutate:         { max: 60,  window: 1m,  key: ip }
  query:          { max: 600, window: 1m,  key: ip }
  export:         { max: 30,  window: 1m,  key: actor }
  edit:           { max: 600, window: 1m,  key: actor }
  publish:        { max: 600, window: 1m,  key: actor }

routes:
  # `browser_only` is the anonymous mint's OTHER verdict, and it is POST-only on purpose: `/api/start`
  # shares the budget and is posted by an agent with no browser at all.
  - { method: POST, path: "^/api/tokens/anonymous$", policies: [anon_mint], browser_only: true }
  - { path: "^/api/tokens/anonymous$", policies: [anon_mint] }
  - { path: "^/api/start$",            policies: [anon_mint] }
  - { method: POST, path: "^/api/auth/email-otp/send-verification-otp$", policies: [login_send] }
  - { path: "^/api/auth/sign-in",           policies: [login_verify] }
  - { path: "^/api/auth/email-otp/verify",  policies: [login_verify] }
  - { path: "^/oauth/register$",            policies: [oauth_register] }
  - { path: "^/oauth/token$",               policies: [oauth_token] }
  - { path: "^/a/[A-Za-z0-9]+/mutate$",     policies: [mutate] }
  - { path: "^/a/[A-Za-z0-9]+/query$",      policies: [query] }
  - { path: "^/api/query$",                 policies: [query] }
  - { path: "^/a/[A-Za-z0-9]+/export$",     policies: [export] }
  - { path: "/edits$",                      policies: [edit] }
  # was doorFor's `method !== GET && method !== HEAD` — a negation the file spells out as a list.
  - { method: [POST, PUT, PATCH, DELETE, OPTIONS], path: "^/api/artifacts",    policies: [publish] }
  - { method: [POST, PUT, PATCH, DELETE, OPTIONS], path: "^/api/my/artifacts", policies: [publish] }
  - { method: [POST, PUT, PATCH, DELETE, OPTIONS], path: "^/mcp$",             policies: [publish] }

# Today NOTHING is metered globally: DOORS.GLOBAL exists in the vocabulary and `doorFor` never
# returns it. Adding it here would be a new limit, not a port — see PLAN §2 row R6.
always: []
