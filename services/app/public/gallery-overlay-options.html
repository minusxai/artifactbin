<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery overlay options</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:#202a33;font:14px ui-monospace,SFMono-Regular,monospace;padding:48px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}h1{font-size:20px;margin:0}header p{color:#647180;font-size:12px}button{font:inherit;cursor:pointer}#theme{border:1px solid #b9c3cb;border-radius:6px;background:transparent;color:inherit;padding:8px 12px}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;max-width:1500px;margin:auto}h2{font-size:15px;margin:0 0 8px}p{color:#647180;font-size:12px;line-height:1.6;margin:0 0 24px}.paper{position:relative;aspect-ratio:40/21;margin-top:24px;overflow:hidden;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%);border-radius:5px;background:#f8f5e7;box-shadow:inset 0 0 0 1px #aab7c333}.paper.dark{background:#141c24;color:#eef3f7}.paper:after{content:'';position:absolute;top:0;right:0;width:18px;height:18px;background:linear-gradient(45deg,#dfe5e9 49%,transparent 50%)}.document{padding:16px 20px;font-family:Georgia,serif}.document h3{font-size:13px;margin:0 0 14px}.stats{display:flex;gap:45px;font-size:9px;margin:0 0 22px}.document h4{font-size:10px;margin:0 0 8px}.lines{height:38px;opacity:.22;background:repeating-linear-gradient(transparent 0 7px,currentColor 7px 8px);width:80%}.visibility{position:absolute;right:24px;top:10px;width:25px;height:25px;display:grid;place-items:center;color:#647180}.dark .visibility{color:#b8c8d5}.visibility svg{width:15px;height:15px}.bottom{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:20px 12px 9px;color:white}.metric{flex:1;min-width:0;position:relative;height:26px}.metric svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.count{position:relative;font-size:10px;line-height:20px}.actions{display:flex;align-items:center;gap:4px}.actions button{background:none;border:0;color:inherit;width:27px;height:27px;padding:5px;border-radius:4px}.actions button:hover{background:#ffffff25}.actions svg{width:17px;height:17px}.fade .bottom{background:linear-gradient(transparent,rgba(10,20,30,.8));padding-top:36px;text-shadow:0 1px 3px #0008}.glass .bottom{bottom:7px;left:7px;right:7px;padding:7px 9px;border-radius:5px;background:#f8fbfbc9;backdrop-filter:blur(12px);color:#334654;border:1px solid #ffffff55}.glass .dark .bottom{background:#182530c9;color:#dceaf5;border-color:#ffffff18}.rail .bottom{padding:7px 11px;background:#f6f8faeb;color:#435462;border-top:1px solid #aab7c333}.rail .dark .bottom{background:#1e2a35eb;color:#dceaf5}.title{text-align:center;font-size:13px;font-weight:600;margin:12px 0 28px}.night{background:#0c1217;color:#e6edf3}.night p{color:#9eacba}.note{margin-top:30px;font-size:12px;color:#71808d}@media(max-width:850px){body{padding:24px}.options{grid-template-columns:1fr}header{display:block}.paper{max-width:500px}}
</style></head><body><header><div><h1>Gallery overlays</h1><p>Same content and controls, three treatments.</p></div><button id="theme">Toggle page background</button></header><main class="options"></main><p class="note">Visual comparison only. Sample document content and view counts.</p>
<script>
const pencil='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15z"/></svg>';
const more='<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>';
const globe='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>';
const spark='<svg viewBox="0 0 180 26" preserveAspectRatio="none"><path d="M0 24H94L100 17L106 23L111 10L117 22L123 15L129 20L137 3L143 9L150 24L161 19L170 24H180" fill="none" stroke="#32df75" stroke-width="1.5" stroke-linejoin="round"/></svg>';
function card(dark){const title=dark?'Onboarding Funnel Review':'Friday Metrics Digest';return `<div class="paper ${dark?'dark':''}"><div class="document"><h3>${title}</h3><div class="stats"><b>26</b><b>66%</b><b>15</b></div><h4>What changed</h4><div class="lines"></div></div><span class="visibility" title="Public">${globe}</span><div class="bottom"><div class="metric">${spark}<span class="count">21 views</span></div><div class="actions"><button aria-label="Edit preview">${pencil}</button><button aria-label="More actions">${more}</button></div></div></div><div class="title">${title}</div>`}
const options=[['fade','01 · Soft vignette','A dark fade grounds the controls. Most immersive, but darkens the artwork.'],['glass','02 · Frosted glass','One translucent strip connects the sparkline and actions. My pick.'],['rail','03 · Quiet toolbar','A thin, solid footer keeps everything readable with minimal visual noise.']];
document.querySelector('main').innerHTML=options.map(([kind,title,description])=>`<section class="${kind}"><h2>${title}</h2><p>${description}</p>${card(false)}${card(true)}</section>`).join('');document.querySelector('#theme').onclick=()=>document.body.classList.toggle('night');
</script></body></html>
