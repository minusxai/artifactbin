# Story authoring guidance ("mini-skills") returned with Clarify picks.
#
# - `templates:` — FULL definitions of the story templates (structural genres). Projected
#   into the registry by lib/data/story/story-templates.ts; the `guidance` block is returned
#   verbatim to the agent when the user picks that template (Clarify `type: 'template'`).
# - `themes:` — authoring guidance ONLY for the six design themes (their code entries + CSS
#   tokens live in lib/data/story/story-themes.ts, which must stay YAML-free so tsx scripts
#   can import it). Returned with the Clarify `type: 'design'` pick.
#
# Style contract for guidance blocks (learned from claude.ai/design's system readmes):
# a personality statement, the beat structure, the layout grammar, a SELF-DOCUMENTING skeleton
# (placeholder copy teaches the rule it sits in), and blunt Do/Don't lists. Keep each compact.
# Everything must respect the story platform rules: container variants (@2xl:) not viewport
# variants, no position:fixed/sticky, every data number a live embed, Vega for every chart.
# Motion: kit classes (animate-marquee/fade-up/…, reveal-*) OR custom @keyframes in a top-level
# <style>{`…`}</style> block attached to classes; scroll reveals via the data-reveal +
# [data-mx-seen] observer contract. No inline style=, no JS; utilities compile !important and
# always beat authored CSS — see the markup-motion reference.

templates:
  doc:
    label: Document
    description: A simple writing surface for notes, drafts, meeting minutes and everyday documents.
    personality: >-
      Quiet and direct. A readable text column with a headline and flowing body copy,
      ordinary headings and lists. Start writing immediately; add structure only as the
      content needs it. No cover, hero, table of contents or decorative section system.
    beats:
      - Headline (what the document is about)
      - Body (paragraphs, notes or lists)
      - Further sections (only when the writing needs them)
  editorial:
    label: Editorial
    description: Typeset document/report — an argument in measured prose, supported by numbered figures and navigable sections.
    personality: >-
      A document for sustained reading: a white paper, a memo to the board, an illustrated
      feature or a research dossier. Measured prose carries the argument and numbered figures
      (charts, diagrams, images) show the evidence. The design system supplies the visual
      register, page ground and section treatments; compositions may include margin notes,
      evidence spreads and bands while preserving reading order and a legible prose measure.
    beats:
      - Title block (title · standfirst · byline/date)
      - Summary (key findings)
      - Numbered sections (3-6, one claim each, closing on a takeaway)
      - Figures throughout (FIG-numbered — chart, diagram, or image)
      - Closing section (the so-what) + method footer
  deck:
    label: Deck
    description: Presentation deck — full-viewport slides, one idea per slide, building toward a conclusion or decision.
    personality: >-
      A presentation with headlines you could speak aloud to the room and space to understand
      one idea at a time. Group slides into acts when that helps the argument. The design system
      owns the stage, type scale, grounds and transitions; keep orientation and evidence legible.
    beats:
      - Cover
      - Contents (mirrors the act titles)
      - Act divider (when the argument moves to a new act)
      - Content slides (statement / columns / chart / table / big number)
      - Quote or image slide (a breather per act)
      - Timeline / roadmap
      - Close
  scrolly:
    label: Scrolly
    description: Playful scrollytelling — a pudding.cool-style data story with a conceit, ticker bands, and chapter breaks.
    personality: >-
      Curious, witty, second-person — and DRESSED UP: the story wears a costume (a mission
      console, a field report, a race broadcast) and every element plays along. The scroll IS
      the story, suspense lives between chapters, and fun, visual stunningness is the point —
      serious about the data, theatrical about everything else. The costume itself can run
      deadpan (a technical console, straight-faced) or full broadcast — pick the register the
      subject can carry.
    beats:
      - Console hero / cold open (the conceit announces itself)
      - Ticker band
      - Chapters (3-5), each opened by a page-break band
      - Twist
      - Payoff
      - Methodology footer
  dashboard:
    label: Dashboard
    description: Operating view — live evidence and shared controls that make status and exceptions clear at a glance.
    personality: >-
      The reader filters and scans, and the page answers. Controls and live evidence carry the
      story; status, exceptions and comparisons should read at a glance. The design system owns
      type weights, surfaces and accents. Give the key finding prominence while keeping the
      controls easy to find and repeated signals easy to compare.
    beats:
      - Command bar (kicker · status chip · quiet verdict · the shared controls, one compact band)
      - KPI band (3-4 trend cards — value + delta + sparkline — in one Grid row)
      - Evidence tiles (charts/tables on the same Grid, every query bound to the controls)
      - Status footer (sources · window · refresh cadence)
  plan:
    label: Plan
    description: Visual working plan — screen designs or process diagrams, decisions, and milestones tracked through completion.
    personality: >-
      A carefully composed working board: generous space for the proposed design, compact
      notes beside the evidence, and a crisp execution ledger. The system's visual roles connect
      screen IDs, flow arrows and status; the drawings carry the proposal. UI plans show
      spatial wireframes and screen transitions; operational plans show dependencies and
      decision branches. Beautiful because the next decision and next action are clear.
    beats:
      - Brief (outcome, scope, constraints, current status)
      - Visual proposal (UI wireframes or process/dependency diagrams)
      - Flows and states (actions, branches, failures and recovery)
      - Decisions (tradeoffs, open questions and acceptance criteria)
      - Execution ledger (owners, dependencies, status and struck-through completed tasks)
  app:
    label: App
    description: Tool people operate — state, actions and outcomes on one surface; a working prototype or a dataset-backed workflow, not a page to read.
    personality: >-
      A sheet on the wall made clickable: the thing people claim, book, sort or approve is the
      primary surface, the selection stays visible, and every action ends in a record. Empty,
      unavailable and success states are designed, not accidental. Clear because the next
      action is obvious; beautiful because nothing competes with it.
    beats:
      - Primary surface (what people act on — slots, rows, items, a board)
      - Selection and review (the chosen thing stays visible; a receipt-style summary)
      - Actions (confirm, cancel, undo; validation; empty, unavailable, error and success states)
      - Record (what happened, for whom, when)
  landing:
    label: Landing
    description: One offering and one next action — the atmosphere and the practical facts instantly clear, the schedule or product reachable in one move.
    personality: >-
      An invitation, not a brochure: one subject-led image or drawing, the dates, the price and
      the next action composed into the opening, and the detail arranged so a first-time visitor
      can choose. Warm or sharp as the subject demands; never a hero over a feature grid for its
      own sake.
    beats:
      - Opening (the offering, its facts and the next action in one composition)
      - The detail (sessions, features or the programme, distinguished so people can choose)
      - Practicalities (where, when, how much, what to bring)
      - Next action again (and what the demo does and does not do)
themes: {}
