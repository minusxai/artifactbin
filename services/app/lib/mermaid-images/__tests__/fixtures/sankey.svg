<svg xmlns="http://www.w3.org/2000/svg" id="mx-mermaid-1" width="100%" style="max-width: 600px;" viewBox="0 0 600 400" role="graphics-document document" aria-roledescription="sankey"><style>#mx-mermaid-1{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:16px;fill:#0b0b0b;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mx-mermaid-1 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mx-mermaid-1 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mx-mermaid-1 .error-icon{fill:#f2f2f2;}#mx-mermaid-1 .error-text{fill:#0b0b0b;stroke:#0b0b0b;}#mx-mermaid-1 .edge-thickness-normal{stroke-width:1px;}#mx-mermaid-1 .edge-thickness-thick{stroke-width:3.5px;}#mx-mermaid-1 .edge-pattern-solid{stroke-dasharray:0;}#mx-mermaid-1 .edge-thickness-invisible{stroke-width:0;fill:none;}#mx-mermaid-1 .edge-pattern-dashed{stroke-dasharray:3;}#mx-mermaid-1 .edge-pattern-dotted{stroke-dasharray:2;}#mx-mermaid-1 .marker{fill:#555555;stroke:#555555;}#mx-mermaid-1 .marker.cross{stroke:#555555;}#mx-mermaid-1 svg{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:16px;}#mx-mermaid-1 p{margin:0;}#mx-mermaid-1 .label{font-family:Inter,ui-sans-serif,system-ui,sans-serif;}#mx-mermaid-1 .node-labels{font-family:Inter,ui-sans-serif,system-ui,sans-serif;}#mx-mermaid-1 .sankey-label-bg{stroke:#fcfcfc;stroke-width:4px;stroke-linejoin:round;paint-order:stroke;}#mx-mermaid-1 .sankey-label-fg{fill:#0b0b0b;}#mx-mermaid-1 .node rect{shape-rendering:crispEdges;}#mx-mermaid-1 .link{fill:none;stroke-opacity:0.5;mix-blend-mode:multiply;}#mx-mermaid-1 .node .neo-node{stroke:#d7d7d7;}#mx-mermaid-1 [data-look="neo"].node rect,#mx-mermaid-1 [data-look="neo"].cluster rect,#mx-mermaid-1 [data-look="neo"].node polygon{stroke:#d7d7d7;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mx-mermaid-1 [data-look="neo"].swimlane.cluster rect{filter:none;}#mx-mermaid-1 [data-look="neo"].node path{stroke:#d7d7d7;stroke-width:1px;}#mx-mermaid-1 [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mx-mermaid-1 [data-look="neo"].node .neo-line path{stroke:#d7d7d7;filter:none;}#mx-mermaid-1 [data-look="neo"].node circle{stroke:#d7d7d7;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mx-mermaid-1 [data-look="neo"].node circle .state-start{fill:#000000;}#mx-mermaid-1 [data-look="neo"].icon-shape .icon{fill:#d7d7d7;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mx-mermaid-1 [data-look="neo"].icon-shape .icon-neo path{stroke:#d7d7d7;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mx-mermaid-1 :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g class="nodes"><g class="node" id="node-1" transform="translate(0,0)" x="0" y="0"><rect height="399.9999999999999" width="10" fill="#4e79a7"/></g><g class="node" id="node-2" transform="translate(295,133.3333333333334)" x="295" y="133.3333333333334"><rect height="266.66666666666663" width="10" fill="#f28e2c"/></g><g class="node" id="node-3" transform="translate(590,0)" x="590" y="0"><rect height="133.33333333333331" width="10" fill="#e15759"/></g><g class="node" id="node-4" transform="translate(590,160.33333333333331)" x="590" y="160.33333333333331"><rect height="186.66666666666657" width="10" fill="#76b7b2"/></g></g><g class="node-labels" font-size="14"><text x="16" y="199.99999999999994" dy="0em" text-anchor="start">A
