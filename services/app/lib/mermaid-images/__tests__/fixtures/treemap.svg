<svg xmlns="http://www.w3.org/2000/svg" id="mx-mermaid-1" width="100%" viewBox="2 27 996 371" style="max-width: 996px;" class="flowchart" role="graphics-document document" aria-roledescription="treemap"><style>#mx-mermaid-1{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:16px;fill:#0b0b0b;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mx-mermaid-1 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mx-mermaid-1 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mx-mermaid-1 .error-icon{fill:#f2f2f2;}#mx-mermaid-1 .error-text{fill:#0b0b0b;stroke:#0b0b0b;}#mx-mermaid-1 .edge-thickness-normal{stroke-width:1px;}#mx-mermaid-1 .edge-thickness-thick{stroke-width:3.5px;}#mx-mermaid-1 .edge-pattern-solid{stroke-dasharray:0;}#mx-mermaid-1 .edge-thickness-invisible{stroke-width:0;fill:none;}#mx-mermaid-1 .edge-pattern-dashed{stroke-dasharray:3;}#mx-mermaid-1 .edge-pattern-dotted{stroke-dasharray:2;}#mx-mermaid-1 .marker{fill:#555555;stroke:#555555;}#mx-mermaid-1 .marker.cross{stroke:#555555;}#mx-mermaid-1 svg{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:16px;}#mx-mermaid-1 p{margin:0;}#mx-mermaid-1 .treemapNode.section{stroke:black;stroke-width:1;fill:#efefef;}#mx-mermaid-1 .treemapNode.leaf{stroke:black;stroke-width:1;fill:#efefef;}#mx-mermaid-1 .treemapLabel{fill:#0b0b0b;font-size:12px;}#mx-mermaid-1 .treemapValue{fill:#0b0b0b;font-size:10px;}#mx-mermaid-1 .treemapTitle{fill:#0b0b0b;font-size:14px;}#mx-mermaid-1 .node .neo-node{stroke:#d7d7d7;}#mx-mermaid-1 [data-look="neo"].node rect,#mx-mermaid-1 [data-look="neo"].cluster rect,#mx-mermaid-1 [data-look="neo"].node polygon{stroke:#d7d7d7;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mx-mermaid-1 [data-look="neo"].swimlane.cluster rect{filter:none;}#mx-mermaid-1 [data-look="neo"].node path{stroke:#d7d7d7;stroke-width:1px;}#mx-mermaid-1 [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mx-mermaid-1 [data-look="neo"].node .neo-line path{stroke:#d7d7d7;filter:none;}#mx-mermaid-1 [data-look="neo"].node circle{stroke:#d7d7d7;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mx-mermaid-1 [data-look="neo"].node circle .state-start{fill:#000000;}#mx-mermaid-1 [data-look="neo"].icon-shape .icon{fill:#d7d7d7;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mx-mermaid-1 [data-look="neo"].icon-shape .icon-neo path{stroke:#d7d7d7;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mx-mermaid-1 :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g transform="translate(0, 0)" class="treemapContainer"><g class="treemapSection" transform="translate(0,0)"><rect width="1000" height="25" class="treemapSectionHeader" fill="none" fill-opacity="0.6" stroke-width="0.6" style="display: none;"/><clipPath id="clip-section-mx-mermaid-1-0"><rect width="988" height="25"/></clipPath><rect width="1000" height="400" class="treemapSection section0" fill="transparent" fill-opacity="0.6" stroke="transparent" stroke-width="2" stroke-opacity="0.4" style="display: none;"/><text class="treemapSectionLabel" x="6" y="12.5" dominant-baseline="middle" font-weight="bold" clip-path="url(#clip-section-mx-mermaid-1-0)" style="display: none;"/><text class="treemapSectionValue" x="990" y="12.5" text-anchor="end" dominant-baseline="middle" font-style="italic" style="display: none;">30</text></g><g class="treemapSection" transform="translate(10,35)"><rect width="980" height="25" class="treemapSectionHeader" fill="none" fill-opacity="0.6" stroke-width="0.6" style=""/><clipPath id="clip-section-mx-mermaid-1-1"><rect width="968" height="25"/></clipPath><rect width="980" height="355" class="treemapSection section1" fill="hsl(0, 0%, 73.8235294118%)" fill-opacity="0.6" stroke="hsl(0, 0%, 63.8235294118%)" stroke-width="2" stroke-opacity="0.4" style=";"/><text class="treemapSectionLabel" x="6" y="12.5" dominant-baseline="middle" font-weight="bold" clip-path="url(#clip-section-mx-mermaid-1-1)" style="dominant-baseline: middle; font-size: 12px; fill:#0b0b0b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Root</text><text class="treemapSectionValue" x="970" y="12.5" text-anchor="end" dominant-baseline="middle" font-style="italic" style="text-anchor: end; dominant-baseline: middle; font-size: 10px; fill:#0b0b0b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">30</text></g><g class="treemapNode treemapLeafGroup leaf0x" transform="translate(20,70)"><rect width="637" height="310" class="treemapLeaf" fill="hsl(0, 0%, 73.8235294118%)" style="" fill-opacity="0.3" stroke="hsl(0, 0%, 73.8235294118%)" stroke-width="3"/><clipPath id="clip-mx-mermaid-1-0"><rect width="633" height="306"/></clipPath><text class="treemapLabel" x="318.5" y="155" style="text-anchor: middle; dominant-baseline: middle; font-size: 38px;fill:#0b0b0b;" clip-path="url(#clip-mx-mermaid-1-0)">B</text><text class="treemapValue" x="318.5" y="176" style="text-anchor: middle; dominant-baseline: hanging; font-size: 23px; fill: rgb(11, 11, 11);" clip-path="url(#clip-mx-mermaid-1-0)">20</text></g><g class="treemapNode treemapLeafGroup leaf1x" transform="translate(667,70)"><rect width="313" height="310" class="treemapLeaf" fill="hsl(0, 0%, 73.8235294118%)" style="" fill-opacity="0.3" stroke="hsl(0, 0%, 73.8235294118%)" stroke-width="3"/><clipPath id="clip-mx-mermaid-1-1"><rect width="309" height="306"/></clipPath><text class="treemapLabel" x="156.5" y="155" style="text-anchor: middle; dominant-baseline: middle; font-size: 38px;fill:#0b0b0b;" clip-path="url(#clip-mx-mermaid-1-1)">A</text><text class="treemapValue" x="156.5" y="176" style="text-anchor: middle; dominant-baseline: hanging; font-size: 23px; fill: rgb(11, 11, 11);" clip-path="url(#clip-mx-mermaid-1-1)">10</text></g></g><style>#