<svg xmlns="http://www.w3.org/2000/svg" id="mx-mermaid-1" width="100%" style="max-width: 700px;" viewBox="0 -25 700 540" preserveAspectRatio="xMinYMin meet" height="565" role="graphics-document document" aria-roledescription="journey"><style>#mx-mermaid-1{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:16px;fill:#0b0b0b;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mx-mermaid-1 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mx-mermaid-1 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mx-mermaid-1 .error-icon{fill:#f2f2f2;}#mx-mermaid-1 .error-text{fill:#0b0b0b;stroke:#0b0b0b;}#mx-mermaid-1 .edge-thickness-normal{stroke-width:1px;}#mx-mermaid-1 .edge-thickness-thick{stroke-width:3.5px;}#mx-mermaid-1 .edge-pattern-solid{stroke-dasharray:0;}#mx-mermaid-1 .edge-thickness-invisible{stroke-width:0;fill:none;}#mx-mermaid-1 .edge-pattern-dashed{stroke-dasharray:3;}#mx-mermaid-1 .edge-pattern-dotted{stroke-dasharray:2;}#mx-mermaid-1 .marker{fill:#555555;stroke:#555555;}#mx-mermaid-1 .marker.cross{stroke:#555555;}#mx-mermaid-1 svg{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:16px;}#mx-mermaid-1 p{margin:0;}#mx-mermaid-1 .label{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#0b0b0b;}#mx-mermaid-1 .mouth{stroke:#666;}#mx-mermaid-1 line{stroke:#0b0b0b;}#mx-mermaid-1 .legend{fill:#0b0b0b;font-family:Inter,ui-sans-serif,system-ui,sans-serif;}#mx-mermaid-1 .label text{fill:#333;}#mx-mermaid-1 .label{color:#0b0b0b;}#mx-mermaid-1 .face{fill:#FFF8DC;stroke:#999;}#mx-mermaid-1 .node rect,#mx-mermaid-1 .node circle,#mx-mermaid-1 .node ellipse,#mx-mermaid-1 .node polygon,#mx-mermaid-1 .node path{fill:#fcfcfc;stroke:#d7d7d7;stroke-width:1px;}#mx-mermaid-1 .node .label{text-align:center;}#mx-mermaid-1 .node.clickable{cursor:pointer;}#mx-mermaid-1 .arrowheadPath{fill:#555555;}#mx-mermaid-1 .edgePaths .path{stroke:#555555;stroke-width:1.5px;}#mx-mermaid-1 .flowchart-link{stroke:#555555;fill:none;}#mx-mermaid-1 .edgeLabel{background-color:#ffffff;text-align:center;}#mx-mermaid-1 .edgeLabel rect{opacity:0.5;}#mx-mermaid-1 .cluster text{fill:#0b0b0b;}#mx-mermaid-1 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:12px;background:#f2f2f2;border:1px solid #d7d7d7;border-radius:2px;pointer-events:none;z-index:100;}#mx-mermaid-1 .task-type-0,#mx-mermaid-1 .section-type-0{fill:#fcfcfc;}#mx-mermaid-1 .task-type-1,#mx-mermaid-1 .section-type-1{fill:#f2f2f2;}#mx-mermaid-1 .task-type-2,#mx-mermaid-1 .section-type-2{fill:hsl(64, 0%, 98.8235294118%);}#mx-mermaid-1 .task-type-3,#mx-mermaid-1 .section-type-3{fill:hsl(64, 0%, 94.9019607843%);}#mx-mermaid-1 .task-type-4,#mx-mermaid-1 .section-type-4{fill:hsl(-64, 0%, 98.8235294118%);}#mx-mermaid-1 .task-type-5,#mx-mermaid-1 .section-type-5{fill:hsl(-64, 0%, 94.9019607843%);}#mx-mermaid-1 .task-type-6,#mx-mermaid-1 .section-type-6{fill:hsl(128, 0%, 98.8235294118%);}#mx-mermaid-1 .task-type-7,#mx-mermaid-1 .section-type-7{fill:hsl(128, 0%, 94.9019607843%);}#mx-mermaid-1 .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#mx-mermaid-1 .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#mx-mermaid-1 .node .neo-node{stroke:#d7d7d7;}#mx-mermaid-1 [data-look="neo"].node rect,#mx-mermaid-1 [data-look="neo"].cluster rect,#mx-mermaid-1 [data-look="neo"].node polygon{stroke:#d7d7d7;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mx-mermaid-1 [data-look="neo"].swimlane.cluster rect{filter:none;}#mx-mermaid-1 [data-look="neo"].node path{stroke:#d7d7d7;stroke-width:1px;}#mx-mermaid-1 [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mx-mermaid-1 [data-look="neo"].node .