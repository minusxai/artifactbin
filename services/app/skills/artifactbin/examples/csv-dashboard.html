<!doctype html>
<!-- Example: a dashboard over one linked dataset, every number computed by SQL (sql), whose charts
filter each other. Usage: and Gotchas: are above DATA; keep this line. -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="artifactbin:design-system" content="phosphor">
<title>[Courier deliveries, December to May]</title>
<link rel="af-dataset" data-af-name="deliveries" href="./deliveries.csv">
<script type="module" id="page-data">
// Usage: node scripts/new-page.mjs --data FILE.csv --title NAME copies the CSV beside this page,
//   links it by its path (publishing the page creates its dataset, and updates it when the CSV
//   changes) and copies this page with a simple DATA for that CSV, its renderer csv-dashboard.mjs
//   (leave it as is) and its steps file (sample: node examples/gen-deliveries.mjs >
//   deliveries.csv). Copy chart kinds and linked filters from this DATA. Edit only DATA and
//   <title>; then the publish and check commands new-page printed (a first publish: --create).
// Gotchas: pick the chart for the question, one chart per question asked: change over time: line;
//   a breakdown by category: bar; a distribution: bar over bins made in SQL; two numbers per row:
//   point (table:false, and say the relationship in a text); two categories or day by hour: rect
//   (a heatmap: series is its rows, y its colour); the same trend per group: series with
//   multiples:true; places: map (lat, lon; x names the place, y sizes it). Delete charts and
//   queries no question needs. Every number comes from DATA.queries, each a SQLite SELECT over
//   the linked datasets (the table is the data-af-name) run as the reader with sql and rerun
//   when the data changes (sql.watch). A text is a function of h: h.one(name) is a query's
//   first row, h.rows(name) all its rows, h.fmt(n, digits) formats. A chart draws one query's
//   rows: x, y and an optional series, as SQL computed them (GROUP BY in SQL, never in script);
//   its values open in a table under it (table:false hides it). filters: {param: label}; a chart
//   with filter:'city' sets $city to the x a reader picks (a mark or its table button; again
//   clears it) and reruns every query: each says which filters it obeys with ($city is null or
//   city = $city), and the picking chart's own query leaves its filter out. labels names columns
//   for readers. ids are unique keys.
// Built with: one HTML page; a published CSV dataset; every number computed by sql (sql.watch
//   keeps them live); Vega-Lite charts (deck.gl for a map), each with a table of its values.
window.DATA = {
  filters: {city:'City', category:'Category'},
  queries: {
    totals: `select count(*) as orders, sum(amount) as revenue, avg(minutes) as minutes,
      avg(minutes <= 45) * 100 as on_time from deliveries
      where ($city is null or city = $city) and ($category is null or category = $category)`,
    weekly: `select date(date, '-6 days', 'weekday 1') as week, count(*) as orders from deliveries
      where ($city is null or city = $city) and ($category is null or category = $category)
      group by week order by week`,
    cities: `select city, avg(lat) as lat, avg(lon) as lon, count(*) as orders from deliveries
      where ($category is null or category = $category) group by city order by orders desc`,
    categories: `select category, count(*) as orders from deliveries
      where ($city is null or city = $city) group by category order by orders desc`,
    monthly: `select city, substr(date, 1, 7) as month, count(*) as orders from deliveries
      where ($category is null or category = $category) group by city, month order by month`,
    // A heatmap has every cell, zero included, in a fixed order whatever the filters keep.
    hours: `with days(n, weekday) as (values (0, 'Mon'), (1, 'Tue'), (2, 'Wed'), (3, 'Thu'),
      (4, 'Fri'), (5, 'Sat'), (6, 'Sun')), hours as (select distinct hour from deliveries)
      select hours.hour, days.weekday, count(d.hour) as orders from hours cross join days
      left join deliveries d on d.hour = hours.hour and (strftime('%w', d.date) + 6) % 7 = days.n
      and ($city is null or d.city = $city) and ($category is null or d.category = $category)
      group by hours.hour, days.n order by hours.hour, days.n`,
    minutes: `select cast(minutes / 5 as int) * 5 as minutes_from, count(*) as orders
      from deliveries
      where ($city is null or city = $city) and ($category is null or category = $category)
      group by minutes_from order by minutes_from`,
    distance: `select distance_km, minutes from deliveries
      where ($city is null or city = $city) and ($category is null or category = $category)`,
    per_km: `select (count(*) * sum(distance_km * minutes) - sum(distance_km) * sum(minutes)) /
      (count(*) * sum(distance_km * distance_km) - sum(distance_km) * sum(distance_km)) as minutes
      from deliveries
      where ($city is null or city = $city) and ($category is null or category = $category)`,
  },
  labels: {week:'Week of', orders:'Deliveries', city:'City', category:'Category', month:'Month',
    hour:'Hour', weekday:'Day', minutes_from:'Minutes (5-minute bins)',
    distance_km:'Distance (km)', minutes:'Minutes to deliver'},
  kicker: '[Courier operations] · sample data',
  lead: h => `[${h.fmt(h.one('totals').orders)} deliveries; ${h.fmt(h.one('totals').on_time)}%`+
    ` arrived within 45 minutes.]`,
  stats: [
    {id:'orders', label:'[Deliveries]', value: h => h.fmt(h.one('totals').orders)},
    {id:'revenue', label:'[Order value, €]', value: h => h.fmt(h.one('totals').revenue)},
    {id:'minutes', label:'[Average minutes]', value: h => h.fmt(h.one('totals').minutes, 1)},
    {id:'on-time', label:'[Within 45 minutes]', value: h => h.fmt(h.one('totals').on_time)+'%'},
  ],
  charts: [
    {id:'weekly', title:'[Deliveries per week]', mark:'line', query:'weekly', x:'week',
      y:'orders', wide:true},
    {id:'cities', title:'[Deliveries by city]', mark:'map', query:'cities', x:'city', y:'orders',
      lat:'lat', lon:'lon', filter:'city'},
    {id:'categories', title:'[Deliveries by category]', mark:'bar', query:'categories',
      x:'category', y:'orders', filter:'category'},
    {id:'monthly', title:'[Deliveries per month, by city]', mark:'line', query:'monthly',
      x:'month', y:'orders', series:'city', multiples:true, wide:true},
    {id:'hours', title:'[When orders come in]', mark:'rect', query:'hours', x:'hour', y:'orders',
      series:'weekday', wide:true},
    {id:'minutes', title:'[How long a delivery takes]', mark:'bar', query:'minutes',
      x:'minutes_from', y:'orders'},
    {id:'distance', title:'[Distance against minutes]', mark:'point', query:'distance',
      x:'distance_km', y:'minutes', table:false},
  ],
  sections: [
    {id:'reading', title:'[How to read this]', text: h => `[Each extra kilometre adds about `+
      `${h.fmt(h.one('per_km').minutes, 1)} minutes; pick a city or a category to compare.]`},
  ],
};
</script>
<style>
*{box-sizing:border-box}body{line-height:1.6}
main{max-width:1180px;margin:auto;padding:clamp(24px,5vw,72px)}h1{max-width:20ch;margin:12px 0 24px}
p{max-width:68ch}.muted{opacity:.72}.lead{font-size:clamp(19px,3vw,26px);line-height:1.5}
.number{font-variant-numeric:tabular-nums}[role=status]{min-height:1.6em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:24px 0}
.stats div{border-top:2px solid currentColor;padding-top:8px}.stats b{display:block;font-size:30px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));
  gap:clamp(24px,5vw,56px)}.charts>.wide{grid-column:1/-1}
.charts>*,.sections>*{min-width:0}.rule{border-top:1px solid var(--border);padding-top:24px}
.chart{width:100%;min-height:240px}.chart svg{max-width:100%;height:auto}
.map{position:relative;height:360px;border:1px solid var(--border);background:var(--muted)}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:2.4em}
button{font:inherit;color:inherit;background:transparent;border:1px solid var(--border);
  border-radius:var(--radius);padding:2px 10px;cursor:pointer}
button[aria-pressed=true],.filters button{background:var(--primary);color:var(--primary-foreground)}
summary{cursor:pointer;margin-top:12px}.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;margin-top:12px}
td,th{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left}td{text-align:right}
@media(max-width:640px){h1{font-size:38px!important}main{padding:24px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head><body><main>
<p id="kicker" class="muted"></p>
<h1 id="title" class="t-display-xl"></h1>
<p id="lead" class="lead number"></p>
<p id="status" role="status" aria-live="polite">Loading the linked dataset…</p>
<div id="filters" class="filters"></div>
<div id="stats" class="stats number"></div>
<div id="charts" class="charts"></div>
<div id="sections" class="sections"></div>
</main>
<script type="module" src="./csv-dashboard.mjs"></script>
</body></html>
