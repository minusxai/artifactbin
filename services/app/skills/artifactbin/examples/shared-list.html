<!doctype html>
<!-- Example: a shared sign-up list. Usage: and Gotchas: are above APP; keep this line. -->
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="artifactbin:design-system" content="signout">
<title>[List name]</title><!-- the list's name: the heading, the tab and link previews -->
<link rel="af-dataset" data-af-name="entries" href="ref:DATASET_ID">
<script type="module" id="app-config">
// A list anyone with the link reads; signed-in people add entries and change or remove only
//   their own: sign-up sheets, RSVPs, potlucks, rosters.
// Usage: node scripts/new-app.mjs --kind list --title "NAME" sets this page up as index.html
//   with its entries dataset and rules, and prints the next step: edit only APP, then publish
//   and check (node scripts/new-app.mjs --help).
// Gotchas: who may add, edit or remove comes from the server (entries_can and each row's _can);
//   never decide it in page script. The page owner may change every entry.
// Built with: one HTML page; an entries dataset with own-rows rules (everyone reads; signed-in
//   people add entries stamped as theirs and change or remove only those), written directly
//   through its generated GraphQL API.
// The only part to edit. Each entry is a name, one of choices and an optional note.
window.APP = {
  kicker: '[Event · dates]',
  summary: '[What people sign up for, and what to bring.]',
  choiceLabel: '[Shift]', noteLabel: '[Bringing or note (optional)]', addLabel: '[Sign up]',
  choices: ['[First choice]', '[Second choice]', '[Third choice]']};
</script>
<style>
*{box-sizing:border-box}body{line-height:1.5}
main{max-width:820px;margin:auto;padding:clamp(20px,4vw,48px)}p{max-width:68ch}.muted{opacity:.75}
button,input,select{font:inherit;padding:8px 12px;color:inherit;background:var(--background);
  border:1px solid currentColor;border-radius:4px}button{cursor:pointer}
button.primary{background:var(--primary);color:var(--primary-foreground);border-color:transparent}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}[role=status]{min-height:1.5em}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.3fr) auto;
  gap:12px;align-items:end}.fields label{display:grid;gap:4px;min-width:0}
.fields input,.fields select{width:100%}
#add{border:1px solid var(--border);border-radius:6px;padding:16px;margin:20px 0}
.choice{margin-top:28px}.choice h2{display:flex;justify-content:space-between;gap:12px;
  border-bottom:2px solid currentColor;padding-bottom:6px;margin:0}
.choice ul{list-style:none;margin:0;padding:0}
.choice li{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;padding:10px 0;
  border-bottom:1px solid var(--border)}.choice li .who{flex:1 1 220px;min-width:0}
.choice li .note{display:block}.actions{display:flex;gap:8px}.choice li form{flex:1 1 100%}
@media(max-width:720px){.fields{grid-template-columns:1fr}}
</style>
</head><body><main>
<p id="kicker" class="muted"></p><h1 id="title" class="t-display-l"></h1><p id="summary"></p>
<form id="add" hidden><div class="fields">
<label>Name<input id="add-name" required maxlength="80" autocomplete="name"></label>
<label><span id="choice-label"></span><select id="add-choice"></select></label>
<label><span id="note-label"></span><input id="add-note" maxlength="140"></label>
<button id="add-button" class="primary" type="submit"></button></div></form>
<p id="signin" hidden>Sign in to add yourself. Anyone with the link can see the list.</p>
<p id="status" role="status" aria-live="polite">Loading…</p>
<div id="lists" aria-busy="true"></div>
</main>
<script type="module">
import {client,gql,onResolverChange} from '@afbin/apollo';
const APP=window.APP,$=s=>document.querySelector(s),status=$('#status');
// What this viewer may do comes from the server: entries_can.insert and each row's _can.
const listQuery=gql`{entries(order_by:{name:asc},limit:1000){_id name choice note
  _can{update delete}} entries_can{insert} viewer{signedIn}}`;
const insert=gql`mutation Add($o:entries_insert_input!){insert_entries_one(object:$o){_id}}`;
const update=gql`mutation Edit($id:ID!,$s:entries_set_input!){
  update_entries_by_pk(pk_columns:{_id:$id},_set:$s){_id}}`;
const remove=gql`mutation Remove($id:ID!){delete_entries_by_pk(_id:$id){_id}}`;
let rows=[],canAdd=false,signedIn=false,editing=null;
for(const [id,text] of Object.entries({kicker:APP.kicker,title:document.title,summary:APP.summary,
  'choice-label':APP.choiceLabel,'note-label':APP.noteLabel,'add-button':APP.addLabel}))
  $('#'+id).textContent=text;
const options=selected=>APP.choices.map(c=>new Option(c,c,false,c===selected));
$('#add-choice').replaceChildren(...options(APP.choices[0]));
const done=result=>{if(result.errors?.length)throw Error(result.errors[0].message);return result;};
async function load(){
  const {data}=done(await client.query({query:listQuery,fetchPolicy:'network-only'}));
  rows=data.entries.map(r=>({id:r._id,name:r.name??'',choice:r.choice??'',note:r.note??'',
    can:r._can}));canAdd=data.entries_can.insert;signedIn=data.viewer.signedIn;}
// Script-made nodes take data-af-ids from the entry's _id or the choice, stable across renders.
const node=(tag,id,props={})=>{const n=Object.assign(document.createElement(tag),props);
  if(id)n.dataset.afId=id;return n;};
const slug=text=>text.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function rowView(row){
  const key='entry-'+row.id,li=node('li',key);
  if(editing===row.id){
    const form=node('form',key+'-form',{className:'fields'}),name=node('input',key+'-name-input',
      {value:row.name,required:true,maxLength:80}),choice=node('select',key+'-choice-input'),
      note=node('input',key+'-note-input',{value:row.note,maxLength:140});
    choice.replaceChildren(...options(row.choice));
    const label=(text,input)=>{const l=node('label');l.append(text,input);return l;};
    const actions=node('div',null,{className:'actions'});
    actions.append(node('button',key+'-save',{type:'submit',className:'primary',textContent:'Save'}),
      node('button',key+'-cancel',{type:'button',textContent:'Cancel',onclick:()=>{editing=null;
        render();}}));
    form.append(label('Name',name),label(APP.choiceLabel,choice),label(APP.noteLabel,note),actions);
    form.onsubmit=event=>{event.preventDefault();void write(`Saved ${name.value.trim()}.`,{
      mutation:update,variables:{id:row.id,s:{name:name.value.trim(),choice:choice.value,
        note:note.value.trim()}}});};
    li.append(form);return li;
  }
  const who=node('span',key+'-who',{className:'who'});
  who.append(node('strong',key+'-name',{textContent:row.name}));
  if(row.note)who.append(node('span',key+'-note',{className:'note muted',textContent:row.note}));
  li.append(who);
  // Edit and Remove only where the server says this viewer may change the entry.
  if(row.can.update||row.can.delete){const actions=node('div',key+'-actions',{className:'actions'});
    if(row.can.update)actions.append(node('button',key+'-edit',{type:'button',textContent:'Edit',
      ariaLabel:'Edit '+row.name,onclick:()=>{editing=row.id;render();}}));
    if(row.can.delete)actions.append(node('button',key+'-remove',{type:'button',
      textContent:'Remove',ariaLabel:'Remove '+row.name,onclick:()=>void write(
        `Removed ${row.name}.`,{mutation:remove,variables:{id:row.id}})}));
    li.append(actions);}
  return li;
}
function render(){
  $('#add').hidden=!canAdd;$('#signin').hidden=canAdd||signedIn;
  // Every listed choice gets a section; an entry whose choice is no longer listed goes under Other.
  const listed=new Set(APP.choices),other=rows.filter(r=>!listed.has(r.choice));
  const groups=[...APP.choices.map(c=>[c,rows.filter(r=>r.choice===c)]),
    ...other.length?[['Other',other]]:[]];
  $('#lists').replaceChildren(...groups.map(([choice,list])=>{
    const key='choice-'+slug(choice),section=node('section',key,{className:'choice'});
    const h2=node('h2',key+'-title',{className:'t-title'});
    h2.append(node('span',key+'-name',{textContent:choice}),node('span',key+'-count',{
      className:'muted',textContent:`${list.length} signed up`}));
    const ul=node('ul',key+'-list');
    ul.append(...list.length?list.map(rowView):[node('li',key+'-empty',{className:'muted',
      textContent:'No one yet.'})]);
    section.append(h2,ul);return section;}));
  $('#lists').setAttribute('aria-busy','false');
}
// One write, then a fresh read; the status names what happened, or what went wrong.
async function write(message,request){status.textContent='Saving…';
  try{done(await client.mutate(request));editing=null;await load();render();
    status.textContent=message;return true;}
  catch(error){status.textContent=error.message||'Could not save.';return false;}}
$('#add').onsubmit=async event=>{event.preventDefault();const name=$('#add-name').value.trim();
  if(!name)return;
  if(await write(`Added ${name} to ${$('#add-choice').value}.`,{mutation:insert,variables:{o:{
    name,choice:$('#add-choice').value,note:$('#add-note').value.trim()}}}))
    $('#add-name').value=$('#add-note').value='';};
// Someone else's change, or signing in or out, refreshes the list. While an entry is open for
//   editing the list is not redrawn (that would drop what was typed); saving or Cancel redraws it.
onResolverChange(names=>{if(names.includes('entries')||names.includes('viewer'))void load()
  .then(()=>{if(editing&&rows.some(r=>r.id===editing))return;editing=null;render();})
  .catch(()=>{});});
try{await load();render();status.textContent=`${rows.length} signed up so far.`;}
catch(error){status.textContent=error.message||'Could not load the list.';}
</script>
</body></html>
