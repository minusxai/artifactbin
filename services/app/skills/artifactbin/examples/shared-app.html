<!doctype html>
<!-- Example: a shared budget dashboard. Usage: and Gotchas: are above APP; keep this line. -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="artifactbin:design-system" content="almanac">
<title>Shared dashboard</title>
<link rel="af-dataset" data-af-name="transactions" href="ref:DATASET_ID" data-af-mode="live">
<link rel="af-backend" data-af-name="budget" href="./garden.ts">
<script type="module" id="app-config">
// KPIs, targets per category, a monthly trend, payers, a drill-down, per-viewer dark mode (Apollo
//   local state) and a signed-in target editor (backend store).
// Usage: copy it as index.html with garden.ts, gen-transactions.mjs and shared-app-steps, -guest
//   and -cleanup .mjs (as steps, guest, cleanup.mjs); run the generator once, publish its CSV
//   (--type dataset), put the ID after ref:; edit only APP (defaultTargets: plausible monthly
//   amounts) and garden.ts's names; then node scripts/publish.mjs index.html && node
//   scripts/check.mjs index.html --steps steps.mjs --guest-steps guest.mjs --cleanup-steps
//   cleanup.mjs. Gotchas: the dataset and backend need different data-af-name values; never
//   publish the ref: placeholder. The comment at the top may stay as it is.
// The only part to edit. columns maps roles to the dataset's column labels.
window.APP = {
  dataset: 'transactions', backend: 'budget', currency: 'USD',
  columns: {date:'date', category:'category', amount:'amount', payer:'payer', merchant:'merchant'},
  title: '[Household budget]', kicker: '[Our money] · sample data',
  summary: '[What we planned against what we spent, month by month.]',
  labels: {list:'Spend vs target', trend:'Spent vs budget', payer:'Who paid what'},
  // Monthly budget per category until a shared target is saved; clearing one reverts to it.
  defaultTargets: {Rent:1650, Groceries:700, 'Dining out':380, Transport:200, Utilities:120,
    Internet:55},
};
</script>
<style>
*{box-sizing:border-box}body{line-height:1.5}.number{font-variant-numeric:tabular-nums}
main{max-width:1120px;margin:auto;padding:clamp(20px,4vw,48px)}.muted{opacity:.7}p{max-width:68ch}
button,input,select{font:inherit;padding:8px 12px;color:inherit;background:var(--background);
  border:1px solid currentColor;border-radius:4px}button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}[role=status]{min-height:1.5em}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:20px 0}
.kpis div{border-top:2px solid currentColor;padding-top:8px}.kpis b{display:block;font-size:28px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,48px)}
.grid>*{min-width:0}.chart{width:100%;min-height:220px}.chart svg{max-width:100%;height:auto}
#cats{list-style:none;margin:0;padding:0}#cats button{width:100%;text-align:left;border:0;
  border-top:1px solid var(--border);border-radius:0;padding:10px 4px;display:grid;gap:6px}
#cats button[aria-pressed=true]{background:var(--accent);color:var(--accent-foreground)}
.bar{height:8px;background:var(--muted)}.bar i{display:block;height:100%;background:var(--primary)}
.over .bar i{background:var(--destructive)}
#drill li{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--border);
  padding:8px 0}#drill ul{list-style:none;margin:0;padding:0}
@media(max-width:720px){.grid,.kpis{grid-template-columns:1fr}}
</style>
<script type="application/json" data-af="state">{"dark":null,"month":"","category":""}</script>
</head><body><main>
<p id="kicker" class="muted"></p><h1 id="title" class="t-display-l"></h1><p id="summary"></p>
<div class="toolbar"><label for="month">Month</label><select id="month"></select>
<button id="dark" type="button" aria-pressed="false">Dark mode</button></div>
<p id="status" role="status" aria-live="polite">Loading…</p>
<div class="kpis number"><div>Spent<b id="spent">–</b></div><div>Target<b id="target">–</b>
</div><div>Left<b id="left">–</b></div></div>
<div class="grid"><section><h2 id="list-title" class="t-title"></h2><ul id="cats"></ul></section>
<section id="drill"><h2 id="drill-title" class="t-title"></h2><ul id="rows"></ul>
<form id="editor" class="toolbar"><label for="amount">Shared target</label>
<input id="amount" type="number" min="0" step="1" style="width:8em" title="Empty clears it">
<button type="submit">Save target</button></form></section>
<section><h2 id="trend-title" class="t-title"></h2><div id="trend" class="chart"></div>
<p class="muted">Budget = current targets applied to every month.</p></section>
<section><h2 id="payer-title" class="t-title"></h2><div id="payer" class="chart"></div>
<p id="payers" class="number"></p></section>
</div></main>
<script type="module">
import {client,gql,onBackendChange} from '@afbin/apollo';
import * as vega from '@afbin/vega';
import {compile} from '@afbin/vega-lite';
const APP=window.APP,C=APP.columns,$=s=>document.querySelector(s),status=$('#status');
const money=new Intl.NumberFormat(undefined,{style:'currency',currency:APP.currency});
const preference=gql`{dark month category}`;
// Queries name the dataset (D) and backend (B) from APP; gql also takes a one-string array.
const q=text=>gql([text]),D=APP.dataset,B=APP.backend;
const schema=q(`{${D}{schema{revision tables{id columns{id label}}}}}`);
const rowsQuery=q(`query Rows($t:ID!,$after:String){${D}{rows(tableId:$t,first:100,after:$after){`
  +'revision rows{id cells{columnId value{string number}}} pageInfo{hasNextPage endCursor}}}}');
const targetsQuery=q(`query T($d:String){${B}{signedIn targets(defaults:$d){category amount}}}`);
const setTarget=q(`mutation S($c:String!,$a:Float!){${B}{setTarget(category:$c,amount:$a){amount}}}`
  ),clear=q(`mutation C($c:String!){${B}{clearTarget(category:$c)}}`);
let rows=[],targets={},signedIn=false,state={dark:null,month:'',category:''},views={};
document.title=APP.title;for(const [id,text] of Object.entries({kicker:APP.kicker,title:APP.title,
  summary:APP.summary,'list-title':APP.labels.list,'trend-title':APP.labels.trend,
  'payer-title':APP.labels.payer}))$('#'+id).textContent=text;
async function loadRows(){
  const found=await client.query({query:schema}),need=Object.entries(C);
  if(found.errors?.length)throw Error(found.errors[0].message);
  const table=found.data[APP.dataset].schema.tables.find(table=>need.every(([,label])=>
    table.columns.some(column=>column.label===label)));
  if(!table)throw Error(`Dataset needs columns ${need.map(([,label])=>label).join(', ')}.`);
  const ids=Object.fromEntries(table.columns.map(column=>[column.label,column.id])),out=[];
  let after=null,revision=null;
  do{
    const result=await client.query({query:rowsQuery,variables:{t:table.id,after}});
    if(result.errors?.length)throw Error(result.errors[0].message);
    // Every page at one revision; a mid-read change stops with "Data changed while loading."
    const page=result.data[APP.dataset].rows;if((revision??page.revision)!==page.revision)
      throw Error('Data changed while loading.');revision=page.revision;
    for(const row of page.rows){
      const cell=Object.fromEntries(row.cells.map(c=>[c.columnId,c.value])),v=k=>cell[ids[C[k]]];
      out.push({id:row.id,amount:v('amount')?.number??0,...Object.fromEntries(['date','category',
        'payer','merchant'].map(k=>[k,v(k)?.string??'']))});
    }
    after=page.pageInfo.hasNextPage?page.pageInfo.endCursor:null;
  }while(after);
  rows=out.filter(row=>row.date);
}
async function loadTargets(){const result=await client.query({query:targetsQuery,variables:{d:
  JSON.stringify(APP.defaultTargets??{})}});if(result.errors?.length)throw Error(result.errors[0]
  .message);signedIn=result.data[B].signedIn;
  targets=Object.fromEntries(result.data[B].targets.map(t=>[t.category,t.amount]));}
const unique=list=>[...new Set(list)].sort(),months=()=>unique(rows.map(r=>r.date.slice(0,7)));
const sum=list=>list.reduce((total,r)=>total+r.amount,0),cats=()=>unique(rows.map(r=>r.category));
const month=()=>months().includes(state.month)?state.month:months().at(-1);
const inMonth=(m=month())=>rows.filter(row=>row.date.startsWith(m));
const budget=()=>cats().reduce((total,cat)=>total+(targets[cat]??0),0);
// Script-made nodes take data-af-ids from the record (category or row id), stable across renders.
const item=(id,tag='li')=>{const n=document.createElement(tag);n.dataset.afId=id;return n;};
function render(){if(!rows.length)return;
  const list=inMonth(),spent=sum(list),target=budget(),current=state.category||cats()[0];
  $('#month').replaceChildren(...months().map(m=>new Option(m,m,false,m===month())));
  for(const [id,value] of [['spent',spent],['target',target],['left',target-spent]])
    $('#'+id).textContent=money.format(value);
  $('#cats').replaceChildren(...cats().map(cat=>{
    const li=item('cat-'+cat),button=item('cat-'+cat+'-open','button'),goal=targets[cat];
    const got=sum(list.filter(row=>row.category===cat)),over=goal!=null&&got>goal;
    button.type='button';button.setAttribute('aria-pressed',String(cat===current));
    button.textContent=`${cat}: ${money.format(got)} of `;button.append(Object.assign(item(
      `cat-${cat}-target`,'span'),{textContent:goal!=null?money.format(goal):'none'}));
    if(over)button.append(Object.assign(item(`cat-${cat}-over`,'b'),{textContent:` ▲ over by `+
      money.format(got-goal)}));
    const bar=item('cat-'+cat+'-bar','span');bar.className='bar';li.classList.toggle('over',over);
    button.append(bar);bar.appendChild(document.createElement('i')).style.width=Math.min(100,goal?
      got/goal*100:0)+'%';
    button.onclick=()=>{$('#editor').dataset.for=cat;$('#amount').value=targets[cat]??'';
      setLocal({category:cat});};li.append(button);return li;})); // the render keeps typed values
  const cat=current,picked=list.filter(row=>row.category===cat),n=picked.length;
  $('#drill-title').textContent=`${cat} · ${month()} · ${n} rows · ${money.format(sum(picked))}`;
  $('#rows').replaceChildren(...picked.map(row=>{
    const li=item('row-'+row.id),b=item(`row-${row.id}-amount`,'b');
    li.textContent=`${row.date} ${row.merchant} (${row.payer} paid)`;
    b.textContent=money.format(row.amount);li.append(b);return li;}),...n?[]:[Object
    .assign(item('rows-empty'),{textContent:'No rows in this category this month.'})]);
  // Guests see a disabled "Sign in to edit"; the field refills only when the category changes.
  Object.assign($('#editor button'),{disabled:!signedIn,textContent:signedIn?'Save target':
    'Sign in to edit'});if($('#editor').dataset.for!==cat)[$('#editor').dataset.for,
    $('#amount').value]=[cat,targets[cat]??''];
  $('#payers').textContent=unique(list.map(r=>r.payer)).map(p=>{const t=sum(list.filter(r=>
    r.payer===p));return `${p} ${money.format(t)} (${Math.round(t/(spent||1)*100)}%)`;}).join(', ');
  void drawCharts(list);
}
const token=name=>getComputedStyle(document.documentElement).getPropertyValue(name).trim();
async function chart(key,values,mark,x,color,y){
  views[key]?.finalize();const ink=token('--foreground'),sumY={aggregate:'sum',field:y,
    type:'quantitative'},sort=key==='trend'?null:'ascending'; // trend: data (month) order
  const spec=compile({width:'container',height:200,autosize:{type:'fit',contains:'padding'},
    background:'transparent',data:{values},mark:{type:mark,point:mark==='line'},encoding:{
      x:{field:x,type:'ordinal',sort,title:null,axis:{labelAngle:0}},color:{field:color,
        type:'nominal',title:null},y:{...sumY,title:null,axis:{format:',.0f'}},tooltip:[{field:x,
        type:'nominal'},{field:color,type:'nominal'},{...sumY,format:',.2f'}]},config:{view:{
      stroke:null},axis:{labelColor:ink,domainColor:ink,tickColor:ink,gridColor:token('--border')},
      legend:{labelColor:ink,titleColor:ink,orient:'bottom'},range:{category:[token('--primary'),
        token('--chart-2'),token('--chart-3'),token('--chart-4'),token('--chart-5'),ink]}}}).spec;
  views[key]=new vega.View(vega.parse(spec,undefined,{ast:true}),{container:$('#'+key),
    renderer:'svg',expr:vega.expressionInterpreter});await views[key].runAsync();
}
const drawCharts=list=>Promise.all([chart('trend',months().flatMap(m=>[{month:m,series:'Spent',
  value:sum(inMonth(m))},{month:m,series:'Budget',value:budget()}]),'line','month','series',
  'value'),chart('payer',list,'bar','payer','category','amount')]);
const applyDark=dark=>{if(typeof dark==='boolean')document.documentElement.dataset.afDark=dark;
  $('#dark').setAttribute('aria-pressed',document.documentElement.dataset.afDark==='true');};
// Local state holds this viewer's saved choices from the first read; write only on a viewer action.
client.watchQuery({query:preference}).subscribe(({data})=>{state=data;applyDark(data.dark);
  render();});
const setLocal=patch=>client.updateQuery({query:preference},s=>({...s,...patch}));
$('#dark').onclick=()=>setLocal({dark:document.documentElement.dataset.afDark!=='true'});
$('#month').onchange=event=>setLocal({month:event.target.value});
$('#editor').onsubmit=async event=>{
  event.preventDefault();const c=event.target.dataset.for;status.textContent='Saving…';
  try{ // An empty field clears the saved target (back to the default); a number sets it.
    const raw=$('#amount').value,result=await client.mutate(raw===''?{mutation:clear,variables:{c}}:
      {mutation:setTarget,variables:{c,a:Number(raw)}});
    if(result.errors?.length)throw Error(result.errors[0].message);
    event.target.dataset.for='';await loadTargets();render();
    status.textContent=`Saved the ${c} target for everyone.`;
  }catch(error){status.textContent=(error.message||'Could not save.')+' Sign in to edit targets.';}
};
new MutationObserver(()=>{if(rows.length)void drawCharts(inMonth());})
  .observe(document.documentElement,{attributes:true,attributeFilter:['data-af-dark']});
// A shared change from another reader refreshes the numbers but leaves #status alone.
onBackendChange(names=>{if(names.includes(APP.backend))void loadTargets().then(render);});
try{await Promise.all([loadRows(),loadTargets()]);render();
  status.textContent=`Loaded ${rows.length} sample transactions across ${months().length} months.`;
}catch(error){status.textContent=error.message||'Could not load the data.';}
</script>
</body></html>
