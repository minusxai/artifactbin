name: exp overhead labels
# Experiment only (branch exp/ci-overhead, never merged): runner labels other than ubuntu-latest.
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  paired-arm:
    name: paired-arm (${{ matrix.i }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy: { fail-fast: false, matrix: { i: [ 1, 2, 3, 4 ] } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: npm ci --no-audit --no-fund
      - id: test-builds-key
        run: node scripts/ci/ci.mjs test-builds-key
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            services/app/lib/build-assets
            services/app/public/libraries
          key: test-builds-v2-${{ runner.os }}-${{ steps.test-builds-key.outputs.key }}
          restore-keys: test-builds-v2-${{ runner.os }}-
      - run: lscpu | grep -iE 'model name|^CPU\(s\)'; node -v
      - name: paired api runs on arm
        run: |
          A="--project=api --project=api-isolated --shard=3/22"
          P=scripts/exp/paired.sh
          $P cold-base $A; $P base $A; $P w4 $A --maxWorkers=4; $P base $A; $P w4 $A --maxWorkers=4; $P fsmc-fill $A --experimental.fsModuleCache; $P fsmc $A --experimental.fsModuleCache
          $P g-base --config vitest.guard.config.ts; $P g-shared --config vitest.exp-guard-shared.config.ts
