name: ci

on:
  pull_request:
  push:
    branches: [ main, artifactbinv3 ]
  workflow_dispatch:

# New commits supersede earlier checks on the same PR — through the `supersede` job, NOT a workflow-level
# `concurrency` group. With cancel-in-progress the group holds the new run pending until the cancelled one has
# fully stopped, its always() roll-up included: run 38627878372's plan started 84s after the run did, 3s after
# run 38627752110 finished cancelling (and run 38535795832 waited 80s on 38535259485 the same way). Main runs
# were never grouped and stay independent.

# Jobs read the repo.
permissions:
  contents: read

# Wall time is the point: the old single job ran everything serially (7m+, of
# which npm test was 5m — ~330s of aggregate api-suite work meeting 4 shared
# vCPUs). The suite now fans out: fast checks + the two lighter vitest
# projects in one job, the production build in another, and the heavy api project
# SHARDED across the matrix below. Each shard is its own PGLite process, so the
# no-parallel-projects rule (one embedded connection per process) still holds
# within every job.
jobs:
  # CANCELS THIS PULL REQUEST'S EARLIER, STILL-RUNNING CI RUNS, and nothing waits for it: neither `plan` nor the
  # `test` roll-up needs it, so the new run starts at once while the old one winds down beside it
  # (scripts/lib/ci-supersede.mjs, builtin-only: no install).
  supersede:
    if: (github.event_name != 'pull_request' || github.base_ref != 'artifactbinv3') && github.event_name == 'pull_request'
    name: supersede earlier runs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: scripts/lib
      - name: Cancel this pull request's earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          WORKFLOW_FILE: ci.yml
        run: node scripts/lib/ci-supersede.mjs

  plan:
    if: (github.event_name != 'pull_request' || github.base_ref != 'artifactbinv3')
    name: affected modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Finding the run that already tested this tree reads the repository's artifact list. A job-level
    # block REPLACES the workflow's, so `contents: read` is restated rather than inherited.
    permissions:
      contents: read
      actions: read
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      checks: ${{ steps.select.outputs.checks }}
      node: ${{ steps.select.outputs.node }}
      integration: ${{ steps.select.outputs.integration }}
      ui: ${{ steps.select.outputs.ui }}
      build: ${{ steps.select.outputs.build }}
      api: ${{ steps.select.outputs.api }}
      gates: ${{ steps.select.outputs.gates }}
      # The exact-tree package producer: prior run for tree reuse, current run for patch reuse.
      source-run: ${{ steps.select.outputs.source-run }}
    steps:
      # NO setup-node, here or in the `test` roll-up: both ends of every run's chain run builtin-only scripts
      # (scripts/__tests__/ci-plan.test.mjs holds their imports to node:*), which the runner's own Node runs, and
      # resolving a toolcache Node cost 4-5s in each (runs 38615330920, 38627878372).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: select
        env:
          CI__EVENT: ${{ github.event_name }}
          CI__REF: ${{ github.ref }}
          CI__BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI__BEFORE_SHA: ${{ github.event.before }}
          CI__HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/ci.mjs plan

  # THE TYPE CHECK ANSWERS ON ITS OWN, because it is the fastest signal on the
  # commonest mistake and it was sharing a job with something 5x its length.
  checks:
    needs: [ plan ]
    if: needs.plan.outputs.checks == 'true'
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # Cache THE WHOLE INSTALL, not just npm's download cache: `npm ci` costs ~23s in every job
      # even with a warm ~/.npm. The install's products are not all inside node_modules — the app
      # workspace's postinstall (copy-assets.mjs) writes the content-hashed webfonts under
      # public/fonts and the manifest lib/data/story/story-fonts reads, and a build without them
      # serves every document with missing fonts. They derive from node_modules alone, so they
      # belong in the same entry under the same lockfile key; caching node_modules by itself is
      # what forced a hand-run copy-assets step into all eight jobs, because on a cache HIT
      # `npm ci` — and therefore its postinstall — never runs at all. A partial restore is not
      # silent: lib/data/story/__tests__/story-fonts.test.ts reads the manifest and the bytes.
      # The key is the lockfile with workspace versions normalised: a dependency that moved changes it,
      # a workspace version bump does not.
      - run: node scripts/ci/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'design-systems/fonts.json', 'services/app/scripts/system-font-packages.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      # A WORKFLOW TYPO IS ONLY EXPENSIVE WHEN THE RUNNER FINDS IT. actionlint parses every workflow
      # here (and shellcheck reads every `run:` block) in about a second, in a pinned image anyone can
      # run locally: `docker run --rm -v "$PWD":/repo --workdir /repo rhysd/actionlint:1.7.7 -color`.
      - name: Lint the workflows
        run: docker run --rm -v "$PWD":/repo --workdir /repo rhysd/actionlint:1.7.7 -color
      - run: npm run validate
      - name: v3 fast-lane coverage and syntax
        if: github.ref == 'refs/heads/artifactbinv3'
        run: node scripts/ci/fast-check.mjs

  # THE NODE PROJECT SHARDS, like api and ui: four, packed by measured file time
  # (scripts/lib/timed-sequencer.mjs over scripts/ci/test-timings.json), and NOTHING ELSE. The integration
  # project is its own job below, beside these shards rather than after one of them.
  node:
    needs: [ plan ]
    if: needs.plan.outputs.node == 'true'
    name: node tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4 ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # The whole-install cache, and why its key is a normalised lockfile rather than the lockfile
      # itself: see the `checks` job above, which carries the full note.
      - run: node scripts/ci/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'design-systems/fonts.json', 'services/app/scripts/system-font-packages.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      # The test global setup builds the server reader and the islands behind content-verified
      # markers: 38s of every cold shard. Restore the latest build (this PR's, else main's); a marker
      # that no longer matches this tree rebuilds, so a stale restore costs only the build it replaces.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: test-builds
        with:
          path: |
            services/app/public/islands
            services/app/lib/build-assets
            node_modules/.cache/build-islands.json
          key: test-builds-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: test-builds-v1-${{ runner.os }}-
      - env:
          CI__PLAN: ${{ needs.plan.outputs.plan }}
        run: node scripts/ci/ci.mjs node ${{ matrix.shard }}/4

  # The heavy tests that `npm test` leaves out — a disposable Dockerised Postgres and real Chromium — live in
  # the `integration` project, selected wherever the node project is. Run once; no --passWithNoTests, so a
  # rename that empties the include fails loudly instead of passing vacuously.
  integration:
    needs: [ plan ]
    if: needs.plan.outputs.integration == 'true'
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # The whole-install cache, and why its key is a normalised lockfile rather than the lockfile
      # itself: see the `checks` job above, which carries the full note.
      - run: node scripts/ci/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'design-systems/fonts.json', 'services/app/scripts/system-font-packages.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: playwright
        with:
          path: |
            ~/.cache/ms-playwright/chromium-*
            ~/.cache/ms-playwright/chromium_headless_shell-*
            ~/.cache/ms-playwright/ffmpeg-*
          key: playwright-v2-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      # No `--with-deps`: ubuntu-latest already ships Chromium's system libraries, so a cache miss costs the
      # download alone, not an apt pass (~30s).
      - run: npx playwright install chromium
      - run: docker pull postgres:17-alpine
      # The test global setup builds the server reader and the islands behind content-verified
      # markers: 38s of every cold shard. Restore the latest build (this PR's, else main's); a marker
      # that no longer matches this tree rebuilds, so a stale restore costs only the build it replaces.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: test-builds
        with:
          path: |
            services/app/public/islands
            services/app/lib/build-assets
            node_modules/.cache/build-islands.json
          key: test-builds-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: test-builds-v1-${{ runner.os }}-
      - run: npm run test:integration

  # jsdom setup dominates the ui project (~110s serial on a 4-vCPU runner —
  # the environment boots per test file), so it shards like api does. Two shards ran 186s and 119s
  # on run 36608202961 — over the ~150s per-job target — so it split three, then four ways. Three
  # again after run 36838282615 (four shards, 84-129s): the gates, not this job, set the run's path.
  # TWO: three ran 38-44s of work each, so two (~80s warm) stay
  # under the gates.
  ui:
    needs: [ plan ]
    if: needs.plan.outputs.ui == 'true'
    name: ui tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2 ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # The whole-install cache, and why its key is a normalised lockfile rather than the lockfile
      # itself: see the `checks` job above, which carries the full note.
      - run: node scripts/ci/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'design-systems/fonts.json', 'services/app/scripts/system-font-packages.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      # The test global setup builds the server reader and the islands behind content-verified
      # markers: 38s of every cold shard. Restore the latest build (this PR's, else main's); a marker
      # that no longer matches this tree rebuilds, so a stale restore costs only the build it replaces.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: test-builds
        with:
          path: |
            services/app/public/islands
            services/app/lib/build-assets
            node_modules/.cache/build-islands.json
          key: test-builds-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: test-builds-v1-${{ runner.os }}-
      - run: npx vitest run --project=ui --project=islands --shard=${{ matrix.shard }}/2

  # The BUILD catches what tsc and vitest cannot: a route the generated table
  # has not seen, an import that only resolves under the bundler, a SPA module
  # that reaches for server config. It builds the story runtime, the route
  # table, the SPA and the bundled server — everything the server serves.
  # Master shipped a broken build once because CI never ran it, and deploys
  # silently stopped.
  build:
    needs: [ plan ]
    if: needs.plan.outputs.build == 'true'
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # The whole-install cache, and why its key is a normalised lockfile rather than the lockfile
      # itself: see the `checks` job above, which carries the full note.
      - run: node scripts/ci/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'design-systems/fonts.json', 'services/app/scripts/system-font-packages.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      # THE SAME SOURCES BUILD THE SAME BYTES. The key hashes git's object ids for every build input
      # (scripts/lib/ci-plan.mjs `isBuildInput`: not tests, gates, workflows or prose), so a push that
      # changed only those restores the last build of these sources and skips the ~75s below. No
      # restore-keys: a near miss would serve an older server and SPA, which is worse than building.
      - id: build-key
        run: node scripts/ci/ci.mjs build-key
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: build-cache
        with:
          path: |
            dist
            services/app/dist
            services/app/lib/build-assets
            services/app/public/islands
            services/app/public/libraries
            services/app/server/routes.generated.ts
          key: app-build-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ steps.build-key.outputs.key }}
      # The island and server-reader builds inside `npm run build` take `--cache` (build-prep.mjs):
      # restoring the test shards' builds turns the ~27s island build into a marker check.
      - if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: test-builds
        with:
          path: |
            services/app/public/islands
            services/app/lib/build-assets
            node_modules/.cache/build-islands.json
          key: test-builds-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: test-builds-v1-${{ runner.os }}-
      # NO GATE WAITS FOR THIS JOB: each gate shard builds what it runs (scripts/build/build-gate-inputs.mjs)
      # while it provisions browsers. This job proves the production build and caches it for a rerun.
      - if: steps.build-cache.outputs.cache-hit != 'true'
        run: npm run build

  # On PRs #158 and #159, five shards spent up to 215s in Vitest and 25s
  # provisioning Chromium. Eight spread the growing API file set while the
  # independent runners kept the run's critical path at the slowest shard; by run 36608202961 the
  # slowest of eight was 188s (shard 3) — over the ~150s per-job target — so it splits ten ways.
  # EIGHT again after run 36879103503: ten shards ran 75-90s while the gate shards ran 110-160s, so two
  # of their runners went to the gates (twelve shards) and the run's runner count stayed the same.
  # FOUR once the files that only mocked `@/auth` took their session from the harness (setSession) and joined
  # the shared module graph, and six small isolated files merged into their neighbours: by
  # scripts/ci/test-timings.json each of four shards carries ~215-237s of per-file time against ~119s at eight
  # (runs 37118557786/37118962945 turned ~119s into 40-75s of Vitest), under the gate shards' ~155s.
  api:
    needs: [ plan ]
    if: needs.plan.outputs.api == 'true'
    name: api tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4 ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # The whole-install cache, and why its key is a normalised lockfile rather than the lockfile
      # itself: see the `checks` job above, which carries the full note.
      - run: node scripts/ci/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'design-systems/fonts.json', 'services/app/scripts/system-font-packages.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      # The export tests drive real headless Chromium (lib/export.ts). The
      # browser download is the slow half of the install; cache it on what pins
      # the browser (playwright-core's browsers.json), as the gates do — keyed on
      # the whole lockfile, any dependency change missed it and paid a download
      # plus a --with-deps apt pass: 135s on api shard 6 of run 36867180747.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: playwright
        with:
          path: |
            ~/.cache/ms-playwright/chromium-*
            ~/.cache/ms-playwright/chromium_headless_shell-*
            ~/.cache/ms-playwright/ffmpeg-*
          key: playwright-v2-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      # `--with-deps` apt-installs Chromium's system libraries on EVERY run (~30s) even when the
      # browser binary came from the cache. ubuntu-latest already ships those libraries, so the
      # deps pass is only worth paying for when the browser is actually being downloaded.
      # No `--with-deps`, hit or miss: ubuntu-latest already ships Chromium's libraries, and the apt
      # pass on a miss cost 135s on api shard 6 of run 36867180747. A miss now costs the download.
      - run: npx playwright install chromium
      # The test global setup builds the server reader and the islands behind content-verified
      # markers: 38s of every cold shard. Restore the latest build (this PR's, else main's); a marker
      # that no longer matches this tree rebuilds, so a stale restore costs only the build it replaces.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: test-builds
        with:
          path: |
            services/app/public/islands
            services/app/lib/build-assets
            node_modules/.cache/build-islands.json
          key: test-builds-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: test-builds-v1-${{ runner.os }}-
      # Files are packed by measured time (scripts/lib/timed-sequencer.mjs), not by count, and the
      # api project shares one module graph per worker; the files that mock modules run isolated.
      - run: npx vitest run --project=api --project=api-isolated --shard=${{ matrix.shard }}/4
      - if: matrix.shard == 1 && steps.test-builds.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            services/app/public/islands
            services/app/lib/build-assets
            node_modules/.cache/build-islands.json
          key: test-builds-v1-${{ runner.os }}-${{ github.sha }}

  # EACH SHARD BUILDS WHAT IT RUNS, while it provisions browsers. The shards used to download the `build`
  # job's artifact and poll that job until it finished: on runs 36875673784 and 36876517464 they sat
  # 35-58s in that wait after ~25s of their own setup. scripts/build/build-gate-inputs.mjs builds the app
  # and dist/server.mjs, started in the background right after the install restore, so it overlaps the
  # browser, Postgres and sandbox steps. Nothing here depends on `build`, which runs beside this job.
  gates:
    needs: [ plan ]
    if: needs.plan.outputs.gates == 'true'
    name: browser gates (${{ matrix.shard }}/9)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4, 5, 6, 7, 8, 9 ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # The whole-install cache, and why its key is a normalised lockfile rather than the lockfile
      # itself: see the `checks` job above, which carries the full note.
      - run: node scripts/ci/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'design-systems/fonts.json', 'services/app/scripts/system-font-packages.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      # A BUILD OF THESE EXACT SOURCES ALREADY CACHED (see the `build` job) means there is nothing to
      # build: the shard restores it and starts its gates at once. Restore only — the entry is written by
      # `build`, never by a shard.
      - id: build-key
        run: node scripts/ci/ci.mjs build-key
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: build-cache
        with:
          path: |
            dist
            services/app/dist
            services/app/lib/build-assets
            services/app/public/islands
            services/app/public/libraries
            services/app/server/routes.generated.ts
          key: app-build-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ steps.build-key.outputs.key }}
      # The islands and server reader with their content markers (see the api job): the build below
      # takes `--cache`, so a restore that matches this tree turns the ~27s island build into a check.
      - if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            services/app/public/islands
            services/app/lib/build-assets
            node_modules/.cache/build-islands.json
          key: test-builds-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: test-builds-v1-${{ runner.os }}-
      # IN THE BACKGROUND: every stream is redirected, or the runner would hold this step open until the
      # build closed the step's output pipe. "Wait for this shard's build" below collects it.
      - name: Build the app and server in the background
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          ( node scripts/build/build-gate-inputs.mjs > "$RUNNER_TEMP/gate-build.log" 2>&1; echo $? > "$RUNNER_TEMP/gate-build.status" ) < /dev/null > /dev/null 2>&1 &
      - id: gate-browsers
        run: |
          echo "browsers=$(node scripts/gates.mjs --browsers --shard=${{ matrix.shard }}/9)" >> "$GITHUB_OUTPUT"
      # KEYED ON WHAT PINS THE BROWSER, not on the lockfile: browsers.json is where playwright-core
      # records the Chromium revision it will download, so the entry survives every lockfile change
      # that is not a Playwright upgrade — including the version line a release rewrites.
      # Engine paths and keys are disjoint, including Chromium headless shell and ffmpeg.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: browser-chromium
        with:
          path: |
            ~/.cache/ms-playwright/chromium-*
            ~/.cache/ms-playwright/chromium_headless_shell-*
            ~/.cache/ms-playwright/ffmpeg-*
          key: playwright-v2-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: contains(steps.gate-browsers.outputs.browsers, 'firefox')
        id: browser-firefox
        with:
          path: ~/.cache/ms-playwright/firefox-*
          key: playwright-v2-firefox-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: contains(steps.gate-browsers.outputs.browsers, 'webkit')
        id: browser-webkit
        with:
          path: ~/.cache/ms-playwright/webkit-*
          key: playwright-v2-webkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      # Chromium libraries ship on the runner. Firefox/WebKit need additional system
      # packages even on a browser-cache hit; install them only on shards that use them.
      # FIREFOX/WEBKIT'S SYSTEM PACKAGES, KEPT AS .debs. Their `--with-deps` apt pass is the one
      # provisioning step that hangs on a slow mirror: 91s typically, 236s on PR #269's run 36867396926
      # (one gate shard), against a 240s job budget. Only the cross-browser shards pay it, and with the
      # packages already in apt's archive they install without downloading anything.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.gate-browsers.outputs.browsers != 'chromium'
        with:
          path: ~/browser-debs
          key: browser-debs-v1-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - name: Install selected gate browsers
        env:
          BROWSERS: ${{ steps.gate-browsers.outputs.browsers }}
          CACHE_HIT: ${{ steps.browser-chromium.outputs.cache-hit }}
        run: |
          read -ra selected_engines <<< "$BROWSERS"
          deps=()
          # A Chromium-only shard never runs apt: ubuntu-latest ships Chromium's libraries, so a browser
          # cache miss costs the download alone, never a mirror's mood. (The cache is warmed on main —
          # see `warm-caches` — so a PR's first run restores it too.)
          if [[ "$BROWSERS" != chromium ]]; then
            deps+=(--with-deps)
            if compgen -G "$HOME/browser-debs/*.deb" > /dev/null; then sudo cp "$HOME"/browser-debs/*.deb /var/cache/apt/archives/; fi
          fi
          echo "browser cache hit: ${CACHE_HIT:-false}"
          npx playwright install "${deps[@]}" "${selected_engines[@]}"
          if [[ "$BROWSERS" != chromium ]]; then
            mkdir -p "$HOME/browser-debs"
            cp /var/cache/apt/archives/*.deb "$HOME/browser-debs/" 2>/dev/null || true
          fi
      # The sandbox prep below needs nothing `build` produces, so it runs while `build` is still
      # assembling its artifact rather than after waiting for it.
      - name: Prepare isolated browser session workers
        run: |
          sudo apt-get install -y bubblewrap || { sudo apt-get update; sudo apt-get install -y bubblewrap; }
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo mkdir -p /sys/fs/cgroup/afbin-sessions
          echo '+cpu +memory +pids' | sudo tee /sys/fs/cgroup/afbin-sessions/cgroup.subtree_control
          sudo chown -R "$USER" /sys/fs/cgroup/afbin-sessions
          sudo chown "$USER" /sys/fs/cgroup/cgroup.procs
      # The build started above, awaited here: its log, and its exit status as this step's.
      - name: Wait for this shard's build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          until [ -f "$RUNNER_TEMP/gate-build.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/gate-build.log"
          exit "$(cat "$RUNNER_TEMP/gate-build.status")"
      # The runner boots the servers with one protected per-run mail outbox.
      # Two servers within each runner. The
      # within-machine fan-out bottomed out at 192s on four vCPUs; the shard is
      # balanced by each gate's measured weight, not by count, so no one runner
      # ends up holding every slow gate (scripts/gates.shard.mjs). More than two
      # shards: the set ran 213s and ~170s of gate work in two shards on main run
      # 34697938970, and further shards divide that work rather than the machine.
      #
      # Twelve shards (two taken from api), packed by each gate's MEASURED CI seconds rather than its
      # timeout (scripts/gates.manifest.mjs `shardWeight`): <=~75s of gate work per shard. The gates that
      # lose races under a neighbour's load (`CI_ISOLATED_GATES`) share one shard and nothing else, and
      # the runner gives that set one server, one gate at a time (scripts/gates.servers.mjs `serversFor`).
      - name: every gate, two servers
        run: node scripts/gates.mjs --servers=2 --shard=${{ matrix.shard }}/9
        env:
          AUTH__SECRET: gates-ci-${{ github.run_id }}
          DATASET__ALLOW_PRIVATE_NETWORKS: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: browser-session-images-${{ matrix.shard }}
          path: tmp/browser-session-evidence/*.png
          if-no-files-found: ignore

  # CACHES A PULL REQUEST CAN ACTUALLY READ. A PR reads caches from its own branch and from main, and a
  # push to main runs nothing (`plan` finds the tree PR CI already tested), so nothing ever saved these
  # on main: every new PR's first run missed the install, the browsers and the build together. This
  # job fills main's scope on every push and nightly (caches unused for a week are evicted), off every
  # path anyone waits on: no job needs it and the `test` roll-up does not wait for it. Each step is a
  # no-op when its entry already exists.
  warm-caches:
    if: github.event_name != 'pull_request'
    name: warm caches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: node scripts/ci/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'design-systems/fonts.json', 'services/app/scripts/system-font-packages.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      # Disjoint engine caches: a Chromium-only writer cannot freeze an incomplete all-browser key.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: browser-chromium
        with:
          path: |
            ~/.cache/ms-playwright/chromium-*
            ~/.cache/ms-playwright/chromium_headless_shell-*
            ~/.cache/ms-playwright/ffmpeg-*
          key: playwright-v2-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: browser-firefox
        with:
          path: ~/.cache/ms-playwright/firefox-*
          key: playwright-v2-firefox-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: browser-webkit
        with:
          path: ~/.cache/ms-playwright/webkit-*
          key: playwright-v2-webkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: browser-debs
        with:
          path: ~/browser-debs
          key: browser-debs-v1-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - if: steps.browser-chromium.outputs.cache-hit != 'true' || steps.browser-firefox.outputs.cache-hit != 'true' || steps.browser-webkit.outputs.cache-hit != 'true' || steps.browser-debs.outputs.cache-hit != 'true'
        run: |
          npx playwright install --with-deps chromium firefox webkit
          mkdir -p "$HOME/browser-debs"
          cp /var/cache/apt/archives/*.deb "$HOME/browser-debs/" 2>/dev/null || true
      - id: build-key
        run: node scripts/ci/ci.mjs build-key
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: build-cache
        with:
          path: |
            dist
            services/app/dist
            services/app/lib/build-assets
            services/app/public/islands
            services/app/public/libraries
            services/app/server/routes.generated.ts
          key: app-build-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ steps.build-key.outputs.key }}
      - if: steps.build-cache.outputs.cache-hit != 'true'
        run: npm run build
      # What the test shards restore (see the api job): the server reader and islands with their markers.
      - run: (cd services/app && node scripts/build-server-reader.mjs --cache && node ../../scripts/build/build-islands.mjs --cache)
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            services/app/public/islands
            services/app/lib/build-assets
            node_modules/.cache/build-islands.json
          key: test-builds-v1-${{ runner.os }}-${{ github.sha }}

  # THE ROLL-UP, AND THE RECORD OF WHAT IT PASSED ON.
  #
  # A tree that passed here has been tested, and testing it again — which is exactly what the push
  # that merges it used to do, eight minutes of full matrix on bytes PR CI had just proved — buys
  # nothing and delays production by those eight minutes. So this job writes down the tree it
  # passed, under a name any later run can look up: `tested-tree-<git tree hash>`. The push then
  # finds it (scripts/ci/ci.mjs `plan`) and selects nothing at all.
  #
  # The artifact IS the pass: it is written after `check`, so it only exists for a green run.
  #
  # IT ALSO REPORTS WHAT THE RUN COST — and, on a pull request, whether it may cost that. This was the
  # separate `job timings` job, waiting on the same jobs as this one; folded in, it is one runner and
  # one setup fewer per run, for one `gh api` call (see "every job's wall clock" below).
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reading the run's own job list (the wall-clock report below) is a scope the workflow does not
    # grant. A job-level block REPLACES the workflow's, so `contents: read` is restated, not inherited.
    permissions:
      contents: read
      actions: read
    # `warm-caches` is deliberately NOT here: `notify-consumer` waits on this job, so waiting on a
    # 15-minute cache warmer would put it on merge → production. It never runs on a pull request, and
    # on main it is simply absent from the wall-clock table.
    needs:
      [
        plan,
        checks,
        node,
        integration,
        ui,
        build,
        api,
        gates
      ]
    if: always() && (github.event_name != 'pull_request' || github.base_ref != 'artifactbinv3')
    steps:
      # PR checkout is the synthetic merge: depth two includes its base parent for the
      # three-dot patch diff below. Main records only the current tree; neither needs full history.
      # The runner's own Node: builtin-only scripts (see `plan`).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: All selected jobs green
        env:
          CI__NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/ci.mjs check
      # Per-job diagnostics remain useful, but the chain is the speed contract:
      # attempt start -> final required rollup, including setup and waits between needs.
      # Target <3 minutes, normal maximum <4; >8 fails on both PR and main.
      - name: every job's wall clock, over-budget named
        if: always()
        # Per-job times include legitimate prerequisite waits: diagnostics on PRs and main.
        # The complete required-check chain below owns the hard eight-minute timing limit.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET_S: '240'
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # $slowest is a jq binding; the single quotes are what keep it one.
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[]
                  | select(.name != "test")
                  | select(.started_at != null and .completed_at != null)
                  | ([ .steps[]?
                       | select(.started_at != null and .completed_at != null)
                       | { name: .name,
                           seconds: ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) } ]
                     | sort_by(.seconds) | last) as $slowest
                  | [ ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)),
                      .name, .conclusion,
                      (($slowest.name // "-") + " " + (($slowest.seconds // 0) | tostring) + "s") ]
                  | @tsv' \
            | sort -rn > durations.tsv
          over=0
          : > over-budget.txt
          {
            echo "## Job wall clock (diagnostic threshold ${BUDGET_S}s)"
            echo
            echo '| | job | seconds | result | slowest step |'
            echo '| --- | --- | ---: | --- | --- |'
            while IFS=$'\t' read -r seconds name conclusion slowest; do
              budget="$BUDGET_S"
              mark=''
              if [ "$seconds" -gt "$budget" ]; then
                mark='OVER'
                over=$((over + 1))
                # Collected, not printed: this block's stdout is the step summary file.
                printf '%s took %ss (budget %ss); its slowest step was %s\n' "$name" "$seconds" "$budget" "$slowest" >> over-budget.txt
              fi
              printf '| %s | %s | %s | %s | %s |\n' "$mark" "$name" "$seconds" "$conclusion" "$slowest"
            done < durations.tsv
            echo
            if [ "$over" -eq 0 ]; then
              echo "Every job finished inside its budget."
            else
              echo "${over} job(s) over budget. Fix the cause — do not raise the budget to meet the job."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do echo "::warning::$line"; done < over-budget.txt
      - name: Required-check chain before recording evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" > ci-attempt.json
          node scripts/lib/ci-elapsed.mjs ci-attempt.json "$GITHUB_STEP_SUMMARY"
      # On a pull request the checkout is refs/pull/N/merge — the tree a squash merge produces, which
      # is the tree the push to main will carry, PROVIDED no other PR moves the base in between. When
      # one does, the tree no longer matches, but the PATCH (recorded here too, when this is a pull
      # request) still can: scripts/ci/ci.mjs `plan`, `patchGapIsSafe`.
      - name: Record the tested tree
        id: tree
        env:
          CI__SOURCE_RUN: ${{ needs.plan.outputs.source-run }}
          CI__EVENT: ${{ github.event_name }}
          CI__BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci/ci.mjs record-tree
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-tree/tested-tree.json
          # Longer than any merge window: the lookup that reads this runs when the PR merges, and an
          # expired artifact is no evidence (scripts/ci/ci.mjs filters them out) — it is a full matrix.
          retention-days: 14
          overwrite: true
      # THE PATCH THIS PULL REQUEST TESTED, keyed by its base and content — not its tree, which a
      # later, unrelated merge can change out from under it. A push whose exact tree misses (another
      # PR merged first) looks this up by `git patch-id`, invariant to that moved base.
      - if: steps.tree.outputs.patch-id != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-patch-${{ steps.tree.outputs.patch-id }}
          path: tested-patch/tested-patch.json
          retention-days: 14
          overwrite: true
      # Include the rollup's own receipt uploads. Receipt consumers require a successful run,
      # so a late budget failure cannot certify a slow run as tested evidence.
      - name: Final required-check chain including evidence uploads
        if: always()
        run: node scripts/lib/ci-elapsed.mjs ci-attempt.json "$GITHUB_STEP_SUMMARY"

  # notify-consumers.yml used to do this via `workflow_run: [ci], completed` — correct, but it waits
  # for THIS ENTIRE WORKFLOW to be marked completed and then pays a second cold-start (a fresh queued
  # job on a brand-new runner): together that cost ~46s of the merge→production chain (product merge
  # 17:12:45 → Update Submodule start 17:14:09, run 36603331879/36603413942) for one `gh api` POST.
  # Doing it as a job HERE removes that hop entirely: `needs` gives the identical "only if every real
  # job passed" gate, no `if: always()` here so a genuine failure upstream skips this job the normal
  # way, instead of waiting on a separate workflow's roundtrip.
  #
  # `success()`, not `!contains(needs.*.result,'failure')`, was the first attempt here and it never
  # actually dispatched (run 36616833422, a clean push with everything green): selected-out jobs are
  # SKIPPED on most merges, and `success()` treats a skipped dependency the same as a failed one, so this job cascaded to skipped
  # on the ordinary case and only would have fired on the rare push that ran the whole matrix.
  notify-consumer:
    name: notify the configured consumer repository
    needs:
      [
        plan,
        checks,
        node,
        integration,
        ui,
        build,
        api,
        gates,
        test
      ]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CONSUMER_REPOSITORY != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify the configured consumer of the exact tested revision
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
          CONSUMER: ${{ vars.CONSUMER_REPOSITORY }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          jq -n --arg sha "$SHA" '{event_type:"toolkit-updated",client_payload:{sha:$sha}}' | gh api "repos/$CONSUMER/dispatches" --input -
