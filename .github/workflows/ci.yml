name: ci

on:
  pull_request:
  push:
    branches: [main]

# New commits supersede earlier checks on the same PR. Main runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job here only reads the repo; the GITHUB_TOKEN should be able to do
# exactly that and nothing else (CodeQL: actions/missing-workflow-permissions).
permissions:
  contents: read

# Wall time is the point: the old single job ran everything serially (7m+, of
# which npm test was 5m — ~330s of aggregate api-suite work meeting 4 shared
# vCPUs). The suite now fans out: fast checks + the two lighter vitest
# projects in one job, the production build in another, and the heavy api project
# SHARDED across the matrix below. Each shard is its own PGLite process, so the
# no-parallel-projects rule (one embedded connection per process) still holds
# within every job.
jobs:
  plan:
    name: affected modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      checks: ${{ steps.select.outputs.checks }}
      node: ${{ steps.select.outputs.node }}
      ui: ${{ steps.select.outputs.ui }}
      build: ${{ steps.select.outputs.build }}
      api: ${{ steps.select.outputs.api }}
      gates: ${{ steps.select.outputs.gates }}
      image: ${{ steps.select.outputs.image }}
      compose: ${{ steps.select.outputs.compose }}
      cli: ${{ steps.select.outputs.cli }}
      agent-smoke: ${{ steps.select.outputs.agent-smoke }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - id: select
        env:
          CI__EVENT: ${{ github.event_name }}
          CI__BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI__HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci.mjs plan

  # THE TYPE CHECK ANSWERS ON ITS OWN, because it is the fastest signal on the
  # commonest mistake and it was sharing a job with something 5x its length.
  checks:
    needs: [plan]
    if: needs.plan.outputs.checks == 'true'
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # Cache THE WHOLE INSTALL, not just npm's download cache: `npm ci` costs ~23s in every job
      # even with a warm ~/.npm. The install's products are not all inside node_modules — the app
      # workspace's postinstall (copy-assets.mjs) writes the content-hashed webfonts under
      # public/fonts and the manifest lib/data/story/story-fonts reads, and a build without them
      # serves every document with missing fonts. They derive from node_modules alone, so they
      # belong in the same entry under the same lockfile key; caching node_modules by itself is
      # what forced a hand-run copy-assets step into all eight jobs, because on a cache HIT
      # `npm ci` — and therefore its postinstall — never runs at all. A partial restore is not
      # silent: lib/data/story/__tests__/story-fonts.test.ts reads the manifest and the bytes.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v2-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run validate

  # THE NODE PROJECT SHARDS, like api and ui. It is the biggest project in the
  # repo — 288 files, ~3,060 tests against api's 1,029 — and it was the only one
  # running whole, which made `validate + node` a 2m16s job of which 103s was
  # this step alone.
  #
  # THREE shards, and not more: the files sum to ~337s of work but the slowest
  # single file is 36s (services/proxy login-routes, then lib/images optimise at
  # 34s), and vitest shards by FILE COUNT rather than duration — so past three
  # each extra shard approaches that 36s floor while still paying a runner's
  # startup. Measured locally, 2026-09-04.
  node:
    needs: [plan]
    if: needs.plan.outputs.node == 'true'
    name: node tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # Cache THE WHOLE INSTALL, not just npm's download cache: `npm ci` costs ~23s in every job
      # even with a warm ~/.npm. The install's products are not all inside node_modules — the app
      # workspace's postinstall (copy-assets.mjs) writes the content-hashed webfonts under
      # public/fonts and the manifest lib/data/story/story-fonts reads, and a build without them
      # serves every document with missing fonts. They derive from node_modules alone, so they
      # belong in the same entry under the same lockfile key; caching node_modules by itself is
      # what forced a hand-run copy-assets step into all eight jobs, because on a cache HIT
      # `npm ci` — and therefore its postinstall — never runs at all. A partial restore is not
      # silent: lib/data/story/__tests__/story-fonts.test.ts reads the manifest and the bytes.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v2-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      # Only shard 1 runs integration tests; the other shards need no browser or Docker.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: matrix.shard == 1
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # `--with-deps` apt-installs Chromium's system libraries on EVERY run (~30s) even when the
      # browser binary came from the cache. ubuntu-latest already ships those libraries, so the
      # deps pass is only worth paying for when the browser is actually being downloaded.
      - if: matrix.shard == 1 && steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: matrix.shard == 1 && steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install chromium
      - if: matrix.shard == 1
        run: docker pull postgres:17-alpine
      - run: npm run build -w services/cli
      - env:
          CI__PLAN: ${{ needs.plan.outputs.plan }}
        run: node scripts/ci.mjs node ${{ matrix.shard }}/3
      # The heavy tests that `npm test` leaves out — a disposable Dockerised
      # Postgres and real Chromium — live in the `integration` project and
      # would otherwise run nowhere in CI. This job already provisions both
      # (the Playwright install and `docker pull postgres:17-alpine` above), so
      # coverage rides here rather than in a new top-level job: only jobs listed
      # in scripts/lib/ci-plan.mjs's CI_JOBS are enforced by the `test` roll-up,
      # and this one already is. Run once (shard 1, not per shard); no
      # --passWithNoTests, so a rename that empties the include fails loudly
      # instead of passing vacuously.
      - if: matrix.shard == 1
        run: npm run test:integration

  # jsdom setup dominates the ui project (~110s serial on a 4-vCPU runner —
  # the environment boots per test file), so it shards like api does.
  ui:
    needs: [plan]
    if: needs.plan.outputs.ui == 'true'
    name: ui tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # Cache THE WHOLE INSTALL, not just npm's download cache: `npm ci` costs ~23s in every job
      # even with a warm ~/.npm. The install's products are not all inside node_modules — the app
      # workspace's postinstall (copy-assets.mjs) writes the content-hashed webfonts under
      # public/fonts and the manifest lib/data/story/story-fonts reads, and a build without them
      # serves every document with missing fonts. They derive from node_modules alone, so they
      # belong in the same entry under the same lockfile key; caching node_modules by itself is
      # what forced a hand-run copy-assets step into all eight jobs, because on a cache HIT
      # `npm ci` — and therefore its postinstall — never runs at all. A partial restore is not
      # silent: lib/data/story/__tests__/story-fonts.test.ts reads the manifest and the bytes.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v2-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      - run: npx vitest run --project=ui --shard=${{ matrix.shard }}/2

  # The BUILD catches what tsc and vitest cannot: a route the generated table
  # has not seen, an import that only resolves under the bundler, a SPA module
  # that reaches for server config. It builds the story runtime, the route
  # table, the SPA and the bundled server — everything the image runs. Master
  # shipped a broken build once because CI never ran it: the image build did,
  # and deploys silently stopped.
  build:
    needs: [plan]
    if: needs.plan.outputs.build == 'true'
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # Cache THE WHOLE INSTALL, not just npm's download cache: `npm ci` costs ~23s in every job
      # even with a warm ~/.npm. The install's products are not all inside node_modules — the app
      # workspace's postinstall (copy-assets.mjs) writes the content-hashed webfonts under
      # public/fonts and the manifest lib/data/story/story-fonts reads, and a build without them
      # serves every document with missing fonts. They derive from node_modules alone, so they
      # belong in the same entry under the same lockfile key; caching node_modules by itself is
      # what forced a hand-run copy-assets step into all eight jobs, because on a cache HIT
      # `npm ci` — and therefore its postinstall — never runs at all. A partial restore is not
      # silent: lib/data/story/__tests__/story-fonts.test.ts reads the manifest and the bytes.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v2-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      # Build the Vite SPA, document runtime and bundled Hono server.
      - run: npm run build

  api:
    needs: [plan]
    if: needs.plan.outputs.api == 'true'
    name: api tests (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # Cache THE WHOLE INSTALL, not just npm's download cache: `npm ci` costs ~23s in every job
      # even with a warm ~/.npm. The install's products are not all inside node_modules — the app
      # workspace's postinstall (copy-assets.mjs) writes the content-hashed webfonts under
      # public/fonts and the manifest lib/data/story/story-fonts reads, and a build without them
      # serves every document with missing fonts. They derive from node_modules alone, so they
      # belong in the same entry under the same lockfile key; caching node_modules by itself is
      # what forced a hand-run copy-assets step into all eight jobs, because on a cache HIT
      # `npm ci` — and therefore its postinstall — never runs at all. A partial restore is not
      # silent: lib/data/story/__tests__/story-fonts.test.ts reads the manifest and the bytes.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v2-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      # The export tests drive real headless Chromium (lib/export.ts). The
      # browser download is the slow half of the install; cache it on the lock
      # file (which pins the playwright version). --with-deps still apt-installs
      # shared libraries on every run — cheap next to the download.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # `--with-deps` apt-installs Chromium's system libraries on EVERY run (~30s) even when the
      # browser binary came from the cache. ubuntu-latest already ships those libraries, so the
      # deps pass is only worth paying for when the browser is actually being downloaded.
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install chromium
      - run: npx vitest run --project=api --shard=${{ matrix.shard }}/5

  # A real coding agent, end to end: mints a start document, loads local skills,
  # publishes, and the served document passes the render guards — the manual
  # pre-merge hole the gates leave. It runs the CI-ONLY tasks (comment, data,
  # The paid regression uses the shipped CLI and installed local skills only.
  # Credentials remain limited to trusted repository runs; the agent cannot read the checkout.
  #
  # ONE LEG ON A PULL REQUEST, the `installed` one. The other half of the product's only credential
  # path — `not-installed`, where nothing is staged and the agent has to find the installer, run it,
  # and get a first-use device pairing approved — is the SAME flow with a colder start, and it is the
  # noisier and the slower of the two (193s, 216s, 319s against this leg's 179s, 183s, 185s; its `cli`
  # task ran 28.7s, 38.8s and once 111s). It now runs nightly in
  # .github/workflows/agent-smoke-nightly.yml, which reports and blocks nothing. Coverage is not
  # trimmed: both legs still run every day against main, and no task was dropped from either.
  #
  # THE FOUR TASKS HERE ARE ALREADY PARALLEL — `run.concurrency` is 4 in evals/config.json, and the
  # leg's wall clock is its slowest task, not their sum (measured on main 34697938970: comment 42.4s,
  # data 65.9s, edit 26.9s, cli 34.5s — 170s of work in a 92s step). So this does NOT become a
  # per-task job matrix: that would pay this job's ~85s of fixed setup four times over to parallelise
  # work that is already parallel.
  agent-smoke:
    needs: [plan]
    name: agent smoke (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: installed
            tasks: comment,data,edit,cli
    if: needs.plan.outputs.agent-smoke == 'true' && vars.AGENT_SMOKE_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # Cache THE WHOLE INSTALL, not just npm's download cache: `npm ci` costs ~23s in every job
      # even with a warm ~/.npm. The install's products are not all inside node_modules — the app
      # workspace's postinstall (copy-assets.mjs) writes the content-hashed webfonts under
      # public/fonts and the manifest lib/data/story/story-fonts reads, and a build without them
      # serves every document with missing fonts. They derive from node_modules alone, so they
      # belong in the same entry under the same lockfile key; caching node_modules by itself is
      # what forced a hand-run copy-assets step into all eight jobs, because on a cache HIT
      # `npm ci` — and therefore its postinstall — never runs at all. A partial restore is not
      # silent: lib/data/story/__tests__/story-fonts.test.ts reads the manifest and the bytes.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v2-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # `--with-deps` apt-installs Chromium's system libraries on EVERY run (~30s) even when the
      # browser binary came from the cache. ubuntu-latest already ships those libraries, so the
      # deps pass is only worth paying for when the browser is actually being downloaded.
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install chromium
      # The agent runs as a non-sudo account; evidence stays outside the checkout
      # so granting access to the dev-mail outbox cannot reopen source access.
      #
      # SPLIT INTO THREE STEPS BECAUSE ONE OF THEM IS EXPENSIVE AND WE DO NOT YET KNOW WHICH.
      # As a single step this cost 34s and 37s on main runs 34697938970 and 34693741969 — the
      # largest fixed cost in the job after the agents themselves, and a fifth of the 180s budget
      # for a `useradd`, a `chmod` and a `test -r`. Nothing here is slow by nature, so the next run's
      # step timings name the offender instead of leaving the number to guesswork.
      - name: create the eval account
        # --no-log-init: on the hosted runner useradd otherwise spends ~40 s extending the sparse lastlog/faillog files (measured 34–41 s).
        run: sudo useradd --no-log-init --create-home --shell /bin/bash eval-agent
      - name: close the checkout to it
        run: chmod 700 "$GITHUB_WORKSPACE"
      - name: prove the eval account cannot read the checkout
        run: |
          if sudo -n -u eval-agent test -r "$GITHUB_WORKSPACE/package.json"; then
            echo "Eval account can read the checkout" >&2
            exit 1
          fi
      # The harness this job drives — one global npm package, no login.
      - run: npm i -g opencode-ai
      # `installed` stages the PLATFORM BINARY when it exists (evals/lib/cli-kit.ts prefers it: the
      # .mjs bundle cannot resolve DuckDB from a run home, so the data task would fail on it). The
      # binary build is 11–14 s measured; the bundle is still built for the CLI's own tests.
      - run: npm run build -w services/cli
      - run: npm run build:binary -w services/cli
      - run: npm run build
      - run: |
          umask 077
          npm run eval -- --ci --run-as=eval-agent --out="$RUNNER_TEMP/agent-smoke-metrics" \
            --tasks=${{ matrix.tasks }} --mode=${{ matrix.mode }} \
            --harness=opencode \
            --model=fireworks-ai/accounts/fireworks/models/glm-5p3-flash \
            --api-key-env=FIREWORKS_API_KEY \
            --label='opencode · glm-5p3-flash · ${{ matrix.mode }}' \
            --price-in=0.15 --price-out=0.5 --price-cache-read=0.03
        env:
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: agent-smoke-metrics-${{ matrix.mode }}
          path: ${{ runner.temp }}/agent-smoke-metrics/
          include-hidden-files: true
          retention-days: 14

  # THE BROWSER GATES, which until now were a MANUAL pre-merge ritual — 34
  # scripts guarding invariants CLAUDE.md calls load-bearing, run by whoever
  # remembered. They were unaffordable in CI at ~25 minutes, and they were 25
  # minutes because they ran one at a time against ONE server: gates sharing a
  # server share a mint ceiling, a login door and a listing. Given a server
  # each they do not, so the set fans out over servers (scripts/gates.mjs
  # --servers=N: in-memory PGLite, own port, own object dir) and finishes in
  # about three minutes locally. Everything else about a gate is unchanged.
  #
  # It runs against the BUILD, not the dev server, which is the half that keeps
  # catching production-only faults: the app's stylesheet once compiled to zero
  # rules in the build alone, and every page-measuring gate would have said so.
  gates:
    needs: [plan]
    if: needs.plan.outputs.gates == 'true'
    name: browser gates (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # Cache THE WHOLE INSTALL, not just npm's download cache: `npm ci` costs ~23s in every job
      # even with a warm ~/.npm. The install's products are not all inside node_modules — the app
      # workspace's postinstall (copy-assets.mjs) writes the content-hashed webfonts under
      # public/fonts and the manifest lib/data/story/story-fonts reads, and a build without them
      # serves every document with missing fonts. They derive from node_modules alone, so they
      # belong in the same entry under the same lockfile key; caching node_modules by itself is
      # what forced a hand-run copy-assets step into all eight jobs, because on a cache HIT
      # `npm ci` — and therefore its postinstall — never runs at all. A partial restore is not
      # silent: lib/data/story/__tests__/story-fonts.test.ts reads the manifest and the bytes.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v2-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # `--with-deps` apt-installs Chromium's system libraries on EVERY run (~30s) even when the
      # browser binary came from the cache. ubuntu-latest already ships those libraries, so the
      # deps pass is only worth paying for when the browser is actually being downloaded.
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install chromium
      # 8s, measured on main runs 34697938970 and 34693741969 — so this stays a BUILD and not a
      # downloaded artifact. Handing the shards the `build` job's output instead would mean
      # uploading 40 MB (dist 12 MB, services/app/dist 14 MB, public/story 7.7 MB,
      # lib/story-runtime/dist 6.3 MB, plus public/libraries) and downloading it three times,
      # which costs more wall clock than the build it replaces and adds a cross-job edge that
      # `agent-smoke` could not use anyway (an evals-only change selects agent-smoke and NOT build).
      - run: npm run build
      # The runner boots the servers with one protected per-run mail outbox.
      # Four servers within the runner, three runners across the set. The
      # within-machine fan-out bottomed out at 192s on four vCPUs; the shard is
      # balanced by each gate's measured weight, not by count, so no one runner
      # ends up holding every slow gate (scripts/gates.shard.mjs). THREE shards,
      # not two: the set ran 213s and ~170s of gate work in two shards on main run
      # 34697938970, and a third divides that work rather than the machine.
      #
      # postgres-datasets drives a real Dockerised Postgres; pulling the image
      # before the run keeps that cost out of the gate's own timeout budget.
      - name: pull the Postgres image the datasets gate needs
        run: docker pull postgres:17-alpine
      - name: every gate, four servers
        run: node scripts/gates.mjs --servers=4 --shard=${{ matrix.shard }}/4
        env:
          AUTH__SECRET: gates-ci-${{ github.run_id }}
          DATASET__ALLOW_PRIVATE_NETWORKS: 'true'

  # THE IMAGE IS THE ARTIFACT THAT DEPLOYS, and nothing else here proves it
  # builds or runs. `npm run build` produces the bundle from the FULL
  # node_modules; the image ships a production install beside it, so a package
  # the bundle left external and the image no longer carries is invisible to
  # every other job. That exact drift shipped once: `Cannot find package
  # 'vega-lite'` at the server's first line, discoverable only by assembling
  # the image's own layout. Building it here means the publish workflow is
  # never the first to try.
  image:
    needs: [plan]
    if: needs.plan.outputs.image == 'true'
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: artifactbin:ci
          # THE LAYER CACHE IS AN OPTIMISATION, NOT A BUILD PRODUCT, and
          # `ignore-error=true` is what says so on both ends. On 2026-09-05 this
          # job went red on a green commit: the image had already been built and
          # loaded — `#47 exporting to docker image format ... DONE 73.9s`,
          # `#48 loading layer ... DONE 19.6s` — and then
          # `#49 exporting to GitHub Actions Cache` answered
          # `ERROR: Post ".../CacheService/GetCacheEntryDownloadURL": dial tcp
          # 140.82.113.22:443: i/o timeout`, which buildx reports as
          # `failed to build: failed to solve: DeadlineExceeded` (run
          # 33939641406, job 101234399760; the same commit's `publish` workflow
          # had pushed all four images minutes earlier). A merge gate must never
          # depend on a third party being up. With the attribute a cache miss or
          # a cache-service outage costs a warning and a colder builder next
          # time, nothing more: measured against an unreachable backend, the
          # build exits 1 without it and 0 with it, and against a reachable one
          # it still exports AND restores.
          cache-from: type=gha,ignore-error=true
          # mode=min, not max. `max` exports EVERY intermediate layer of both
          # stages, and this image is large — the export was a big share of the
          # 339s the build step took, which was itself the whole reason this job
          # ran 7.6m while nothing else passed 5m. `min` exports only what the
          # final stage needs, so a rebuild whose dependencies did not change
          # still restores; a dependency change pays for a colder builder.
          cache-to: type=gha,mode=min,ignore-error=true
          # No provenance attestation: it is generated and attached during the
          # export, and nothing here consumes it.
          provenance: false
      # It has to RUN, not merely build: the runner stage's assertions catch a
      # missing shared library, and this catches a missing package.
      - name: the image boots and serves
        run: |
          docker run -d --name ab -p 3399:3000 \
            -e DATABASE_URL=pglite://memory -e AUTH__SECRET=$(openssl rand -base64 32) \
            -e APP__PUBLIC_BASE_URL=http://127.0.0.1:3399 \
            -e ARTIFACTS__ALLOW_PUBLIC=1 -e PROXY__RATE_LIMIT_CONFIG_FILE=/app/services/proxy/dev_rate_limits.yml \
            artifactbin:ci
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3399/health || true)
            [ "$code" = "200" ] && echo "served after ${i}s" && exit 0
            sleep 1
          done
          echo '--- container log ---'; docker logs ab; exit 1
      # And it has to LOOK right. The suite runs against the dev server, which
      # skips the build step where a production-only break lives: the app's
      # stylesheet once parsed to zero rules in the build alone, and every
      # page-measuring gate would have caught it while every unit test passed.
      # One gate that measures the page, against the CONTAINER.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # The same two caches every other job here uses (see the `checks` job for what the
      # install entry holds). This job had neither, and paid `npm ci` plus a full `--with-deps`
      # Chromium install on every run to execute ONE gate: 47s of a job whose budget is 180s.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v2-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install chromium
      - name: a gate that measures the page, against the container
        run: node scripts/gate-layout-shift.mjs http://127.0.0.1:3399
      # What the container itself said — the gate can only report that the
      # server answered 500, and the reason is in here.
      - if: failure()
        run: docker logs ab
      - if: always()
        run: docker rm -f ab || true

  # Build each lean image once, check its contents/size/standalone behavior,
  # then boot those exact images together and walk the service boundaries.
  compose:
    needs: [plan]
    if: needs.plan.outputs.compose == 'true'
    name: compose (the split shape)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTH__SECRET: compose-ci-${{ github.run_id }}
      CONTRACT__ACTOR_SECRET: compose-ci-${{ github.run_id }}
      INTERNAL__SERVICE_SECRET: compose-ci-${{ github.run_id }}
      POSTGRES_PASSWORD: compose-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Reuse main's layers; only main writes the shared cache.
      - name: read main's layer cache; publish it only from main
        run: |
          echo "COMPOSE_FILE=docker-compose.lean.yml:docker-compose.lean.ci.yml" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "COMPOSE_FILE=docker-compose.lean.yml:docker-compose.lean.ci.yml:docker-compose.lean.ci-write.yml" >> "$GITHUB_ENV"
          fi
      - name: build the five lean images once
        run: docker compose build
      - name: check the exact images the composition will run
        run: |
          node scripts/image-checks.mjs app artifactbin-lean-app
          node scripts/image-checks.mjs proxy artifactbin-lean-proxy
          node scripts/image-checks.mjs sql artifactbin-lean-sql
          node scripts/image-checks.mjs browser artifactbin-lean-browser
          node scripts/image-checks.mjs events artifactbin-lean-events
      - name: boot the five lean images as one host
        run: |
          docker compose up -d --no-build
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5440/health || true)
            [ "$code" = "200" ] && echo "proxy serving after ${i}s" && exit 0
            sleep 1
          done
          echo '--- compose state ---'; docker compose ps; exit 1
      - name: walk it (health, mint, publish, serve, query, emit)
        run: node scripts/test-compose-lean.mjs http://127.0.0.1:5440
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v --remove-orphans || true

  # The stable roll-up: one name for humans, rulesets, and the merge button,
  # whatever the matrix above looks like this month. Runs on failure too —
  # `needs` alone would report SKIPPED (not failed) when a dependency fails,
  # and a skipped required check does not block a merge.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [plan, checks, node, ui, build, api, gates, image, compose, cli]
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: All selected jobs green
        env:
          CI__NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci.mjs check

  cli:
    needs: [plan]
    if: needs.plan.outputs.cli == 'true'
    name: CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # THE SUITE RUNS ONCE, on ubuntu-24.04. The other three rows exist for the thing that is
      # genuinely per-platform — a binary compiled for that OS and architecture — so they build it
      # and run its smoke, and nothing else. Re-running config/launcher/runner under tsx on every
      # row cost 15s on macos-15-intel and 0s of new information: those three files exercise the
      # config store, executable discovery and PTY handling through Node, which the ubuntu row
      # already covers, and what differs across platforms is what `test:binary` actually drives.
      - if: matrix.os == 'ubuntu-24.04'
        run: npm test -w services/cli
      - run: npm run build -w services/cli
      - run: npm run build:binary -w services/cli
      - run: npm run test:binary -w services/cli
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afbin-${{ matrix.os }}
          path: |
            services/cli/dist/afbin-*
            services/cli/dist/afbin.1
          if-no-files-found: error

  # WHAT THIS RUN ACTUALLY COST, on the run's own summary page.
  #
  # The budget is three minutes a job, and it is a GOAL MET BY FIXING CAUSES — not a cap and not a
  # gate. So this job is deliberately toothless: it reads the durations GitHub already recorded,
  # writes them to the step summary with anything over 180s marked, and cannot fail the run. It is
  # absent from CI_JOBS and from the `test` roll-up's `needs`, so it can never block a merge, and
  # `continue-on-error` means an API hiccup here costs a missing table and nothing else.
  #
  # The alternative — `timeout-minutes: 180s` per job, or a step that exits 1 over budget — turns a
  # slow runner into a red merge button and teaches everyone to re-run rather than to measure. A
  # table in front of whoever opened the run is the pressure that actually works.
  timings:
    name: job timings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [plan, checks, node, ui, build, api, gates, image, compose, cli, agent-smoke, test]
    if: always()
    continue-on-error: true
    # This is the one job here that reads the Actions API rather than the repository. A job-level
    # block REPLACES the workflow's, so `contents: read` is restated rather than inherited.
    permissions:
      contents: read
      actions: read
    steps:
      # No checkout: the run's own job list is the only input.
      - name: every job's wall clock, over-budget marked
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET_S: '180'
        run: |
          set -euo pipefail
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[]
                  | select(.name != "job timings")
                  | select(.started_at != null and .completed_at != null)
                  | [ ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)),
                      .name, .conclusion ]
                  | @tsv' \
            | sort -rn > durations.tsv
          {
            echo "## Job wall clock (budget ${BUDGET_S}s)"
            echo
            echo '| | job | seconds | result |'
            echo '| --- | --- | ---: | --- |'
            over=0
            while IFS=$'\t' read -r seconds name conclusion; do
              mark=''
              if [ "$seconds" -gt "$BUDGET_S" ]; then mark='OVER'; over=$((over + 1)); fi
              printf '| %s | %s | %s | %s |\n' "$mark" "$name" "$seconds" "$conclusion"
            done < durations.tsv
            echo
            if [ "$over" -eq 0 ]; then
              echo "Every job finished inside ${BUDGET_S}s."
            else
              echo "${over} job(s) over ${BUDGET_S}s. This is a goal, not a gate: fix the cause, do not cap the job."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
