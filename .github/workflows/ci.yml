name: ci

on:
  pull_request:
  push:
    branches: [ main ]
  # The release-only CLI matrix runs on NO ordinary pull request, so between releases nothing would
  # notice broken native npm acceptance — and its caches, unused, expire. Nightly on main it proves the
  # five consumer platforms: drift shows up the next morning instead of inside a release, and the macOS/Linux
  # install caches stay warm on the default branch, which is most of what makes a release build fast.
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

# New commits supersede earlier checks on the same PR. Main runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs read the repo. cli-pack alone can request a signing identity for its npm artifact.
permissions:
  contents: read

# Wall time is the point: the old single job ran everything serially (7m+, of
# which npm test was 5m — ~330s of aggregate api-suite work meeting 4 shared
# vCPUs). The suite now fans out: fast checks + the two lighter vitest
# projects in one job, the production build in another, and the heavy api project
# SHARDED across the matrix below. Each shard is its own PGLite process, so the
# no-parallel-projects rule (one embedded connection per process) still holds
# within every job.
jobs:
  plan:
    name: affected modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Finding the run that already tested this tree reads the repository's artifact list. A job-level
    # block REPLACES the workflow's, so `contents: read` is restated rather than inherited.
    permissions:
      contents: read
      actions: read
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      checks: ${{ steps.select.outputs.checks }}
      node: ${{ steps.select.outputs.node }}
      ui: ${{ steps.select.outputs.ui }}
      build: ${{ steps.select.outputs.build }}
      api: ${{ steps.select.outputs.api }}
      gates: ${{ steps.select.outputs.gates }}
      cli: ${{ steps.select.outputs.cli }}
      reference-compatibility: ${{ steps.select.outputs.reference-compatibility }}
      # Not a job: whether the node job runs the CLI source suite (every CLI change, not only a release).
      cli-tests: ${{ steps.select.outputs.cli-tests }}
      # Not a job either: whether `checks` must refuse this PR for shipping the CLI without a version.
      cli-bump: ${{ steps.select.outputs.cli-bump }}
      # The run that already tested this exact tree, when there is one; empty otherwise.
      source-run: ${{ steps.select.outputs.source-run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - id: select
        env:
          CI__EVENT: ${{ github.event_name }}
          CI__BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI__BEFORE_SHA: ${{ github.event.before }}
          CI__HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/ci.mjs plan

  # THE TYPE CHECK ANSWERS ON ITS OWN, because it is the fastest signal on the
  # commonest mistake and it was sharing a job with something 5x its length.
  checks:
    needs: [ plan ]
    if: needs.plan.outputs.checks == 'true'
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # Cache THE WHOLE INSTALL, not just npm's download cache: `npm ci` costs ~23s in every job
      # even with a warm ~/.npm. The install's products are not all inside node_modules — the app
      # workspace's postinstall (copy-assets.mjs) writes the content-hashed webfonts under
      # public/fonts and the manifest lib/data/story/story-fonts reads, and a build without them
      # serves every document with missing fonts. They derive from node_modules alone, so they
      # belong in the same entry under the same lockfile key; caching node_modules by itself is
      # what forced a hand-run copy-assets step into all eight jobs, because on a cache HIT
      # `npm ci` — and therefore its postinstall — never runs at all. A partial restore is not
      # silent: lib/data/story/__tests__/story-fonts.test.ts reads the manifest and the bytes.
      # A RELEASE MUST NOT COLD-START EVERY JOB. The key used to hash package-lock.json itself, and
      # `npm run release:cli` rewrites one line of it — the CLI workspace's own version, which
      # resolves no dependency. hashFiles() cannot tell that line from a real one, so every release
      # missed this cache: run 35325636096, job `CLI (macos-15-intel)`, "Cache not found for input
      # keys: install-v3-macOS-X64-node22-a979…", 50s of `npm ci` and 29s of cache-post, while the
      # three caches beside it (Chromium, prebuilt Node, Chromium archive) restored on that same
      # runner because they key on files a bump does not touch. The fingerprint is the lockfile with
      # workspace versions normalised: a dependency that moved still changes it, a bump no longer does.
      - run: node scripts/ci/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'services/cli/scripts/prepare-pty.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      # A CLI CHANGE THAT SHIPS NO VERSION SHIPS NOWHERE: the publisher only uploads when the version
      # moved, so the source would sit on main, released to nobody, until someone noticed. The rule
      # and its wording live in scripts/lib/ci-plan.mjs, where they are tested.
      - name: The CLI ships with a version
        if: needs.plan.outputs.cli-bump == 'true'
        run: node scripts/ci/ci.mjs cli-bump
      # A WORKFLOW TYPO IS ONLY EXPENSIVE WHEN THE RUNNER FINDS IT. actionlint parses every workflow
      # here (and shellcheck reads every `run:` block) in about a second, in a pinned image anyone can
      # run locally: `docker run --rm -v "$PWD":/repo --workdir /repo rhysd/actionlint:1.7.7 -color`.
      - name: Lint the workflows
        run: docker run --rm -v "$PWD":/repo --workdir /repo rhysd/actionlint:1.7.7 -color
      - run: npm run validate

  # THE NODE PROJECT SHARDS, like api and ui. It is the biggest project in the
  # repo, and it was the only one
  # running whole, which made `validate + node` a 2m16s job of which 103s was
  # this step alone.
  #
  # FOUR shards, down from seven (.agent/ci-proposal.md §1d): seven ran 28-56s of Vitest each beside
  # ~16s of setup, far under the gates (~155s warm), so four keep every shard below them — the
  # heaviest, by scripts/ci/test-timings.json with the integration and CLI-suite reserves, ~124s warm.
  # Earlier: EIGHT, down from ten after run 36838282615, where the plain shards ran 63-111s against a
  # 240s budget and the gates set the run's path. Before that, TEN, up from four: shard 3 also builds and tests the CLI (~141s fixed, unaffected by
  # shard count — see below), so on run 36611975484 it was the tallest job in the run at 236s even
  # though its own share of the plain vitest work was only 72s. Downloading `build`'s artifact instead
  # of rebuilding was tried and reverted: shard 3 has almost no OTHER setup to overlap the wait
  # against (unlike `gates`), so waiting for `build` (~93s on run 36613650176) cost about the same as
  # the 88s rebuild it replaced. Shrinking this shard's plain-vitest share by sharding further is the
  # lever that actually works here.
  node:
    needs: [ plan ]
    if: needs.plan.outputs.node == 'true'
    name: node tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4 ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # The whole-install cache, and why its key is a normalised lockfile rather than the lockfile
      # itself: see the `checks` job above, which carries the full note.
      - run: node scripts/ci/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'services/cli/scripts/prepare-pty.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      # Only shard 1 runs integration tests; the other shards need no browser or Docker.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: matrix.shard == 1
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      # `--with-deps` apt-installs Chromium's system libraries on EVERY run (~30s) even when the
      # browser binary came from the cache. ubuntu-latest already ships those libraries, so the
      # deps pass is only worth paying for when the browser is actually being downloaded.
      - if: matrix.shard == 1
        run: npx playwright install chromium
      - if: matrix.shard == 1
        run: docker pull postgres:17-alpine
      # The test global setup builds the server reader and the islands behind content-verified
      # markers: 38s of every cold shard. Restore the latest build (this PR's, else main's); a marker
      # that no longer matches this tree rebuilds, so a stale restore costs only the build it replaces.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: test-builds
        with:
          path: |
            services/app/public/islands
            services/app/lib/build-assets
            node_modules/.cache/build-islands.json
          key: test-builds-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: test-builds-v1-${{ runner.os }}-
      - env:
          CI__PLAN: ${{ needs.plan.outputs.plan }}
        run: node scripts/ci/ci.mjs node ${{ matrix.shard }}/4
      # The heavy tests that `npm test` leaves out — a disposable Dockerised
      # Postgres and real Chromium — live in the `integration` project and
      # would otherwise run nowhere in CI. This job already provisions both
      # (the Playwright install and `docker pull postgres:17-alpine` above), so
      # coverage rides here rather than in a new top-level job: only jobs listed
      # in scripts/lib/ci-plan.mjs's CI_JOBS are enforced by the `test` roll-up,
      # and this one already is. Run once (shard 1, not per shard); no
      # --passWithNoTests, so a rename that empties the include fails loudly
      # instead of passing vacuously.
      - if: matrix.shard == 1
        run: npm run test:integration
      # The lightest shard: shard 1 already carries the browser, Docker and integration steps,
      # and together they overran its time budget.
      # The suite needs the server reader and the island build (preview serves the compiled reader),
      # not the full `npm run build -w services/cli` (SPA, runtime, host bundles: 67s here). The
      # Vitest run above already built both through its global setup, so these are cache hits.
      - name: CLI source suite on the release runtime
        if: matrix.shard == 3 && needs.plan.outputs.cli-tests == 'true'
        run: |
          (cd services/app && node scripts/build-server-reader.mjs --cache && node ../../scripts/build/build-islands.mjs --cache)
          npm test -w services/cli

  # jsdom setup dominates the ui project (~110s serial on a 4-vCPU runner —
  # the environment boots per test file), so it shards like api does. Two shards ran 186s and 119s
  # on run 36608202961 — over the ~150s per-job target — so it split three, then four ways. Three
  # again after run 36838282615 (four shards, 84-129s): the gates, not this job, set the run's path.
  # TWO since .agent/ci-proposal.md §1d: three ran 38-44s of work each, so two (~80s warm) stay
  # under the gates.
  ui:
    needs: [ plan ]
    if: needs.plan.outputs.ui == 'true'
    name: ui tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2 ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # The whole-install cache, and why its key is a normalised lockfile rather than the lockfile
      # itself: see the `checks` job above, which carries the full note.
      - run: node scripts/ci/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'services/cli/scripts/prepare-pty.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      # The test global setup builds the server reader and the islands behind content-verified
      # markers: 38s of every cold shard. Restore the latest build (this PR's, else main's); a marker
      # that no longer matches this tree rebuilds, so a stale restore costs only the build it replaces.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: test-builds
        with:
          path: |
            services/app/public/islands
            services/app/lib/build-assets
            node_modules/.cache/build-islands.json
          key: test-builds-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: test-builds-v1-${{ runner.os }}-
      - run: npx vitest run --project=ui --project=islands --shard=${{ matrix.shard }}/2

  # The BUILD catches what tsc and vitest cannot: a route the generated table
  # has not seen, an import that only resolves under the bundler, a SPA module
  # that reaches for server config. It builds the story runtime, the route
  # table, the SPA and the bundled server — everything `afbin serve` serves.
  # Master shipped a broken build once because CI never ran it, and deploys
  # silently stopped.
  build:
    needs: [ plan ]
    if: needs.plan.outputs.build == 'true'
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # The whole-install cache, and why its key is a normalised lockfile rather than the lockfile
      # itself: see the `checks` job above, which carries the full note.
      - run: node scripts/ci/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'services/cli/scripts/prepare-pty.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      # THE SAME SOURCES BUILD THE SAME BYTES. The key hashes git's object ids for every build input
      # (scripts/lib/ci-plan.mjs `isBuildInput`: not tests, gates, workflows or prose), so a push that
      # changed only those restores the last build of these sources and skips the ~75s below. No
      # restore-keys: a near miss would serve an older server and SPA, which is worse than building.
      - id: build-key
        run: node scripts/ci/ci.mjs build-key
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: build-cache
        with:
          path: |
            dist
            services/app/dist
            services/app/lib/build-assets
            services/app/public/islands
            services/app/public/libraries
            services/app/server/routes.generated.ts
            services/cli/dist
          key: app-build-v2-${{ runner.os }}-${{ runner.arch }}-node22-${{ steps.build-key.outputs.key }}-npm-${{ needs.plan.outputs.cli }}
      # The island and server-reader builds inside `npm run build` take `--cache` (build-prep.mjs):
      # restoring the test shards' builds turns the ~27s island build into a marker check.
      - if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: test-builds
        with:
          path: |
            services/app/public/islands
            services/app/lib/build-assets
            node_modules/.cache/build-islands.json
          key: test-builds-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: test-builds-v1-${{ runner.os }}-
      # The CLI host build already builds the app SPA and document runtime. NO GATE WAITS FOR THIS JOB:
      # each gate shard builds the subset it runs (scripts/build/build-gate-inputs.mjs) while it provisions
      # browsers. This job proves the whole CLI build and caches it for a rerun of the same sources.
      - if: steps.build-cache.outputs.cache-hit != 'true'
        run: npm run build -w services/cli
      - if: steps.build-cache.outputs.cache-hit != 'true'
        run: node scripts/build/build-server.mjs dist/server.mjs
      # An ordinary app merge also supplies the exact tested npm host to downstream composition.
      # Package before pruning host runtime; keep only the universal tarball in the build cache.
      - if: steps.build-cache.outputs.cache-hit != 'true' && needs.plan.outputs.cli != 'true'
        run: npm run pack:release -w services/cli -- "$GITHUB_WORKSPACE/dist/npm-candidate"
      - if: needs.plan.outputs.cli != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afbin-npm-packages
          path: dist/npm-candidate/*.tgz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      # Browser gates need neither the host runtime nor its archive.
      - if: steps.build-cache.outputs.cache-hit != 'true'
        run: rm -rf services/cli/dist/runtime services/cli/dist/afbin-runtime-*.gz

  # On PRs #158 and #159, five shards spent up to 215s in Vitest and 25s
  # provisioning Chromium. Eight spread the growing API file set while the
  # independent runners kept the run's critical path at the slowest shard; by run 36608202961 the
  # slowest of eight was 188s (shard 3) — over the ~150s per-job target — so it splits ten ways.
  # EIGHT again after run 36879103503: ten shards ran 75-90s while the gate shards ran 110-160s, so two
  # of their runners went to the gates (twelve shards) and the run's runner count stayed the same.
  # FOUR once the files that only mocked `@/auth` took their session from the harness (setSession) and joined
  # the shared module graph, and six small isolated files merged into their neighbours: by
  # scripts/ci/test-timings.json each of four shards carries ~215-237s of per-file time against ~119s at eight
  # (runs 37118557786/37118962945 turned ~119s into 40-75s of Vitest), under the gate shards' ~155s.
  api:
    needs: [ plan ]
    if: needs.plan.outputs.api == 'true'
    name: api tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4 ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # The whole-install cache, and why its key is a normalised lockfile rather than the lockfile
      # itself: see the `checks` job above, which carries the full note.
      - run: node scripts/ci/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'services/cli/scripts/prepare-pty.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      # The export tests drive real headless Chromium (lib/export.ts). The
      # browser download is the slow half of the install; cache it on what pins
      # the browser (playwright-core's browsers.json), as the gates do — keyed on
      # the whole lockfile, any dependency change missed it and paid a download
      # plus a --with-deps apt pass: 135s on api shard 6 of run 36867180747.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      # `--with-deps` apt-installs Chromium's system libraries on EVERY run (~30s) even when the
      # browser binary came from the cache. ubuntu-latest already ships those libraries, so the
      # deps pass is only worth paying for when the browser is actually being downloaded.
      # No `--with-deps`, hit or miss: ubuntu-latest already ships Chromium's libraries, and the apt
      # pass on a miss cost 135s on api shard 6 of run 36867180747. A miss now costs the download.
      - run: npx playwright install chromium
      # The test global setup builds the server reader and the islands behind content-verified
      # markers: 38s of every cold shard. Restore the latest build (this PR's, else main's); a marker
      # that no longer matches this tree rebuilds, so a stale restore costs only the build it replaces.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: test-builds
        with:
          path: |
            services/app/public/islands
            services/app/lib/build-assets
            node_modules/.cache/build-islands.json
          key: test-builds-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: test-builds-v1-${{ runner.os }}-
      # Files are packed by measured time (scripts/lib/timed-sequencer.mjs), not by count, and the
      # api project shares one module graph per worker; the files that mock modules run isolated.
      - run: npx vitest run --project=api --project=api-isolated --shard=${{ matrix.shard }}/4
      - if: matrix.shard == 1 && steps.test-builds.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            services/app/public/islands
            services/app/lib/build-assets
            node_modules/.cache/build-islands.json
          key: test-builds-v1-${{ runner.os }}-${{ github.sha }}

  # EACH SHARD BUILDS WHAT IT RUNS, while it provisions browsers. The shards used to download the `build`
  # job's artifact and poll that job until it finished: on runs 36875673784 and 36876517464 they sat
  # 35-58s in that wait after ~25s of their own setup, because `build` also assembles the CLI's host
  # runtime (~16s) and type declarations no gate reads. scripts/build/build-gate-inputs.mjs builds only the
  # app, dist/server.mjs and the CLI bundle (~20s with the restored islands and reader), started in the
  # background right after the install restore, so it overlaps the browser, Postgres and sandbox steps.
  # Nothing here depends on `build`, which still runs the whole CLI build beside this job.
  gates:
    needs: [ plan ]
    if: needs.plan.outputs.gates == 'true'
    name: browser gates (${{ matrix.shard }}/7)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4, 5, 6, 7 ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # The whole-install cache, and why its key is a normalised lockfile rather than the lockfile
      # itself: see the `checks` job above, which carries the full note.
      - run: node scripts/ci/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'services/cli/scripts/prepare-pty.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      # A BUILD OF THESE EXACT SOURCES ALREADY CACHED (see the `build` job) means there is nothing to
      # build: the shard restores it and starts its gates at once. Restore only — the entry is written by
      # `build`, never by a shard.
      - id: build-key
        run: node scripts/ci/ci.mjs build-key
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: build-cache
        with:
          path: |
            dist
            services/app/dist
            services/app/lib/build-assets
            services/app/public/islands
            services/app/public/libraries
            services/app/server/routes.generated.ts
            services/cli/dist
          key: app-build-v2-${{ runner.os }}-${{ runner.arch }}-node22-${{ steps.build-key.outputs.key }}-npm-${{ needs.plan.outputs.cli }}
      # The islands and server reader with their content markers (see the api job): the build below
      # takes `--cache`, so a restore that matches this tree turns the ~27s island build into a check.
      - if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            services/app/public/islands
            services/app/lib/build-assets
            node_modules/.cache/build-islands.json
          key: test-builds-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: test-builds-v1-${{ runner.os }}-
      # IN THE BACKGROUND: every stream is redirected, or the runner would hold this step open until the
      # build closed the step's output pipe. "Wait for this shard's build" below collects it.
      - name: Build the app, server and CLI bundle in the background
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          ( node scripts/build/build-gate-inputs.mjs > "$RUNNER_TEMP/gate-build.log" 2>&1; echo $? > "$RUNNER_TEMP/gate-build.status" ) < /dev/null > /dev/null 2>&1 &
      # KEYED ON WHAT PINS THE BROWSER, not on the lockfile: browsers.json is where playwright-core
      # records the Chromium revision it will download, so the entry survives every lockfile change
      # that is not a Playwright upgrade — including the version line a release rewrites.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      # Chromium libraries ship on the runner. Firefox/WebKit need additional system
      # packages even on a browser-cache hit; install them only on shards that use them.
      - id: gate-browsers
        run: |
          echo "browsers=$(node scripts/gates.mjs --browsers --shard=${{ matrix.shard }}/7)" >> "$GITHUB_OUTPUT"
          echo "postgres=$(node scripts/gates.mjs --needs-postgres --shard=${{ matrix.shard }}/7)" >> "$GITHUB_OUTPUT"
      # FIREFOX/WEBKIT'S SYSTEM PACKAGES, KEPT AS .debs. Their `--with-deps` apt pass is the one
      # provisioning step that hangs on a slow mirror: 91s typically, 236s on PR #269's run 36867396926
      # (one gate shard), against a 240s job budget. Only the cross-browser shards pay it, and with the
      # packages already in apt's archive they install without downloading anything.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.gate-browsers.outputs.browsers != 'chromium'
        with:
          path: ~/browser-debs
          key: browser-debs-v1-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - name: Install selected gate browsers
        env:
          BROWSERS: ${{ steps.gate-browsers.outputs.browsers }}
          CACHE_HIT: ${{ steps.playwright.outputs.cache-hit }}
        run: |
          read -ra selected_engines <<< "$BROWSERS"
          deps=()
          # A Chromium-only shard never runs apt: ubuntu-latest ships Chromium's libraries, so a browser
          # cache miss costs the download alone, never a mirror's mood. (The cache is warmed on main —
          # see `warm-caches` — so a PR's first run restores it too.)
          if [[ "$BROWSERS" != chromium ]]; then
            deps+=(--with-deps)
            if compgen -G "$HOME/browser-debs/*.deb" > /dev/null; then sudo cp "$HOME"/browser-debs/*.deb /var/cache/apt/archives/; fi
          fi
          echo "browser cache hit: ${CACHE_HIT:-false}"
          npx playwright install "${deps[@]}" "${selected_engines[@]}"
          if [[ "$BROWSERS" != chromium ]]; then
            mkdir -p "$HOME/browser-debs"
            cp /var/cache/apt/archives/*.deb "$HOME/browser-debs/" 2>/dev/null || true
          fi
      # The gate runner selects the shard on this host; pull Postgres only when
      # that selection includes postgres-datasets, before its gate timeout starts.
      # Neither this nor the sandbox prep below needs anything `build` produces, so both run
      # while `build` is still assembling its artifact rather than after waiting for it.
      - name: pull the Postgres image the datasets gate needs
        if: steps.gate-browsers.outputs.postgres == 'true'
        run: docker pull postgres:17-alpine
      - name: Prepare isolated browser session workers
        run: |
          sudo apt-get install -y bubblewrap || { sudo apt-get update; sudo apt-get install -y bubblewrap; }
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo mkdir -p /sys/fs/cgroup/afbin-sessions
          echo '+cpu +memory +pids' | sudo tee /sys/fs/cgroup/afbin-sessions/cgroup.subtree_control
          sudo chown -R "$USER" /sys/fs/cgroup/afbin-sessions
          sudo chown "$USER" /sys/fs/cgroup/cgroup.procs
      # The build started above, awaited here: its log, and its exit status as this step's.
      - name: Wait for this shard's build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          until [ -f "$RUNNER_TEMP/gate-build.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/gate-build.log"
          exit "$(cat "$RUNNER_TEMP/gate-build.status")"
      # The runner boots the servers with one protected per-run mail outbox.
      # Two servers within each runner. The
      # within-machine fan-out bottomed out at 192s on four vCPUs; the shard is
      # balanced by each gate's measured weight, not by count, so no one runner
      # ends up holding every slow gate (scripts/gates.shard.mjs). More than two
      # shards: the set ran 213s and ~170s of gate work in two shards on main run
      # 34697938970, and further shards divide that work rather than the machine.
      #
      # Twelve shards (two taken from api), packed by each gate's MEASURED CI seconds rather than its
      # timeout (scripts/gates.manifest.mjs `shardWeight`): <=~75s of gate work per shard. The gates that
      # lose races under a neighbour's load (`CI_ISOLATED_GATES`) share one shard and nothing else, and
      # the runner gives that set one server, one gate at a time (scripts/gates.servers.mjs `serversFor`).
      - name: every gate, two servers
        run: node scripts/gates.mjs --servers=2 --shard=${{ matrix.shard }}/7
        env:
          AUTH__SECRET: gates-ci-${{ github.run_id }}
          DATASET__ALLOW_PRIVATE_NETWORKS: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-session-images-${{ matrix.shard }}
          path: tmp/browser-session-evidence/*.png
          if-no-files-found: ignore

  # CACHES A PULL REQUEST CAN ACTUALLY READ. A PR reads caches from its own branch and from main, and a
  # push to main runs nothing (`plan` finds the tree PR CI already tested), so nothing ever saved these
  # on main: every new PR's first run missed the install, the browsers and the build together. This
  # job fills main's scope on every push and nightly (caches unused for a week are evicted), off every
  # path anyone waits on: no job needs it and the `test` roll-up does not wait for it. Each step is a
  # no-op when its entry already exists.
  warm-caches:
    if: github.event_name != 'pull_request'
    name: warm caches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: node scripts/ci/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'services/cli/scripts/prepare-pty.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      # All three engines under the one key every job restores: on main this job is the only writer.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: browser-debs
        with:
          path: ~/browser-debs
          key: browser-debs-v1-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - if: steps.playwright.outputs.cache-hit != 'true' || steps.browser-debs.outputs.cache-hit != 'true'
        run: |
          npx playwright install --with-deps chromium firefox webkit
          mkdir -p "$HOME/browser-debs"
          cp /var/cache/apt/archives/*.deb "$HOME/browser-debs/" 2>/dev/null || true
      - id: build-key
        run: node scripts/ci/ci.mjs build-key
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: build-cache
        with:
          path: |
            dist
            services/app/dist
            services/app/lib/build-assets
            services/app/public/islands
            services/app/public/libraries
            services/app/server/routes.generated.ts
            services/cli/dist
          key: app-build-v2-${{ runner.os }}-${{ runner.arch }}-node22-${{ steps.build-key.outputs.key }}-npm-false
      - if: steps.build-cache.outputs.cache-hit != 'true'
        run: npm run build -w services/cli
      - if: steps.build-cache.outputs.cache-hit != 'true'
        run: node scripts/build/build-server.mjs dist/server.mjs
      # This writer must retain the package expected by ordinary builds restoring this key.
      - if: steps.build-cache.outputs.cache-hit != 'true'
        run: npm run pack:release -w services/cli -- "$GITHUB_WORKSPACE/dist/npm-candidate"
      - if: steps.build-cache.outputs.cache-hit != 'true'
        run: rm -rf services/cli/dist/runtime services/cli/dist/afbin-runtime-*.gz
      # What the test shards restore (see the api job): the server reader and islands with their markers.
      - run: (cd services/app && node scripts/build-server-reader.mjs --cache && node ../../scripts/build/build-islands.mjs --cache)
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            services/app/public/islands
            services/app/lib/build-assets
            node_modules/.cache/build-islands.json
          key: test-builds-v1-${{ runner.os }}-${{ github.sha }}

  # THE ROLL-UP, AND THE RECORD OF WHAT IT PASSED ON.
  #
  # A tree that passed here has been tested, and testing it again — which is exactly what the push
  # that merges it used to do, eight minutes of full matrix on bytes PR CI had just proved — buys
  # nothing and delays production by those eight minutes. So this job writes down the tree it
  # passed, under a name any later run can look up: `tested-tree-<git tree hash>`. The push then
  # finds it (scripts/ci/ci.mjs `plan`) and selects nothing at all.
  #
  # The artifact IS the pass: it is written after `check`, so it only exists for a green run.
  #
  # IT ALSO REPORTS WHAT THE RUN COST — and, on a pull request, whether it may cost that. This was the
  # separate `job timings` job, waiting on the same jobs as this one; folded in, it is one runner and
  # one setup fewer per run, for one `gh api` call (see "every job's wall clock" below).
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reading the run's own job list (the wall-clock report below) is a scope the workflow does not
    # grant. A job-level block REPLACES the workflow's, so `contents: read` is restated, not inherited.
    permissions:
      contents: read
      actions: read
    # `warm-caches` is deliberately NOT here: `notify-consumer` waits on this job, so waiting on a
    # 15-minute cache warmer would put it on merge → production. It never runs on a pull request, and
    # on main it is simply absent from the wall-clock table.
    needs:
      [
        plan,
        checks,
        node,
        ui,
        build,
        api,
        gates,
        cli-pack,
        cli,
        reference-compatibility
      ]
    if: always()
    steps:
      # Full history: recording the patch (below) diffs against the PR's base commit, which a
      # shallow, single-commit checkout would not have fetched.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: All selected jobs green
        env:
          CI__NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/ci.mjs check
      # WHAT THIS RUN ACTUALLY COST — and, on a pull request, whether it may cost that.
      #
      # The table was toothless on purpose, and that was right while the budget was a wish. It is not a
      # wish any more: merge → production has to fit in seven minutes, and a job that runs long is what
      # spends them. So on a PULL REQUEST a job over its budget fails this run, and the message names
      # the step that took the longest, because "gates took 300s" is not something anyone can act on.
      # On main it stays a summary: a push has nothing left to fix, and a slow runner there would turn
      # this into a red merge button teaching everyone to re-run.
      #
      # Every required job has the same four-minute ceiling, including native npm acceptance.
      # `always()`: the table is most useful on a run that failed. Before the tested tree is recorded, so
      # a pull request over budget never leaves a tested-tree artifact behind (the artifact IS the pass).
      - name: every job's wall clock, over-budget named
        if: always()
        # A summary on main, a gate on a pull request.
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET_S: '240'
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # $slowest is a jq binding; the single quotes are what keep it one.
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[]
                  | select(.name != "test")
                  | select(.started_at != null and .completed_at != null)
                  | ([ .steps[]?
                       | select(.started_at != null and .completed_at != null)
                       | { name: .name,
                           seconds: ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) } ]
                     | sort_by(.seconds) | last) as $slowest
                  | [ ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)),
                      .name, .conclusion,
                      (($slowest.name // "-") + " " + (($slowest.seconds // 0) | tostring) + "s") ]
                  | @tsv' \
            | sort -rn > durations.tsv
          over=0
          : > over-budget.txt
          {
            echo "## Job wall clock (budget ${BUDGET_S}s)"
            echo
            echo '| | job | seconds | result | slowest step |'
            echo '| --- | --- | ---: | --- | --- |'
            while IFS=$'\t' read -r seconds name conclusion slowest; do
              budget="$BUDGET_S"
              mark=''
              if [ "$seconds" -gt "$budget" ]; then
                mark='OVER'
                over=$((over + 1))
                # Collected, not printed: this block's stdout is the step summary file.
                printf '%s took %ss (budget %ss); its slowest step was %s\n' "$name" "$seconds" "$budget" "$slowest" >> over-budget.txt
              fi
              printf '| %s | %s | %s | %s | %s |\n' "$mark" "$name" "$seconds" "$conclusion" "$slowest"
            done < durations.tsv
            echo
            if [ "$over" -eq 0 ]; then
              echo "Every job finished inside its budget."
            else
              echo "${over} job(s) over budget. Fix the cause — do not raise the budget to meet the job."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do echo "::error::$line"; done < over-budget.txt
          if [ "$over" -gt 0 ] && [ "${GITHUB_EVENT_NAME}" = pull_request ]; then exit 1; fi
      # On a pull request the checkout is refs/pull/N/merge — the tree a squash merge produces, which
      # is the tree the push to main will carry, PROVIDED no other PR moves the base in between. When
      # one does, the tree no longer matches, but the PATCH (recorded here too, when this is a pull
      # request) still can: scripts/ci/ci.mjs `plan`, `patchGapIsSafe`.
      - name: Record the tested tree
        id: tree
        env:
          CI__SOURCE_RUN: ${{ needs.plan.outputs.source-run }}
          CI__EVENT: ${{ github.event_name }}
          CI__BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci/ci.mjs record-tree
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-tree/tested-tree.json
          # Longer than any merge window: the lookup that reads this runs when the PR merges, and an
          # expired artifact is no evidence (scripts/ci/ci.mjs filters them out) — it is a full matrix.
          retention-days: 14
          overwrite: true
      # THE PATCH THIS PULL REQUEST TESTED, keyed by its base and content — not its tree, which a
      # later, unrelated merge can change out from under it. A push whose exact tree misses (another
      # PR merged first) looks this up by `git patch-id`, invariant to that moved base.
      - if: steps.tree.outputs.patch-id != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-patch-${{ steps.tree.outputs.patch-id }}
          path: tested-patch/tested-patch.json
          retention-days: 14
          overwrite: true
      # WHICH RUN HOLDS THE BINARIES, for `release-cli.yml`: this run when it built them, the run
      # this one reused when it did not. Only on main; a PR publishes nothing.
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-run
          path: tested-run/tested-run.json
          retention-days: 14
          overwrite: true

  # RELEASE ONLY. Selected when the CLI version changed (scripts/lib/ci-plan.mjs `cliRelease`).
  # Native acceptance consumes one universal tarball; packaging starts independently of app checks.
  # Ordinary CLI changes remain guarded by the bundle build and source suite in the node job.
  cli-pack:
    name: CLI npm pack
    permissions:
      contents: read
      id-token: write
    needs: [ plan ]
    if: needs.plan.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - run: npm ci
      - run: npm run build -w services/cli
      - run: npm run pack:release -w services/cli
      - name: Sign the actual build's npm provenance
        if: github.repository == 'minusxai/artifactbin' && github.event.repository.private == false && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_REPOSITORY_VISIBILITY: public
          AFBIN_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          AFBIN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version=$(node -p "require('./services/cli/package.json').version")
          node scripts/ci/npm-provenance.mjs sign "services/cli/dist/packages/afbin-cli-$version.tgz" "$version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afbin-npm-release
          path: |
            services/cli/dist/packages/*.tgz
            services/cli/dist/packages/*.sigstore
            services/cli/dist/packages/*.build.json
            services/cli/dist/packages/transition/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      # Downstream hosts consume this same universal tarball after the run's tested receipt.
      # Pack owns the release alias even for nightly/version-only selection.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afbin-npm-packages
          path: services/cli/dist/packages/*.tgz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  cli:
    needs: [ plan, cli-pack ]
    if: needs.plan.outputs.cli == 'true'
    name: CLI npm (${{ matrix.os }} Node ${{ matrix.node }} ${{ matrix.phase }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-2022 ]
        node: [22.22.3, 24.21.0]
        phase: [native, experience]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      # Acceptance tooling has its own pinned lock: no app build or local execution engines.
      # Each phase's clock includes restoring or installing all its prerequisites.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: matrix.phase == 'experience'
        id: install
        with:
          path: |
            scripts/ci/npm-acceptance/node_modules
          key: npm-acceptance-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('scripts/ci/npm-acceptance/package-lock.json', 'services/contracts/package.json', 'services/utils/package.json') }}
      - if: matrix.phase == 'experience' && steps.install.outputs.cache-hit != 'true'
        run: npm ci --prefix scripts/ci/npm-acceptance --no-audit --no-fund
      - if: matrix.phase == 'experience'
        run: node scripts/ci/link-npm-acceptance.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: afbin-npm-release
          path: npm-candidate
      # Bootstrap owns a separate fresh user/cache from the cold native package install.
      # Both proofs start together; the harness waits for both verdicts before succeeding.
      - name: Same-tarball native npm and warmed offline acceptance
        if: matrix.phase == 'native'
        run: npm run test:npm-package -w services/cli -- --ci --parallel-bootstrap
      - name: Install the same candidate for experience checks
        if: matrix.phase == 'experience'
        run: npm run test:npm-package -w services/cli -- --ci --install-only
      - name: Installed public library declarations compile without private workspace aliases
        if: matrix.phase == 'experience' && matrix.node == '22.22.3' && (runner.os == 'Linux' && runner.arch == 'X64' || runner.os == 'Windows')
        working-directory: services/cli
        run: node scripts/test-installed-npm.mjs types
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: matrix.phase == 'experience'
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/npm-acceptance/node_modules/playwright-core/browsers.json') }}
      - name: Installed npm preview and export, with process shutdown
        if: matrix.phase == 'experience'
        working-directory: services/cli
        run: |
          node ../../node_modules/playwright/cli.js install --with-deps chromium
          node scripts/test-installed-npm.mjs experience

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure() && matrix.phase == 'experience'
        with:
          name: npm-local-journey-${{ matrix.os }}-${{ matrix.node }}
          path: |
            services/cli/test-results/local-journey
            services/cli/test-results/preview
          if-no-files-found: ignore
          retention-days: 7

  # Reference conformance checks the source bundle and the exact tested installed npm package.
  reference-compatibility:
    needs: [ plan, cli-pack ]
    if: needs.plan.outputs.reference-compatibility == 'true'
    name: CLI distributions against ID-first host
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json
      - run: node scripts/ci/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'services/cli/scripts/prepare-pty.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: .
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - run: npm run build -w services/cli
        working-directory: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: afbin-npm-release
          path: npm-candidate
      - name: Install real package artifacts outside the checkout
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/afbin-packages" "$RUNNER_TEMP/afbin-consumer"
          cp "$GITHUB_WORKSPACE"/npm-candidate/*.tgz "$RUNNER_TEMP/afbin-packages/"
          npm install --prefix "$RUNNER_TEMP/afbin-consumer" --no-audit "$RUNNER_TEMP"/afbin-packages/*.tgz
      - run: npx playwright install --with-deps chromium
        working-directory: .
      # CLI host build already compiled the app; bundle only the gate server now.
      - name: Build OSS host
        working-directory: .
        run: node scripts/build/build-server.mjs dist/server.mjs
      - name: ID-first conformance for source bundle and installed npm package
        working-directory: .
        run: |
          # Each runner owns a PID-scoped data directory, outbox and OS-allocated port.
          wait_pair() {
            ci_result=0
            for ci_pid in "${ci_pids[@]}"; do wait "$ci_pid" || ci_result=1; done
            return "$ci_result"
          }
          ci_pids=()
          for cli in "$GITHUB_WORKSPACE/services/cli/dist/afbin.mjs" "$RUNNER_TEMP/afbin-consumer/node_modules/@afbin/cli/dist/afbin.mjs"; do
            CONFORMANCE__CLI="$cli" node scripts/gates.mjs --servers=1 --only=accounts-and-workspace &
            ci_pids+=("$!")
          done
          # OAuth uses its own PID-scoped host and outbox, alongside the two email proofs.
          CONFORMANCE__CREDENTIAL_SOURCE=outbox-oauth CONFORMANCE__CLI="$GITHUB_WORKSPACE/services/cli/dist/afbin.mjs" node scripts/gates.mjs --servers=1 --only=accounts-and-workspace &
          ci_pids+=("$!")
          wait_pair

      - name: Prepare standalone sandbox worker
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo mkdir -p /sys/fs/cgroup/afbin-sessions
          echo '+cpu +memory +pids' | sudo tee /sys/fs/cgroup/afbin-sessions/cgroup.subtree_control
          sudo chown -R "$USER" /sys/fs/cgroup/afbin-sessions
          sudo chown "$USER" /sys/fs/cgroup/cgroup.procs
      - name: Team hosts with isolated PGLite and PostgreSQL
        working-directory: services/cli
        run: |
          docker run -d --name afbin-serve-postgres -p 5432:5432 -e POSTGRES_PASSWORD=afbin -e POSTGRES_DB=afbin postgres:17-alpine
          for _ in $(seq 1 60); do
            if docker exec afbin-serve-postgres pg_isready -U postgres; then break; fi
            sleep 1
          done
          node scripts/test-team-host.mjs dist/afbin.mjs &
          ci_local_pid=$!
          CONFORMANCE__DB_URL=postgres://postgres:afbin@127.0.0.1:5432/afbin node scripts/test-team-host.mjs dist/afbin.mjs &
          ci_postgres_pid=$!
          ci_result=0
          wait "$ci_local_pid" || ci_result=1
          wait "$ci_postgres_pid" || ci_result=1
          exit "$ci_result"

  # notify-consumers.yml used to do this via `workflow_run: [ci], completed` — correct, but it waits
  # for THIS ENTIRE WORKFLOW to be marked completed and then pays a second cold-start (a fresh queued
  # job on a brand-new runner): together that cost ~46s of the merge→production chain (product merge
  # 17:12:45 → Update Submodule start 17:14:09, run 36603331879/36603413942) for one `gh api` POST.
  # Doing it as a job HERE removes that hop entirely: `needs` gives the identical "only if every real
  # job passed" gate, no `if: always()` here so a genuine failure upstream skips this job the normal
  # way, and it runs alongside `release-cli` instead of waiting on a separate workflow's
  # roundtrip.
  #
  # `success()`, not `!contains(needs.*.result,'failure')`, was the first attempt here and it never
  # actually dispatched (run 36616833422, a clean push with everything green): `cli`/
  # `reference-compatibility` are SKIPPED on most merges — nothing in the diff touched the CLI — and
  # `success()` treats a skipped dependency the same as a failed one, so this job cascaded to skipped
  # on the ordinary case and only would have fired on the rare push that ran the whole matrix.
  notify-consumer:
    name: notify the configured consumer repository
    needs:
      [
        plan,
        checks,
        node,
        ui,
        build,
        api,
        gates,
        cli-pack,
        cli,
        test,
        reference-compatibility
      ]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') &&
      github.event_name == 'push' && vars.CONSUMER_REPOSITORY != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify the configured consumer of the exact tested revision
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
          CONSUMER: ${{ vars.CONSUMER_REPOSITORY }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          jq -n --arg sha "$SHA" '{event_type:"toolkit-updated",client_payload:{sha:$sha}}' | gh api "repos/$CONSUMER/dispatches" --input -
