name: ci

on:
  pull_request:
  push:
    branches: [ main ]
  # The release-only CLI matrix runs on NO ordinary pull request, so between releases nothing would
  # notice a broken binary build — and its caches, unused, expire. Nightly on main it builds the four
  # platforms: drift shows up the next morning instead of inside a release, and the macOS/Linux
  # install caches stay warm on the default branch, which is most of what makes a release build fast.
  schedule:
    - cron: '17 9 * * *'
  # The "Release afbin" workflow dispatches this one on the release branch when it pushed with the
  # repository token, whose events start no workflow; the checks land on the PR. With a PAT its own
  # pull_request event starts this workflow and no dispatch happens.
  workflow_dispatch:

# New commits supersede earlier checks on the same PR. Main runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job here only reads the repo; the GITHUB_TOKEN should be able to do
# exactly that and nothing else (CodeQL: actions/missing-workflow-permissions).
permissions:
  contents: read

# Wall time is the point: the old single job ran everything serially (7m+, of
# which npm test was 5m — ~330s of aggregate api-suite work meeting 4 shared
# vCPUs). The suite now fans out: fast checks + the two lighter vitest
# projects in one job, the production build in another, and the heavy api project
# SHARDED across the matrix below. Each shard is its own PGLite process, so the
# no-parallel-projects rule (one embedded connection per process) still holds
# within every job.
jobs:
  plan:
    name: affected modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Finding the run that already tested this tree reads the repository's artifact list. A job-level
    # block REPLACES the workflow's, so `contents: read` is restated rather than inherited.
    permissions:
      contents: read
      actions: read
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      checks: ${{ steps.select.outputs.checks }}
      node: ${{ steps.select.outputs.node }}
      ui: ${{ steps.select.outputs.ui }}
      build: ${{ steps.select.outputs.build }}
      api: ${{ steps.select.outputs.api }}
      gates: ${{ steps.select.outputs.gates }}
      cli: ${{ steps.select.outputs.cli }}
      reference-compatibility: ${{ steps.select.outputs.reference-compatibility }}
      # Not a job: whether the node job runs the CLI source suite (every CLI change, not only a release).
      cli-tests: ${{ steps.select.outputs.cli-tests }}
      # Not a job either: whether `checks` must refuse this PR for shipping the CLI without a version.
      cli-bump: ${{ steps.select.outputs.cli-bump }}
      # The run that already tested this exact tree, when there is one; empty otherwise.
      source-run: ${{ steps.select.outputs.source-run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - id: select
        env:
          CI__EVENT: ${{ github.event_name }}
          CI__BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI__BEFORE_SHA: ${{ github.event.before }}
          CI__HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci.mjs plan

  # THE TYPE CHECK ANSWERS ON ITS OWN, because it is the fastest signal on the
  # commonest mistake and it was sharing a job with something 5x its length.
  checks:
    needs: [ plan ]
    if: needs.plan.outputs.checks == 'true'
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # Cache THE WHOLE INSTALL, not just npm's download cache: `npm ci` costs ~23s in every job
      # even with a warm ~/.npm. The install's products are not all inside node_modules — the app
      # workspace's postinstall (copy-assets.mjs) writes the content-hashed webfonts under
      # public/fonts and the manifest lib/data/story/story-fonts reads, and a build without them
      # serves every document with missing fonts. They derive from node_modules alone, so they
      # belong in the same entry under the same lockfile key; caching node_modules by itself is
      # what forced a hand-run copy-assets step into all eight jobs, because on a cache HIT
      # `npm ci` — and therefore its postinstall — never runs at all. A partial restore is not
      # silent: lib/data/story/__tests__/story-fonts.test.ts reads the manifest and the bytes.
      # A RELEASE MUST NOT COLD-START EVERY JOB. The key used to hash package-lock.json itself, and
      # `npm run release:cli` rewrites one line of it — the CLI workspace's own version, which
      # resolves no dependency. hashFiles() cannot tell that line from a real one, so every release
      # missed this cache: run 35325636096, job `CLI (macos-15-intel)`, "Cache not found for input
      # keys: install-v3-macOS-X64-node22-a979…", 50s of `npm ci` and 29s of cache-post, while the
      # three caches beside it (Chromium, prebuilt Node, Chromium archive) restored on that same
      # runner because they key on files a bump does not touch. The fingerprint is the lockfile with
      # workspace versions normalised: a dependency that moved still changes it, a bump no longer does.
      - run: node scripts/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'services/cli/scripts/prepare-pty.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      # A CLI CHANGE THAT SHIPS NO VERSION SHIPS NOWHERE: the publisher only uploads when the version
      # moved, so the source would sit on main, released to nobody, until someone noticed. The rule
      # and its wording live in scripts/lib/ci-plan.mjs, where they are tested.
      - name: The CLI ships with a version
        if: needs.plan.outputs.cli-bump == 'true'
        run: node scripts/ci.mjs cli-bump
      # A WORKFLOW TYPO IS ONLY EXPENSIVE WHEN THE RUNNER FINDS IT. actionlint parses every workflow
      # here (and shellcheck reads every `run:` block) in about a second, in a pinned image anyone can
      # run locally: `docker run --rm -v "$PWD":/repo --workdir /repo rhysd/actionlint:1.7.7 -color`.
      - name: Lint the workflows
        run: docker run --rm -v "$PWD":/repo --workdir /repo rhysd/actionlint:1.7.7 -color
      - run: npm run validate

  # THE NODE PROJECT SHARDS, like api and ui. It is the biggest project in the
  # repo — 288 files, ~3,060 tests against api's 1,029 — and it was the only one
  # running whole, which made `validate + node` a 2m16s job of which 103s was
  # this step alone.
  #
  # THREE shards, and not more: the files sum to ~337s of work but the slowest
  # single file is 36s (services/auth login-routes, then lib/images optimise at
  # 34s), and vitest shards by FILE COUNT rather than duration — so past three
  # each extra shard approaches that 36s floor while still paying a runner's
  # startup. Measured locally, 2026-09-04.
  node:
    needs: [ plan ]
    if: needs.plan.outputs.node == 'true'
    name: node tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3 ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # Cache THE WHOLE INSTALL, not just npm's download cache: `npm ci` costs ~23s in every job
      # even with a warm ~/.npm. The install's products are not all inside node_modules — the app
      # workspace's postinstall (copy-assets.mjs) writes the content-hashed webfonts under
      # public/fonts and the manifest lib/data/story/story-fonts reads, and a build without them
      # serves every document with missing fonts. They derive from node_modules alone, so they
      # belong in the same entry under the same lockfile key; caching node_modules by itself is
      # what forced a hand-run copy-assets step into all eight jobs, because on a cache HIT
      # `npm ci` — and therefore its postinstall — never runs at all. A partial restore is not
      # silent: lib/data/story/__tests__/story-fonts.test.ts reads the manifest and the bytes.
      # A RELEASE MUST NOT COLD-START EVERY JOB. The key used to hash package-lock.json itself, and
      # `npm run release:cli` rewrites one line of it — the CLI workspace's own version, which
      # resolves no dependency. hashFiles() cannot tell that line from a real one, so every release
      # missed this cache: run 35325636096, job `CLI (macos-15-intel)`, "Cache not found for input
      # keys: install-v3-macOS-X64-node22-a979…", 50s of `npm ci` and 29s of cache-post, while the
      # three caches beside it (Chromium, prebuilt Node, Chromium archive) restored on that same
      # runner because they key on files a bump does not touch. The fingerprint is the lockfile with
      # workspace versions normalised: a dependency that moved still changes it, a bump no longer does.
      - run: node scripts/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'services/cli/scripts/prepare-pty.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      # Only shard 1 runs integration tests; the other shards need no browser or Docker.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: matrix.shard == 1
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # `--with-deps` apt-installs Chromium's system libraries on EVERY run (~30s) even when the
      # browser binary came from the cache. ubuntu-latest already ships those libraries, so the
      # deps pass is only worth paying for when the browser is actually being downloaded.
      - if: matrix.shard == 1 && steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: matrix.shard == 1 && steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install chromium
      - if: matrix.shard == 1
        run: docker pull postgres:17-alpine
      - run: npm run build -w services/cli
      - env:
          CI__PLAN: ${{ needs.plan.outputs.plan }}
        run: node scripts/ci.mjs node ${{ matrix.shard }}/3
      # The heavy tests that `npm test` leaves out — a disposable Dockerised
      # Postgres and real Chromium — live in the `integration` project and
      # would otherwise run nowhere in CI. This job already provisions both
      # (the Playwright install and `docker pull postgres:17-alpine` above), so
      # coverage rides here rather than in a new top-level job: only jobs listed
      # in scripts/lib/ci-plan.mjs's CI_JOBS are enforced by the `test` roll-up,
      # and this one already is. Run once (shard 1, not per shard); no
      # --passWithNoTests, so a rename that empties the include fails loudly
      # instead of passing vacuously.
      - if: matrix.shard == 1
        run: npm run test:integration
      - name: CLI source suite on the release runtime
        if: matrix.shard == 1 && needs.plan.outputs.cli-tests == 'true'
        run: |
          node services/cli/scripts/fetch-runtime.mjs
          PATH="$GITHUB_WORKSPACE/node_modules/.cache/cli-prebuilt-node:$PATH" npm test -w services/cli

  # jsdom setup dominates the ui project (~110s serial on a 4-vCPU runner —
  # the environment boots per test file), so it shards like api does.
  ui:
    needs: [ plan ]
    if: needs.plan.outputs.ui == 'true'
    name: ui tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2 ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # Cache THE WHOLE INSTALL, not just npm's download cache: `npm ci` costs ~23s in every job
      # even with a warm ~/.npm. The install's products are not all inside node_modules — the app
      # workspace's postinstall (copy-assets.mjs) writes the content-hashed webfonts under
      # public/fonts and the manifest lib/data/story/story-fonts reads, and a build without them
      # serves every document with missing fonts. They derive from node_modules alone, so they
      # belong in the same entry under the same lockfile key; caching node_modules by itself is
      # what forced a hand-run copy-assets step into all eight jobs, because on a cache HIT
      # `npm ci` — and therefore its postinstall — never runs at all. A partial restore is not
      # silent: lib/data/story/__tests__/story-fonts.test.ts reads the manifest and the bytes.
      # A RELEASE MUST NOT COLD-START EVERY JOB. The key used to hash package-lock.json itself, and
      # `npm run release:cli` rewrites one line of it — the CLI workspace's own version, which
      # resolves no dependency. hashFiles() cannot tell that line from a real one, so every release
      # missed this cache: run 35325636096, job `CLI (macos-15-intel)`, "Cache not found for input
      # keys: install-v3-macOS-X64-node22-a979…", 50s of `npm ci` and 29s of cache-post, while the
      # three caches beside it (Chromium, prebuilt Node, Chromium archive) restored on that same
      # runner because they key on files a bump does not touch. The fingerprint is the lockfile with
      # workspace versions normalised: a dependency that moved still changes it, a bump no longer does.
      - run: node scripts/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'services/cli/scripts/prepare-pty.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      - run: npx vitest run --project=ui --shard=${{ matrix.shard }}/2

  # The BUILD catches what tsc and vitest cannot: a route the generated table
  # has not seen, an import that only resolves under the bundler, a SPA module
  # that reaches for server config. It builds the story runtime, the route
  # table, the SPA and the bundled server — everything `afbin serve` serves.
  # Master shipped a broken build once because CI never ran it, and deploys
  # silently stopped.
  build:
    needs: [ plan ]
    if: needs.plan.outputs.build == 'true'
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # Cache THE WHOLE INSTALL, not just npm's download cache: `npm ci` costs ~23s in every job
      # even with a warm ~/.npm. The install's products are not all inside node_modules — the app
      # workspace's postinstall (copy-assets.mjs) writes the content-hashed webfonts under
      # public/fonts and the manifest lib/data/story/story-fonts reads, and a build without them
      # serves every document with missing fonts. They derive from node_modules alone, so they
      # belong in the same entry under the same lockfile key; caching node_modules by itself is
      # what forced a hand-run copy-assets step into all eight jobs, because on a cache HIT
      # `npm ci` — and therefore its postinstall — never runs at all. A partial restore is not
      # silent: lib/data/story/__tests__/story-fonts.test.ts reads the manifest and the bytes.
      # A RELEASE MUST NOT COLD-START EVERY JOB. The key used to hash package-lock.json itself, and
      # `npm run release:cli` rewrites one line of it — the CLI workspace's own version, which
      # resolves no dependency. hashFiles() cannot tell that line from a real one, so every release
      # missed this cache: run 35325636096, job `CLI (macos-15-intel)`, "Cache not found for input
      # keys: install-v3-macOS-X64-node22-a979…", 50s of `npm ci` and 29s of cache-post, while the
      # three caches beside it (Chromium, prebuilt Node, Chromium archive) restored on that same
      # runner because they key on files a bump does not touch. The fingerprint is the lockfile with
      # workspace versions normalised: a dependency that moved still changes it, a bump no longer does.
      - run: node scripts/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'services/cli/scripts/prepare-pty.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      # Build the Vite SPA, document runtime and bundled Hono server.
      - run: npm run build

  api:
    needs: [ plan ]
    if: needs.plan.outputs.api == 'true'
    name: api tests (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4, 5 ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # Cache THE WHOLE INSTALL, not just npm's download cache: `npm ci` costs ~23s in every job
      # even with a warm ~/.npm. The install's products are not all inside node_modules — the app
      # workspace's postinstall (copy-assets.mjs) writes the content-hashed webfonts under
      # public/fonts and the manifest lib/data/story/story-fonts reads, and a build without them
      # serves every document with missing fonts. They derive from node_modules alone, so they
      # belong in the same entry under the same lockfile key; caching node_modules by itself is
      # what forced a hand-run copy-assets step into all eight jobs, because on a cache HIT
      # `npm ci` — and therefore its postinstall — never runs at all. A partial restore is not
      # silent: lib/data/story/__tests__/story-fonts.test.ts reads the manifest and the bytes.
      # A RELEASE MUST NOT COLD-START EVERY JOB. The key used to hash package-lock.json itself, and
      # `npm run release:cli` rewrites one line of it — the CLI workspace's own version, which
      # resolves no dependency. hashFiles() cannot tell that line from a real one, so every release
      # missed this cache: run 35325636096, job `CLI (macos-15-intel)`, "Cache not found for input
      # keys: install-v3-macOS-X64-node22-a979…", 50s of `npm ci` and 29s of cache-post, while the
      # three caches beside it (Chromium, prebuilt Node, Chromium archive) restored on that same
      # runner because they key on files a bump does not touch. The fingerprint is the lockfile with
      # workspace versions normalised: a dependency that moved still changes it, a bump no longer does.
      - run: node scripts/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'services/cli/scripts/prepare-pty.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      # The export tests drive real headless Chromium (lib/export.ts). The
      # browser download is the slow half of the install; cache it on the lock
      # file (which pins the playwright version). --with-deps still apt-installs
      # shared libraries on every run — cheap next to the download.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # `--with-deps` apt-installs Chromium's system libraries on EVERY run (~30s) even when the
      # browser binary came from the cache. ubuntu-latest already ships those libraries, so the
      # deps pass is only worth paying for when the browser is actually being downloaded.
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install chromium
      - run: npx vitest run --project=api --shard=${{ matrix.shard }}/5

  gates:
    needs: [ plan ]
    if: needs.plan.outputs.gates == 'true'
    name: browser gates (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4, 5, 6 ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # Cache THE WHOLE INSTALL, not just npm's download cache: `npm ci` costs ~23s in every job
      # even with a warm ~/.npm. The install's products are not all inside node_modules — the app
      # workspace's postinstall (copy-assets.mjs) writes the content-hashed webfonts under
      # public/fonts and the manifest lib/data/story/story-fonts reads, and a build without them
      # serves every document with missing fonts. They derive from node_modules alone, so they
      # belong in the same entry under the same lockfile key; caching node_modules by itself is
      # what forced a hand-run copy-assets step into all eight jobs, because on a cache HIT
      # `npm ci` — and therefore its postinstall — never runs at all. A partial restore is not
      # silent: lib/data/story/__tests__/story-fonts.test.ts reads the manifest and the bytes.
      # A RELEASE MUST NOT COLD-START EVERY JOB. The key used to hash package-lock.json itself, and
      # `npm run release:cli` rewrites one line of it — the CLI workspace's own version, which
      # resolves no dependency. hashFiles() cannot tell that line from a real one, so every release
      # missed this cache: run 35325636096, job `CLI (macos-15-intel)`, "Cache not found for input
      # keys: install-v3-macOS-X64-node22-a979…", 50s of `npm ci` and 29s of cache-post, while the
      # three caches beside it (Chromium, prebuilt Node, Chromium archive) restored on that same
      # runner because they key on files a bump does not touch. The fingerprint is the lockfile with
      # workspace versions normalised: a dependency that moved still changes it, a bump no longer does.
      - run: node scripts/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'services/cli/scripts/prepare-pty.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      # KEYED ON WHAT PINS THE BROWSER, not on the lockfile: browsers.json is where playwright-core
      # records the Chromium revision it will download, so the entry survives every lockfile change
      # that is not a Playwright upgrade — including the version line a release rewrites.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      # `--with-deps` apt-installs Chromium's system libraries on EVERY run (~30s) even when the
      # browser binary came from the cache. ubuntu-latest already ships those libraries, so the
      # deps pass is only worth paying for when the browser is actually being downloaded.
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install chromium
      # 8s, measured on main runs 34697938970 and 34693741969 — so this stays a BUILD and not a
      # downloaded artifact. Handing the shards the `build` job's output instead would mean
      # uploading 40 MB (dist 12 MB, services/app/dist 14 MB, public/story 7.7 MB,
      # lib/story-runtime/dist 6.3 MB, plus public/libraries) and downloading it three times,
      # which costs more wall clock than the build it replaces and adds a cross-job dependency.
      - run: npm run build
      # The runner boots the servers with one protected per-run mail outbox.
      # Two servers within the runner, six runners across the set. The
      # within-machine fan-out bottomed out at 192s on four vCPUs; the shard is
      # balanced by each gate's measured weight, not by count, so no one runner
      # ends up holding every slow gate (scripts/gates.shard.mjs). More than two
      # shards: the set ran 213s and ~170s of gate work in two shards on main run
      # 34697938970, and further shards divide that work rather than the machine.
      #
      # postgres-datasets drives a real Dockerised Postgres; pulling the image
      # before the run keeps that cost out of the gate's own timeout budget.
      - name: pull the Postgres image the datasets gate needs
        run: docker pull postgres:17-alpine
      - run: npm run build -w services/cli
      - name: Prepare isolated browser session workers
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo mkdir -p /sys/fs/cgroup/afbin-sessions
          echo '+cpu +memory +pids' | sudo tee /sys/fs/cgroup/afbin-sessions/cgroup.subtree_control
          sudo chown -R "$USER" /sys/fs/cgroup/afbin-sessions
          sudo chown "$USER" /sys/fs/cgroup/cgroup.procs
      - name: every gate, two servers
        run: node scripts/gates.mjs --servers=2 --shard=${{ matrix.shard }}/6
        env:
          AUTH__SECRET: gates-ci-${{ github.run_id }}
          DATASET__ALLOW_PRIVATE_NETWORKS: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-session-images-${{ matrix.shard }}
          path: tmp/browser-session-evidence/*.png
          if-no-files-found: ignore

  # THE ROLL-UP, AND THE RECORD OF WHAT IT PASSED ON.
  #
  # A tree that passed here has been tested, and testing it again — which is exactly what the push
  # that merges it used to do, eight minutes of full matrix on bytes PR CI had just proved — buys
  # nothing and delays production by those eight minutes. So this job writes down the tree it
  # passed, under a name any later run can look up: `tested-tree-<git tree hash>`. The push then
  # finds it (scripts/ci.mjs `plan`) and selects nothing at all.
  #
  # The artifact IS the pass: it is written after `check`, so it only exists for a green run.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        plan,
        checks,
        node,
        ui,
        build,
        api,
        gates,
        cli,
        reference-compatibility
      ]
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: All selected jobs green
        env:
          CI__NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci.mjs check
      # On a pull request the checkout is refs/pull/N/merge — the tree a squash merge produces, which
      # is the tree the push to main will carry.
      - name: Record the tested tree
        id: tree
        env:
          CI__SOURCE_RUN: ${{ needs.plan.outputs.source-run }}
        run: node scripts/ci.mjs record-tree
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-tree/tested-tree.json
          # Longer than any merge window: the lookup that reads this runs when the PR merges, and an
          # expired artifact is no evidence (scripts/ci.mjs filters them out) — it is a full matrix.
          retention-days: 14
          overwrite: true
      # WHICH RUN HOLDS THE BINARIES, for `release-cli.yml`: this run when it built them, the run
      # this one reused when it did not. Only on main; a PR publishes nothing.
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-run
          path: tested-run/tested-run.json
          retention-days: 14
          overwrite: true

  # RELEASE ONLY. Selected when the CLI version changed (scripts/lib/ci-plan.mjs `cliRelease`): the
  # four-platform build was 4.5 minutes on the Intel runner with the render proofs queued behind it,
  # on every full run, for bytes the publisher never uploads unless the version moved. An ordinary
  # CLI change is guarded by the bundle build and the source suite in the node job.
  cli:
    needs: [ plan ]
    if: needs.plan.outputs.cli == 'true'
    name: CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      # A RELEASE MUST NOT COLD-START EVERY JOB. The key used to hash package-lock.json itself, and
      # `npm run release:cli` rewrites one line of it — the CLI workspace's own version, which
      # resolves no dependency. hashFiles() cannot tell that line from a real one, so every release
      # missed this cache: run 35325636096, job `CLI (macos-15-intel)`, "Cache not found for input
      # keys: install-v3-macOS-X64-node22-a979…", 50s of `npm ci` and 29s of cache-post, while the
      # three caches beside it (Chromium, prebuilt Node, Chromium archive) restored on that same
      # runner because they key on files a bump does not touch. The fingerprint is the lockfile with
      # workspace versions normalised: a dependency that moved still changes it, a bump no longer does.
      - run: node scripts/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'services/cli/scripts/prepare-pty.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: node_modules/.cache/cli-prebuilt-node/node
          key: cli-prebuilt-node-${{ matrix.os }}-${{
            hashFiles('services/cli/runtime-lock.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: services/cli/.cache/chromium-archive
          key: chromium-archive-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json', 'services/cli/scripts/runtime-archive.mjs') }}
      - name: Download and verify pinned prebuilt Node
        run: node services/cli/scripts/fetch-runtime.mjs
      - name: Chromium system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: npx playwright install-deps chromium
      - name: Build compact standalone CLI
        run: npm run build:binary -w services/cli
      - run: npm run test:binary -w services/cli
      - name: File preview from the actual executable
        if: matrix.os != 'macos-15-intel'
        working-directory: services/cli
        run: |
          npx playwright install chromium
          node --import tsx scripts/test-preview.ts
      # INTEL'S THREE PROOFS, WHERE THE BYTES ARE. They used to be three more macOS runners behind
      # this one (`CLI Intel preview|export-basic|export-variants`), each paying ~90s of checkout,
      # Node, install and cache restore, and an artifact round-trip to download the binary this job
      # had just written — 90s of setup for 2 minutes of proof, three times over, all of it on the
      # critical path of a release. Here the executable is already on disk and the three phases run
      # CONCURRENTLY: each builds its own temporary home, its own state directory and an
      # OS-allocated port (services/cli/scripts/test-preview.ts), so they do not meet.
      #
      # Measured on run 35334967117 (a version bump, all four platforms built): the three phases
      # together take 131s inside this job, and the job is 343s. Before, this job was 301s and the
      # three `CLI Intel <phase>` jobs behind it 154s/148s/230s — a 531s critical path for a release.
      - name: Intel preview and export proofs, from the executable just built
        if: matrix.os == 'macos-15-intel'
        working-directory: services/cli
        run: |
          set -uo pipefail
          npx playwright install chromium
          pids=''
          for phase in preview export-basic export-variants; do
            node --import tsx scripts/test-preview.ts dist/afbin-darwin-x64 "--phase=$phase" > "$RUNNER_TEMP/$phase.log" 2>&1 &
            pids="$pids $!:$phase"
          done
          status=0
          for pid in $pids; do
            wait "${pid%%:*}" || status=1
          done
          for phase in preview export-basic export-variants; do
            echo "::group::$phase"; cat "$RUNNER_TEMP/$phase.log"; echo '::endgroup::'
          done
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afbin-${{ matrix.os }}
          path: |
            services/cli/dist/afbin-*
            services/cli/dist/afbin.1
          if-no-files-found: error
          # The publisher downloads these from the run that built them, which is now a run that may
          # predate the merge. Anything shorter than the merge window loses the release.
          retention-days: 14

  # WHAT THIS RUN ACTUALLY COST — and, on a pull request, whether it may cost that.
  #
  # The table was toothless on purpose, and that was right while the budget was a wish. It is not a
  # wish any more: merge → production has to fit in seven minutes, and a job that runs long is what
  # spends them. So on a PULL REQUEST a job over its budget fails this run, and the message names
  # the step that took the longest, because "gates took 300s" is not something anyone can act on.
  # On main it stays a summary: a push has nothing left to fix, and a slow runner there would turn
  # this into a red merge button teaching everyone to re-run.
  #
  # Two budgets. 240s is the ordinary one, measured from what this branch achieves. The four-platform
  # CLI build is the exception: it compiles a standalone executable and drives real browsers against
  # it, it runs only for a release, and it is the whole reason the rest of the run had to get out of
  # its way. Its allowance is named here rather than hidden in a slower default for everything.
  #
  # Never part of the merge gate itself: absent from CI_JOBS and from the `test` roll-up's `needs`.
  timings:
    name: job timings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        plan,
        checks,
        node,
        ui,
        build,
        api,
        gates,
        cli,
        test,
        reference-compatibility
      ]
    if: always()
    # A summary on main, a gate on a pull request.
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    # This is the one job here that reads the Actions API rather than the repository. A job-level
    # block REPLACES the workflow's, so `contents: read` is restated rather than inherited.
    permissions:
      contents: read
      actions: read
    steps:
      # No checkout: the run's own job list is the only input.
      - name: every job's wall clock, over-budget named
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET_S: '240'
          # The release-only binary builds; see above. Measured on run 35334967117, which built all
          # four platforms from a version bump: Intel 343s (its three folded proofs 131s together),
          # macOS arm64 191s, Linux 192s and 174s. 420s leaves the slowest of those room to be slow
          # without turning a release red, and still catches a build that has doubled.
          SLOW_BUDGET_S: '420'
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # $slowest is a jq binding; the single quotes are what keep it one.
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[]
                  | select(.name != "job timings")
                  | select(.started_at != null and .completed_at != null)
                  | ([ .steps[]?
                       | select(.started_at != null and .completed_at != null)
                       | { name: .name,
                           seconds: ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) } ]
                     | sort_by(.seconds) | last) as $slowest
                  | [ ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)),
                      .name, .conclusion,
                      (($slowest.name // "-") + " " + (($slowest.seconds // 0) | tostring) + "s") ]
                  | @tsv' \
            | sort -rn > durations.tsv
          over=0
          : > over-budget.txt
          {
            echo "## Job wall clock (budget ${BUDGET_S}s, CLI binaries ${SLOW_BUDGET_S}s)"
            echo
            echo '| | job | seconds | result | slowest step |'
            echo '| --- | --- | ---: | --- | --- |'
            while IFS=$'\t' read -r seconds name conclusion slowest; do
              budget="$BUDGET_S"
              case "$name" in "CLI ("*|"CLI distributions"*) budget="$SLOW_BUDGET_S";; esac
              mark=''
              if [ "$seconds" -gt "$budget" ]; then
                mark='OVER'
                over=$((over + 1))
                # Collected, not printed: this block's stdout is the step summary file.
                printf '%s took %ss (budget %ss); its slowest step was %s\n' "$name" "$seconds" "$budget" "$slowest" >> over-budget.txt
              fi
              printf '| %s | %s | %s | %s | %s |\n' "$mark" "$name" "$seconds" "$conclusion" "$slowest"
            done < durations.tsv
            echo
            if [ "$over" -eq 0 ]; then
              echo "Every job finished inside its budget."
            else
              echo "${over} job(s) over budget. Fix the cause — do not raise the budget to meet the job."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do echo "::error::$line"; done < over-budget.txt
          if [ "$over" -gt 0 ] && [ "${GITHUB_EVENT_NAME}" = pull_request ]; then exit 1; fi

  reference-compatibility:
    needs: [ plan ]
    if: needs.plan.outputs.reference-compatibility == 'true'
    name: CLI distributions against ID-first host
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            candidate/node_modules
            candidate/services/*/node_modules
            candidate/services/app/public/fonts
            candidate/services/app/lib/data/story/story-font-manifest.json
          key: install-candidate-v3-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('candidate/package-lock.json', 'candidate/services/app/scripts/copy-assets.mjs', 'candidate/services/cli/scripts/prepare-pty.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: candidate
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('candidate/node_modules/playwright-core/browsers.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: candidate/services/cli/.cache/chromium-archive
          key: chromium-archive-candidate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('candidate/node_modules/playwright-core/browsers.json', 'candidate/services/cli/scripts/runtime-archive.mjs') }}
      - run: npm run build:binary -w services/cli
        working-directory: candidate
      - name: Install real package artifacts outside both checkouts
        working-directory: candidate
        run: |
          mkdir -p "$RUNNER_TEMP/afbin-packages" "$RUNNER_TEMP/afbin-consumer"
          npm pack -w services/contracts -w services/utils -w services/sql -w services/cli --pack-destination "$RUNNER_TEMP/afbin-packages"
          npm install --prefix "$RUNNER_TEMP/afbin-consumer" --no-audit "$RUNNER_TEMP"/afbin-packages/*.tgz
      - run: npx playwright install --with-deps chromium
        working-directory: candidate
      - name: Installed npm package runs file preview
        working-directory: candidate/services/cli
        run: node --import tsx scripts/test-preview.ts "$RUNNER_TEMP/afbin-consumer/node_modules/@artifactbin/cli/dist/afbin.mjs"
      - name: Build OSS host
        working-directory: candidate
        run: npm run build
      - name: ID-first conformance for bundle, installed package and executable
        working-directory: candidate
        run: |
          # Each runner owns a PID-scoped data directory, outbox and OS-allocated port.
          wait_pair() {
            ci_result=0
            for ci_pid in "${ci_pids[@]}"; do wait "$ci_pid" || ci_result=1; done
            return "$ci_result"
          }
          ci_pids=()
          for cli in "$GITHUB_WORKSPACE/candidate/services/cli/dist/afbin.mjs" "$RUNNER_TEMP/afbin-consumer/node_modules/@artifactbin/cli/dist/afbin.mjs"; do
            CONFORMANCE__CLI="$cli" node scripts/gates.mjs --servers=1 --only=cli-conformance &
            ci_pids+=("$!")
          done
          wait_pair
          ci_pids=()
          CONFORMANCE__CLI="$GITHUB_WORKSPACE/candidate/services/cli/dist/afbin-linux-x64" node scripts/gates.mjs --servers=1 --only=cli-conformance &
          ci_pids+=("$!")
          CONFORMANCE__CREDENTIAL_SOURCE=outbox-oauth CONFORMANCE__CLI="$GITHUB_WORKSPACE/candidate/services/cli/dist/afbin-linux-x64" node scripts/gates.mjs --servers=1 --only=cli-conformance &
          ci_pids+=("$!")
          wait_pair

      - name: Prepare standalone sandbox worker
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo mkdir -p /sys/fs/cgroup/afbin-sessions
          echo '+cpu +memory +pids' | sudo tee /sys/fs/cgroup/afbin-sessions/cgroup.subtree_control
          sudo chown -R "$USER" /sys/fs/cgroup/afbin-sessions
          sudo chown "$USER" /sys/fs/cgroup/cgroup.procs
      - name: Team hosts with isolated PGLite and PostgreSQL
        working-directory: candidate/services/cli
        run: |
          docker run -d --name afbin-serve-postgres -p 5432:5432 -e POSTGRES_PASSWORD=afbin -e POSTGRES_DB=afbin postgres:17-alpine
          for _ in $(seq 1 60); do
            if docker exec afbin-serve-postgres pg_isready -U postgres; then break; fi
            sleep 1
          done
          node scripts/test-team-host.mjs &
          ci_local_pid=$!
          CONFORMANCE__DB_URL=postgres://postgres:afbin@127.0.0.1:5432/afbin node scripts/test-team-host.mjs &
          ci_postgres_pid=$!
          ci_result=0
          wait "$ci_local_pid" || ci_result=1
          wait "$ci_postgres_pid" || ci_result=1
          exit "$ci_result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afbin-npm-packages
          path: ${{ runner.temp }}/afbin-packages/*.tgz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
