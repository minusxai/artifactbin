name: page speed

# Informational lab: PRs measure deterministic bytes; manual runs retain the
# throttled timing comparison. Neither mode gates ci.yml or comments on PRs.
on:
  pull_request:
    paths:
      - 'services/app/**'
      - 'services/utils/**'
      - 'services/contracts/**'
      - 'package-lock.json'
      - 'vite.config.mts'
      - 'server.ts'
      - 'scripts/performance-loads.mjs'
      - 'scripts/performance-report.mjs'
      - 'scripts/size-targets.mjs'
      - 'scripts/lib/document-views.mjs'
      - 'scripts/fixtures/page-speed/**'
      - '.github/workflows/page-speed.yml'
  push:
    branches: [ main ]
    paths:
      - 'services/app/**'
      - 'services/utils/**'
      - 'services/contracts/**'
      - 'package-lock.json'
      - 'vite.config.mts'
      - 'server.ts'
      - 'scripts/performance-loads.mjs'
      - 'scripts/performance-report.mjs'
      - 'scripts/size-targets.mjs'
      - 'scripts/lib/document-views.mjs'
      - 'scripts/fixtures/page-speed/**'
      - '.github/workflows/page-speed.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  measure:
    name: measure ${{ matrix.revision }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        revision: [base, head]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: node scripts/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'services/cli/scripts/prepare-pty.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install chromium
      - name: Check out base build
        if: matrix.revision == 'base'
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base="$(git rev-parse HEAD~1)"; fi
          git worktree add --detach .perf-base "$base"
          (cd .perf-base && node scripts/ci.mjs lock-fingerprint)
          same=true
          for f in .ci-cache-key/install.json services/app/scripts/copy-assets.mjs services/cli/scripts/prepare-pty.mjs; do
            cmp -s "$f" ".perf-base/$f" || same=false
          done
          if [ "$same" = true ]; then
            cp -al node_modules .perf-base/node_modules
            for dir in services/*/node_modules; do cp -al "$dir" ".perf-base/$dir"; done
            cp -al services/app/public/fonts .perf-base/services/app/public/fonts
            cp services/app/lib/data/story/story-font-manifest.json .perf-base/services/app/lib/data/story/story-font-manifest.json
          else
            (cd .perf-base && npm ci)
          fi
      - name: Build selected revision
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          if [ "$REVISION" = base ]; then (cd .perf-base && npm run build); else npm run build; fi
      - name: Measure selected revision
        env:
          REVISION: ${{ matrix.revision }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$REVISION" = base ]; then target=.perf-base; else target=.; fi
          if [ "$EVENT" = workflow_dispatch ]; then
            node scripts/performance-loads.mjs "$target" "page-speed/$REVISION.json"
          else
            node scripts/performance-loads.mjs "$target" "page-speed/$REVISION.json" --size-only
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: page-speed-${{ matrix.revision }}
          path: page-speed/${{ matrix.revision }}.json
          retention-days: 30
          if-no-files-found: warn

  report:
    name: page speed report
    runs-on: ubuntu-latest
    needs: [measure]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: page-speed-*
          path: page-speed
          merge-multiple: true
      - name: Report
        run: node scripts/performance-report.mjs page-speed/base.json page-speed/head.json page-speed/combined.json >> "$GITHUB_STEP_SUMMARY"
      - name: Size targets
        run: node scripts/size-targets.mjs page-speed/head.json --markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: page-speed
          path: page-speed
          retention-days: 30
