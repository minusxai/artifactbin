name: page speed

# Informational lab: PRs measure deterministic bytes; manual runs retain the
# throttled timing comparison. Neither mode gates ci.yml or comments on PRs.
on:
  pull_request:
    paths:
      - 'services/app/**'
      - 'services/utils/**'
      - 'services/contracts/**'
      - 'package-lock.json'
      - 'vite.config.mts'
      - 'server.ts'
      - 'scripts/ci/performance-loads.mjs'
      - 'scripts/ci/performance-report.mjs'
      - 'scripts/build/size-targets.mjs'
      - 'scripts/lib/document-views.mjs'
      - 'scripts/fixtures/page-speed/**'
      - '.github/workflows/page-speed.yml'
  push:
    branches: [ main ]
    paths:
      - 'services/app/**'
      - 'services/utils/**'
      - 'services/contracts/**'
      - 'package-lock.json'
      - 'vite.config.mts'
      - 'server.ts'
      - 'scripts/ci/performance-loads.mjs'
      - 'scripts/ci/performance-report.mjs'
      - 'scripts/build/size-targets.mjs'
      - 'scripts/lib/document-views.mjs'
      - 'scripts/fixtures/page-speed/**'
      - '.github/workflows/page-speed.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # HEAD ONLY. The base is main's own measurement of the same bytes (scripts/ci/page-speed-base.mjs):
  # every push to main that touches these paths runs this job and uploads `page-speed-head`, which is
  # exactly what a pull request's base would measure. The report job measures the base itself only
  # when no main run measured those bytes.
  measure:
    name: measure head
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: node scripts/ci/ci.mjs lock-fingerprint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'services/cli/scripts/prepare-pty.mjs') }}
      - if: steps.install.outputs.cache-hit != 'true'
        run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install chromium
      - name: Build head
        run: npm run build
      - name: Measure head
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            node scripts/ci/performance-loads.mjs . page-speed/head.json
          else
            node scripts/ci/performance-loads.mjs . page-speed/head.json --size-only
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: page-speed-head
          path: page-speed/head.json
          retention-days: 30
          if-no-files-found: warn

  report:
    name: page speed report
    runs-on: ubuntu-latest
    needs: [measure]
    timeout-minutes: 30
    # Finding main's run and downloading its artifact reads the Actions API. A job-level block REPLACES
    # the workflow's, so `contents: read` is restated rather than inherited.
    permissions:
      contents: read
      actions: read
    steps:
      # Full history: the base lookup asks git whether main's measured commit is an ancestor of the
      # base with no change under this workflow's paths.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: page-speed-head
          path: page-speed
      - name: Find main's measurement of the base
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/page-speed-base.mjs
      - if: steps.base.outputs.found == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: page-speed-head
          path: page-speed/main
          run-id: ${{ steps.base.outputs.run-id }}
          github-token: ${{ github.token }}
      - if: steps.base.outputs.found == 'true'
        run: mv page-speed/main/head.json page-speed/base.json && rmdir page-speed/main
      # THE FALLBACK: no main run measured the base's bytes (main skipped the path, its run is still in
      # flight or expired, or this is a dispatched timing run). Measure the base here, as the retired
      # `measure base` job did. Only this rare case runs after the head measurement instead of beside it.
      - if: steps.base.outputs.found != 'true'
        run: node scripts/ci/ci.mjs lock-fingerprint
      - if: steps.base.outputs.found != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/data/story/story-font-manifest.json
          key: install-v4-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json', 'services/app/scripts/copy-assets.mjs', 'services/cli/scripts/prepare-pty.mjs') }}
      - if: steps.base.outputs.found != 'true' && steps.install.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.base.outputs.found != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - if: steps.base.outputs.found != 'true' && steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.base.outputs.found != 'true' && steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install chromium
      - name: Check out base build
        if: steps.base.outputs.found != 'true'
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          git worktree add --detach .perf-base "$BASE"
          (cd .perf-base && node ../scripts/ci/ci.mjs lock-fingerprint)
          same=true
          for f in .ci-cache-key/install.json services/app/scripts/copy-assets.mjs services/cli/scripts/prepare-pty.mjs; do
            cmp -s "$f" ".perf-base/$f" || same=false
          done
          if [ "$same" = true ]; then
            cp -al node_modules .perf-base/node_modules
            for dir in services/*/node_modules; do cp -al "$dir" ".perf-base/$dir"; done
            cp -al services/app/public/fonts .perf-base/services/app/public/fonts
            cp services/app/lib/data/story/story-font-manifest.json .perf-base/services/app/lib/data/story/story-font-manifest.json
          else
            (cd .perf-base && npm ci)
          fi
      - name: Build base
        if: steps.base.outputs.found != 'true'
        run: (cd .perf-base && npm run build)
      - name: Measure base
        if: steps.base.outputs.found != 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            node scripts/ci/performance-loads.mjs .perf-base page-speed/base.json
          else
            node scripts/ci/performance-loads.mjs .perf-base page-speed/base.json --size-only
          fi
      - name: Report
        run: node scripts/ci/performance-report.mjs page-speed/base.json page-speed/head.json page-speed/combined.json >> "$GITHUB_STEP_SUMMARY"
      - name: Size targets
        run: node scripts/build/size-targets.mjs page-speed/head.json --markdown --strict >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: page-speed
          path: page-speed
          retention-days: 30
