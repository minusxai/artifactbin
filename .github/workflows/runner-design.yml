name: runner design validation
on:
  pull_request:
    paths:
      - 'docs/proposals/runner-validation/**'
      - 'services/runner/**'
      - 'services/app/**/runner*'
      - 'services/app/lib/runner/**'
      - 'services/app/**/lambda*'
      - 'services/app/**/hosted*'
      - 'services/utils/src/runner-client.ts'
      - 'services/app/__tests__/runner-design.test.ts'
      - 'services/app/__tests__/runner-page-boundary.test.ts'
      - '.github/workflows/runner-design.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runner-design-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  linux-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: validation
          POSTGRES_DB: runner_validation
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npm ci --prefix docs/proposals/runner-validation --no-audit --no-fund
      - run: docker build -t runner-design-worker docs/proposals/runner-validation
      - name: Prove the path with restricted Linux workers
        env:
          RUNNER_VALIDATION_DOCKER: runner-design-worker
        run: npm test -- --files services/app/__tests__/runner-design.test.ts services/app/__tests__/runner-page-boundary.test.ts
      - run: docker build -f services/runner/Dockerfile -t artifactbin-worker .
      - name: Product runner and APIs in restricted workers
        env:
          RUNNER_TEST_IMAGE: artifactbin-worker
        run: npm test -- --files services/runner/__tests__/runner-service.test.ts services/runner/__tests__/runner-container-lifecycle.test.ts services/runner/__tests__/runner-orchestration.test.ts services/app/__tests__/runner-api.test.ts services/app/__tests__/lambda-artifact.test.ts services/app/__tests__/lambda-operations.test.ts
      - name: Prove OS restrictions independently of V8
        run: node docs/proposals/runner-validation/os-boundary.mjs runner-design-worker
      - name: Prove real PostgreSQL concurrency
        env:
          RUNNER_VALIDATION_DATABASE: postgres://postgres:validation@127.0.0.1:5432/runner_validation
          RUNNER_VALIDATION_DOCKER: runner-design-worker
        run: node docs/proposals/runner-validation/postgres-proof.mjs
      - name: Product transactions on PostgreSQL
        env:
          RUNNER_TEST_DATABASE: postgres://postgres:validation@127.0.0.1:5432/runner_validation
          RUNNER_TEST_IMAGE: artifactbin-worker
        run: |
          node scripts/build/build-server.mjs dist/runner-proof.mjs services/runner/prove-postgres.ts
          node dist/runner-proof.mjs
      - run: node docs/proposals/runner-validation/os-boundary.mjs artifactbin-worker
      - name: Verify product worker cleanup
        run: test -z "$(docker ps -aq --filter label=artifactbin.runner=true)"
      - name: Verify worker cleanup
        run: test -z "$(docker ps -aq --filter label=artifactbin.runner-validation=true)"
