name: runner design validation
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runner-design-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  linux-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: validation
          POSTGRES_DB: runner_validation
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: docker build -f services/runner/Dockerfile -t artifactbin-worker .
      - name: Retained page boundary and retired public execution doors
        env:
          RUNNER_TEST_IMAGE: artifactbin-worker
        run: npm test -- --files services/app/__tests__/runner-page-boundary.test.ts services/app/server/__tests__/retired-execution.test.ts
      - name: Retained product worker isolation and operation authority
        env:
          RUNNER_TEST_IMAGE: artifactbin-worker
        run: npm test -- --files services/runner/__tests__/runner-service.test.ts services/runner/__tests__/runner-container-lifecycle.test.ts services/app/__tests__/page-graphql.test.ts services/app/lib/page-operations/__tests__/backend.test.ts services/app/lib/page-operations/__tests__/runtime.test.ts
      - name: Product transactions on PostgreSQL
        env:
          RUNNER_TEST_DATABASE: postgres://postgres:validation@127.0.0.1:5432/runner_validation
          RUNNER_TEST_IMAGE: artifactbin-worker
        run: |
          node scripts/build/build-server.mjs dist/runner-proof.mjs services/runner/prove-postgres.ts
          node dist/runner-proof.mjs
      - run: node scripts/runner-os-boundary.mjs artifactbin-worker
      - name: Verify product worker cleanup
        run: test -z "$(docker ps -aq --filter label=artifactbin.runner=true)"
