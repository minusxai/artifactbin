name: Migration batch host
on:
  pull_request:
    paths: ['scripts/migration_batch/**', 'tests/migration_batch/**', '.github/workflows/migration-batch.yml']
  push:
    paths: ['scripts/migration_batch/**', 'tests/migration_batch/**', '.github/workflows/migration-batch.yml']
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - run: node --test tests/migration_batch/test_*.mjs
      - run: python3 -m unittest discover -s tests/migration_batch -v
