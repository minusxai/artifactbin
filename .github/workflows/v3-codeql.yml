name: v3 CodeQL

# Every merged v3 SHA receives both security scans before deployment admission. The weekly run
# rescans an unchanged main against new query packs.
# Both languages retain the default security query suite and complete source coverage.
# Advanced setup requires GitHub default setup to remain off (not-configured).
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Each merged revision is a deployment candidate and needs its own scan. A shared push group cancelled the scan of a
# green revision whenever the next merge landed (so production waited for the newest merge's whole chain, or for a fix
# when that merge was red), and held the new scan pending 30-40 s until the old one stopped. A push scan shares a group
# only with its own revision; scheduled and manual scans keep queueing per ref.
concurrency:
  group: ${{ github.event_name == 'push' && format('{0}-push-{1}', github.workflow, github.sha) || format('{0}-{1}-{2}', github.workflow, github.ref, github.event_name) }}
  cancel-in-progress: false

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ actions, javascript-typescript ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: /language:${{ matrix.language }}
          # SARIF findings still upload on every scan. Database archives are optional,
          # expensive to bundle, and retained for weekly/manual investigations only.
          upload-database: ${{ github.event_name != 'push' }}
