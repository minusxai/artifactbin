name: v3 CodeQL

# Every merged v3 SHA receives both security scans before deployment admission. The weekly run
# rescans an unchanged main against new query packs.
# Both languages retain the default security query suite and complete source coverage.
# Advanced setup requires GitHub default setup to remain off (not-configured).
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Each merged revision is a deployment candidate and needs its own scan. A shared push group cancelled the scan of a
# green revision whenever the next merge landed (so production waited for the newest merge's whole chain, or for a fix
# when that merge was red), and held the new scan pending 30-40 s until the old one stopped. A push scan shares a group
# only with its own revision; scheduled and manual scans keep queueing per ref.
concurrency:
  group: ${{ github.event_name == 'push' && format('{0}-push-{1}', github.workflow, github.sha) || format('{0}-{1}-{2}', github.workflow, github.ref, github.event_name) }}
  cancel-in-progress: false

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ actions, javascript-typescript ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: /language:${{ matrix.language }}
          # SARIF findings still upload on every scan. Database archives are optional,
          # expensive to bundle, and retained for weekly/manual investigations only.
          upload-database: ${{ github.event_name != 'push' }}

  # Each push scan saves an overlay base database of about 405 MB under a key that names its revision, and only the
  # newest is ever restored. Left alone they fill the repository's cache (7.5 GB of 10 GB in ten hours on 2026-11-10),
  # and GitHub then evicts the least recently used entries, the install cache among them. Keep the newest per language.
  prune-caches:
    name: keep one overlay database
    needs: [analyze]
    if: always()
    # Housekeeping only: a failed prune must never fail the scan's run, which deployment admission reads.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh cache list --repo "$GITHUB_REPOSITORY" --key codeql-overlay-base-database- --ref refs/heads/main \
            --sort created_at --order desc --limit 100 --json id,key \
            --jq 'group_by(.key | capture("^codeql-overlay-base-database-[0-9]+-[0-9a-f]+-(?<lang>[a-z-]+)-").lang) | map(.[1:][]) | .[].id' \
            | xargs -r -n 1 gh cache delete --repo "$GITHUB_REPOSITORY"
