name: exp overhead
# Experiment only (branch exp/ci-overhead, never merged): measures pr fast's per-job overhead variants.
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
  actions: read
env:
  INSTALL_PATHS: unused
jobs:
  paired-api:
    name: paired-api (${{ matrix.i }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy: { fail-fast: false, matrix: { i: [ 1, 2, 3, 4, 5, 6 ] } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: node scripts/ci/ci.mjs lock-fingerprint
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/html-systems/font-manifest.json
          key: install-v5-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json') }}
      - id: test-builds-key
        run: node scripts/ci/ci.mjs test-builds-key
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            services/app/lib/build-assets
            services/app/public/libraries
          key: test-builds-v2-${{ runner.os }}-${{ steps.test-builds-key.outputs.key }}
          restore-keys: test-builds-v2-${{ runner.os }}-
      - run: grep -m1 'model name' /proc/cpuinfo
      - name: paired api runs (same runner, same shard)
        run: |
          A="--project=api --project=api-isolated --shard=3/22"
          P=scripts/exp/paired.sh
          $P cold-base $A; $P base $A; $P w4 $A --maxWorkers=4; $P fsmc-fill $A --experimental.fsModuleCache; du -sh node_modules/.experimental-vitest-cache node_modules/.vite* 2>/dev/null | sed "s/^/CACHESIZE /"; (cd node_modules/.experimental-vitest-cache 2>/dev/null && tar -cf - . | zstd -3 -T0 | wc -c | sed "s/^/CACHEZST /"); $P fsmc $A --experimental.fsModuleCache; $P w4 $A --maxWorkers=4; $P base $A; $P fsmc-w4 $A --experimental.fsModuleCache --maxWorkers=4
  paired-guards:
    name: paired-guards (${{ matrix.i }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy: { fail-fast: false, matrix: { i: [ 1, 2, 3, 4 ] } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: node scripts/ci/ci.mjs lock-fingerprint
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/html-systems/font-manifest.json
          key: install-v5-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json') }}
      - id: test-builds-key
        run: node scripts/ci/ci.mjs test-builds-key
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            services/app/lib/build-assets
            services/app/public/libraries
          key: test-builds-v2-${{ runner.os }}-${{ steps.test-builds-key.outputs.key }}
          restore-keys: test-builds-v2-${{ runner.os }}-
      - run: grep -m1 'model name' /proc/cpuinfo
      - name: paired guard runs (whole guard list, isolated vs shared graph)
        run: |
          P=scripts/exp/paired.sh
          $P cold-g-base --config vitest.guard.config.ts --shard=1/2; $P g-base --config vitest.guard.config.ts; $P g-shared --config vitest.exp-guard-shared.config.ts; $P g-base --config vitest.guard.config.ts; $P g-shared --config vitest.exp-guard-shared.config.ts
