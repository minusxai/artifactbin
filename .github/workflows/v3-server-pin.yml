name: v3 server pin

# Asks the private server's pins action to move its toolkit pin to each merged main revision, while ci, v3 CodeQL,
# runner design validation and page speed run, instead of after all four. The server lands the pin as a pull request
# once its pr fast is green, so nothing here writes the server's main. Pinning admits nothing: the isolated deployment
# still requires all four on this exact revision plus the composition.
on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: v3-server-pin
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the server to pin this exact revision when it advances the current pin
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          server=minusxai/artifactbin-server
          # A newer merge's own run asks for that revision; never ask for one it supersedes.
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$head" != "$SHA" ]; then echo "main moved to ${head:0:12}; its run asks for it"; exit 0; fi
          # The server's current pin: its toolkit gitlink on main (the token is gh's environment, never a URL or an argument).
          pinned=$(GH_TOKEN="$SERVER_TOKEN" gh api "repos/$server/contents/toolkit?ref=main" --jq 'select(.type == "submodule") | .sha')
          [[ "$pinned" =~ ^[a-f0-9]{40}$ ]]
          if [ "$pinned" = "$SHA" ]; then echo "Server already pins ${SHA:0:12}"; exit 0; fi
          # A manually prepared newer composition must never be repinned backward.
          direction=$(gh api "repos/$GITHUB_REPOSITORY/compare/$pinned...$SHA" --jq .status)
          if [ "$direction" != ahead ]; then echo "${SHA:0:12} does not advance pin ${pinned:0:12}"; exit 0; fi
          GH_TOKEN="$SERVER_TOKEN" gh workflow run pins.yml -R "$server" -f toolkit="$SHA"
          echo "Asked $server to pin ${SHA:0:12}"
