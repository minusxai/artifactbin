name: credential platforms
on:
  pull_request:
    paths:
      - 'services/utils/**'
      - 'services/contracts/**'
      - 'services/app/skills/artifactbin/scripts/**'
      - 'services/app/test/setup/**'
      - 'scripts/ci/**'
      - 'scripts/lib/**'
      - 'scripts/__tests__/workflows.test.mjs'
      - 'vitest.config.ts'
      - '**/package.json'
      - 'package-lock.json'
      - '.github/workflows/credential-platform.yml'
  push:
    branches: [main]
    paths:
      - 'services/utils/**'
      - 'services/contracts/**'
      - 'services/app/skills/artifactbin/scripts/**'
      - 'services/app/test/setup/**'
      - 'scripts/ci/**'
      - 'scripts/lib/**'
      - 'scripts/__tests__/workflows.test.mjs'
      - 'vitest.config.ts'
      - '**/package.json'
      - 'package-lock.json'
      - '.github/workflows/credential-platform.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credentials:
    name: credentials (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Real process, permission, ACL and junction regressions
        run: npm test -- --files services/utils/__tests__/credential-storage.test.ts services/utils/__tests__/credential-process.test.ts
