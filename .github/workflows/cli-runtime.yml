name: Build CLI Node runtimes

# Maintainer operation, only when the pinned Node version or build recipe changes.
# Dispatched from the Actions tab; its output is what services/cli/runtime-lock.json pins.
# Ordinary CLI CI downloads a checksum-pinned release and never invokes this build.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Unique runtime release tag (for example cli-node-v22.22.3-r1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cli-runtime-${{ inputs.release }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      RUNTIME_TAG: ${{ inputs.release }}
    steps:
      - name: Validate the new runtime revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNTIME_TAG" =~ ^cli-node-v[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$ ]]
          if gh release view "$RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2> release-error.txt; then
            echo 'This runtime revision already exists; choose a new revision.' >&2
            exit 1
          fi
          if ! grep -qi 'not found\|HTTP 404' release-error.txt; then
            cat release-error.txt >&2
            exit 1
          fi
  build:
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - name: Build the runtime recipe candidate
        run: node services/cli/scripts/small-node.mjs --build-only
      - name: Preserve compiled runtime candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-node-candidate-${{ matrix.os }}
          path: |
            node_modules/.cache/cli-node/node
            node_modules/.cache/cli-node/recipe.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Prepare distributable runtime
        run: node services/cli/scripts/prepare-runtime.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-node-${{ matrix.os }}
          path: runtime-assets/*
          if-no-files-found: error
          retention-days: 90
      - name: Verify runtime compatibility
        run: node services/cli/scripts/small-node.mjs --verify-only

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUNTIME_TAG: ${{ inputs.release }}
    steps:
      # No checkout and no execution of downloaded runtime code in this write-capable job.
      - name: Publish versioned runtime assets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNTIME_TAG" =~ ^cli-node-v[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          mkdir bundle
          for mapping in macos-14:darwin-arm64 macos-15-intel:darwin-x64 ubuntu-24.04:linux-x64 ubuntu-24.04-arm:linux-arm64; do
            runner=${mapping%%:*}
            asset=afbin-node-${mapping#*:}
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cli-node-$runner" --dir "downloads/$runner"
            for suffix in gz pin.json; do
              test -f "downloads/$runner/$asset.$suffix"
              test ! -L "downloads/$runner/$asset.$suffix"
              cp "downloads/$runner/$asset.$suffix" bundle/
            done
            test -f "downloads/$runner/NODE-LICENSE"
            test ! -L "downloads/$runner/NODE-LICENSE"
            if [ -f bundle/NODE-LICENSE ]; then cmp bundle/NODE-LICENSE "downloads/$runner/NODE-LICENSE"; else cp "downloads/$runner/NODE-LICENSE" bundle/NODE-LICENSE; fi
            pin="bundle/$asset.pin.json"
            compressed=$(jq -r .gzipSha256 "$pin")
            decoded=$(jq -r .sha256 "$pin")
            license=$(jq -r .licenseSha256 "$pin")
            [[ "$license" =~ ^[a-f0-9]{64}$ ]]
            test "$(sha256sum bundle/NODE-LICENSE | cut -d ' ' -f1)" = "$license"
            [[ "$compressed" =~ ^[a-f0-9]{64}$ && "$decoded" =~ ^[a-f0-9]{64}$ ]]
            test "$(sha256sum "bundle/$asset.gz" | cut -d ' ' -f1)" = "$compressed"
            gzip -dc "bundle/$asset.gz" > "bundle/$asset"
            test "$(sha256sum "bundle/$asset" | cut -d ' ' -f1)" = "$decoded"
            test "$(wc -c < "bundle/$asset" | tr -d ' ')" = "$(jq -r .size "$pin")"
            rm "bundle/$asset"
          done
          # Each revision is immutable. A new recipe gets a new release tag.
          gh release create "$RUNTIME_TAG" bundle/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "$RUNTIME_TAG" --notes ''
