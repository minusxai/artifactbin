name: Release tested afbin CLI

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-tested-afbin
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # The bundle is ~1 GB (four Chromium archives of ~170 MB each), uploaded one asset at a time. Ten
    # minutes cut afbin-v0.1.37 off mid-upload four times running, leaving a draft that blocked every
    # production deploy behind it (run 35247592662); a slow upload is not a hung job.
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # No checkout or execution of downloaded code in this privileged workflow.
      - name: Identify the tested release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          version_at() { gh api "repos/$GITHUB_REPOSITORY/contents/services/cli/package.json?ref=$1" --jq .content | base64 --decode | jq -r .version; }
          version=$(version_at "$SOURCE_SHA")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # Only the commit that bumped the version built its binaries: later merges that carry the same
          # version have none, and leave publishing to the bump's own run.
          parent=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA" --jq '.parents[0].sha')
          if [ "$(version_at "$parent")" = "$version" ]; then exit 0; fi
          # A newer version on main supersedes this one. Merges that landed on top WITHOUT a bump do not:
          # requiring the bump to still be main's head stranded afbin 0.1.48 and 0.1.49, whose builds
          # finished after other work merged, and no later build could publish them.
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$(version_at "$head")" != "$version" ]; then exit 0; fi
          tag="afbin-v$version"
          installer=$(gh api "repos/$GITHUB_REPOSITORY/contents/services/app/public/chat/install.sh?ref=$SOURCE_SHA" --jq .content | base64 --decode)
          grep -Fxq "  version=$version" <<< "$installer"
          # The pointer the CLI resolves its release from ships with the same commit.
          pointer=$(gh api "repos/$GITHUB_REPOSITORY/contents/services/app/public/chat/release.json?ref=$SOURCE_SHA" --jq .content | base64 --decode)
          test "$(jq -r .version <<< "$pointer")" = "$version"
          # Existing published versions are immutable; unrelated merges are no-ops.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > draft.txt 2> release-error.txt; then
            if [ "$(cat draft.txt)" = false ]; then exit 0; fi
          elif ! grep -qi 'not found\|HTTP 404' release-error.txt; then
            cat release-error.txt >&2; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      # WHICH RUN HOLDS THE TESTED BYTES. Main's CI no longer always builds them itself: when the
      # merged tree was already tested on its pull request it selects no job at all and records, in a
      # `tested-run` artifact, the id of the run that did the work (scripts/ci.mjs `record-tree`).
      # Reading it keeps this workflow publishing exactly what CI built and proved. Absent — an older
      # run, or a main build that did everything itself — the workflow_run's own id is still right.
      - name: The run whose binaries this publishes
        if: steps.release.outputs.tag != ''
        shell: bash
        run: |
          set -euo pipefail
          if gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name tested-run --dir tested-run 2> tested-run-error.txt; then
            tested=$(jq -r '.run_id' tested-run/tested-run.json)
            # Artifact content is data, never a command: it is one integer or this stops.
            [[ "$tested" =~ ^[0-9]+$ ]]
            echo "SOURCE_RUN=$tested" >> "$GITHUB_ENV"
            echo "Publishing the binaries built by run $tested."
          else
            cat tested-run-error.txt >&2
            echo "No tested-run artifact; publishing from run $SOURCE_RUN itself."
          fi

      - name: Download the binaries tested by this CI run
        if: steps.release.outputs.tag != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir bundle
          for mapping in macos-14:darwin-arm64 macos-15-intel:darwin-x64 ubuntu-24.04:linux-x64 ubuntu-24.04-arm:linux-arm64 windows-2022:win32-x64; do
            runner=${mapping%%:*}
            binary=afbin-${mapping#*:}
            if [ "$runner" = windows-2022 ]; then binary="$binary.exe"; fi
            gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "afbin-$runner" --dir "downloads/$runner"
            test -f "downloads/$runner/$binary"
            test ! -L "downloads/$runner/$binary"
            test -s "downloads/$runner/$binary"
            cp "downloads/$runner/$binary" "bundle/$binary"
            cp "downloads/$runner/$binary.manifest.json" "bundle/$binary.manifest.json"
            for asset in "$binary.gz" "$binary.sizes.json" "afbin-runtime-${mapping#*:}.gz" "afbin-chromium-${mapping#*:}.gz"; do
              test -f "downloads/$runner/$asset"
              test ! -L "downloads/$runner/$asset"
              test -s "downloads/$runner/$asset"
              cp "downloads/$runner/$asset" "bundle/$asset"
            done
            for common in afbin-skills.json afbin.1; do
              if [ -f "bundle/$common" ]; then cmp "bundle/$common" "downloads/$runner/$common"; else cp "downloads/$runner/$common" "bundle/$common"; fi
            done
          done
          (cd bundle && sha256sum afbin-* afbin.1 > SHA256SUMS)

      - name: Tag and publish together
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > tag.json 2> tag-error.txt; then
            test "$(jq -r .object.type tag.json)" = commit
            test "$(jq -r .object.sha tag.json)" = "$SOURCE_SHA"
          else
            grep -q 'HTTP 404' tag-error.txt || { cat tag-error.txt >&2; exit 1; }
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_SHA"
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > draft.txt 2> release-error.txt; then
            # A partial draft from an earlier attempt is recovered below, never a published release.
            test "$(cat draft.txt)" = true
          else
            grep -qi 'not found\|HTTP 404' release-error.txt || { cat release-error.txt >&2; exit 1; }
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --latest=false --title "$RELEASE_TAG" --notes ''
          fi
          # ONE ASSET AT A TIME, each retried. Handing gh the whole bundle uploads several ~180 MB Chromium
          # archives at once, and GitHub answered `HTTP 500: Error saving asset` on one of them for
          # afbin-v0.1.37 and again for v0.1.38 (runs 35247592662, 35254779106) — each time leaving a draft
          # that blocked every production deploy behind it. A single 200 MB upload is accepted every time.
          for asset in bundle/*; do
            for attempt in 1 2 3 4; do
              if gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "$asset"; then continue 2; fi
              echo "upload of $asset failed (attempt $attempt)" >&2
              sleep $((attempt * 15))
            done
            echo "::error::$asset could not be uploaded"
            exit 1
          done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
