name: Release tested afbin npm package
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: write
  id-token: write
concurrency:
  group: release-tested-afbin
  cancel-in-progress: false
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
      - name: Select the exact tested immutable npm artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          version_at() { gh api "repos/$GITHUB_REPOSITORY/contents/services/cli/package.json?ref=$1" --jq .content | base64 --decode | jq -r .version; }
          version=$(version_at "$SOURCE_SHA")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          pointer=$(gh api "repos/$GITHUB_REPOSITORY/contents/services/app/public/chat/release.json?ref=$SOURCE_SHA" --jq .content | base64 --decode)
          test "$(jq -r .version <<< "$pointer")" = "$version"
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$(version_at "$head")" != "$version" ]; then exit 0; fi
          if gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name tested-run --dir tested-run 2> receipt-error.txt; then
            SOURCE_RUN=$(jq -r .run_id tested-run/tested-run.json)
            [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts" --paginate --jq '.artifacts[] | select(.expired | not) | .name' > artifacts.txt
          if ! grep -Fxq afbin-npm-release artifacts.txt; then echo 'No new npm artifact; nothing to publish.'; exit 0; fi
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name afbin-npm-release --dir package
          file="package/afbin-cli-$version.tgz"
          test -f "$file" && test ! -L "$file"
          tar -xOf "$file" package/package.json > manifest.json
          test "$(jq -r .name manifest.json)" = '@afbin/cli'
          test "$(jq -r .version manifest.json)" = "$version"
          tar -tzf "$file" > package-files.txt
          grep -Fxq package/npm-shrinkwrap.json package-files.txt
          if grep -q '^package/dist/runtime/node_modules/' package-files.txt; then echo 'Build-machine dependencies in universal package' >&2; exit 1; fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish tested tarball through npm trusted publishing
        if: steps.package.outputs.file != ''
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@afbin/cli@$PACKAGE_VERSION" version > npm-existing.txt 2> npm-error.txt; then
            test "$(cat npm-existing.txt)" = "$PACKAGE_VERSION"
            published=$(npm view "@afbin/cli@$PACKAGE_VERSION" dist.integrity)
            candidate=$(node -e 'const fs=require("node:fs"),crypto=require("node:crypto");console.log("sha512-"+crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$PACKAGE_FILE")
            test "$published" = "$candidate" || { echo 'Published version has different bytes; refuse to mislabel the tested tarball.' >&2; exit 1; }
          else
            grep -q E404 npm-error.txt || { cat npm-error.txt >&2; exit 1; }
            npm publish "$PACKAGE_FILE" --access public --provenance --ignore-scripts
          fi
      - name: Record tested package in GitHub release
        if: steps.package.outputs.file != ''
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          tag="afbin-v$PACKAGE_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > draft.txt 2> release-error.txt; then
            if [ "$(cat draft.txt)" = true ]; then
              gh release upload "$tag" "$PACKAGE_FILE" --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
            fi
            exit 0
          fi
          grep -qi 'not found\|HTTP 404' release-error.txt || { cat release-error.txt >&2; exit 1; }
          gh release create "$tag" "$PACKAGE_FILE" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "$tag" --notes '' --latest=false
