name: pr fast timing observer
on:
  workflow_run:
    workflows: [pr fast]
    types: [completed]
permissions:
  contents: read
  actions: read
  statuses: write
jobs:
  timing:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # workflow_run runs trusted default-branch code. Never checkout the PR head or consume its artifacts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node scripts/ci/observe-fast.mjs
        env:
          GH_TOKEN: ${{ github.token }}
