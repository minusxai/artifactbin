name: pr fast

# PULL REQUEST CI BUDGET, A HARD RULE: aim for 40s; the limit is 60s. Each job's last step measures
# the run from its start (queue, setup and install included) and FAILS the pull request past 60s
# (scripts/lib/ci-elapsed.mjs --pr). Do not raise the budget: fix the critical path instead.
#
# This is the required pull request check. It runs validate (type check, knip, module graph, name and
# UI-primitive guards), the workflow lint, JavaScript syntax, the fast module test list
# (scripts/ci/fast-tests.json), the guard tests (scripts/ci/guard-tests.json), the contract tests
# (scripts/ci/contract-tests.json), EVERY api, api-isolated, ui and islands test (the `api-*` and `ui-*` parts) and the
# full suite's cheap node tests (the `node-*` parts), all at once, each runner restoring main's install cache. The api and jsdom suites reached main untested once too often
# (#1138, #1141: each a red main, and production held for a whole extra merge), so every pull request runs them. The guard tests read
# the repository's own files by path (workflows, package scripts, the skill tree), so no import graph selects them and
# the fast list's capability audit refuses them; the contract tests run another repository's post-merge scenario (the
# server's native acceptance) through the real handlers, which the audit refuses too. Each guards a contract whose
# break once reached main. WHEN MAIN GOES RED, find why this lane missed it and add a
# deterministic guard here (either list, or a contract test) within the budget. The root type
# check uses TypeScript 7's native compiler (scripts/lib/type-check.mjs): about 7s cold on a runner where tsc 5
# took 30s, and longer still from stale build info, so no diff size can push it past the limit. It starts from
# the newest incremental build info any run uploaded.
# The full suite stays in ci.yml: it runs on every push to main (and on demand) and gates deploys there; it does
# not run on pull requests. page-speed.yml is informational.
#
# THE RUN TAKES AS LONG AS ITS SLOWEST JOB, so one stalled transfer on one of ~49 runners sets it (a 62.5s fetch made run
# 44148017273 93s). The transfers seen stalling are hedged or bounded, each with a fallback that may cost time but never
# changes what that runner tests: the checkout starts a second fetch of the same sha beside one that has not landed, and
# every cache download but each chain's last gives up on a stalled segment for the chain's next tier, and the last stays
# unbounded (scripts/__tests__/workflows.test.mjs, ci-budget.test.mjs). Not yet bounded: the cache lookups and saves, the
# type-info and node-timings fetches, the artifact upload and the clock's fallback `gh api`; one seen stalling joins them.
#
# No workflow-level `concurrency` group: cancel-in-progress holds a new run pending until the old one
# stops (ci.yml's header has the measurements), which alone would cost more than this lane's budget.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: fast (${{ matrix.part }})
    runs-on: ubuntu-latest
    # A job that reaches two minutes is already twice over the limit.
    timeout-minutes: 2
    # Reading this run's own attempt (the clock below) needs `actions: read`; a job-level block replaces
    # the workflow's, so `contents: read` is restated.
    permissions:
      contents: read
      actions: read
    # WHICH TEST BUILDS THIS RUNNER RESTORES: one entry per runner kind, because Vitest keys its module cache by the
    # configuration that transformed each module as well as its source. One entry warmed for the api projects alone left
    # the ui, guard and node runners to transform their whole graphs cold (9-15s summed over three workers each, against
    # ~2s on an api runner: runs 44114175470, 44133274884); one warmed for all four would make every runner download all
    # four (~22 MB compressed against api's ~6). Main's warm-caches writes each kind's entry with its configuration alone.
    env:
      TEST_BUILDS_KIND: ${{ matrix.shard && 'guards' || matrix.batch && 'node' || matrix.suite && startsWith(matrix.part, 'ui-') && 'ui' || 'api' }}
    strategy:
      fail-fast: false
      matrix:
        part: [ types, lint, tests, guards, guards-2, guards-3 ]
        # The guard and contract tests were one 35-59s Vitest step, ~100s of worker CPU on the runner's 4 vCPUs (the
        # contracts boot a database per file). Three jobs split them by measured time
        # (vitest.guard.config.ts's timed sequencer over the guard runners' own times), each file once: on two, the
        # guard jobs were the slowest of the run in half of pr fast's runs (42-57s; Vitest 19-27s around a 15s file).
        include:
          - part: guards
            shard: 1/3
          - part: guards-2
            shard: 2/3
          - part: guards-3
            shard: 3/3
          # THE API AND JSDOM SUITES, ALL OF THEM: vitest.config.ts's api and api-isolated projects on 32 runners, its ui and
          # islands projects on 7, the same files ci.yml's api and ui jobs run after the merge, each group packed
          # longest-first by measured CI time (scripts/lib/timed-sequencer.mjs over scripts/ci/test-timings.json;
          # `--sums` prints each runner's load). Apart, not mixed: every worker imports the module graph of each project it
          # runs, and a runner given both kinds paid both on all three workers. None of them launches Chromium, so no
          # runner provisions a browser. Add a runner when a group's load nears the clock; never move a file out.
          # EVERY RUNNER DOWNLOADS THE 166 MB INSTALL AT ONCE, and that is what caps the count: at 42 test runners it took
          # a median 5s (p90 6-7, max 7-11); at 52 (40 api runners, run 43042914246) a median 6s, p90 11, max 20, with 18
          # runners past 8s, and the slowest jobs were those downloads, not their tests. So 32, not 40.
          - part: api-1
            projects: --project=api --project=api-isolated
            suite: 1/32
          - part: api-2
            projects: --project=api --project=api-isolated
            suite: 2/32
          - part: api-3
            projects: --project=api --project=api-isolated
            suite: 3/32
          - part: api-4
            projects: --project=api --project=api-isolated
            suite: 4/32
          - part: api-5
            projects: --project=api --project=api-isolated
            suite: 5/32
          - part: api-6
            projects: --project=api --project=api-isolated
            suite: 6/32
          - part: api-7
            projects: --project=api --project=api-isolated
            suite: 7/32
          - part: api-8
            projects: --project=api --project=api-isolated
            suite: 8/32
          - part: api-9
            projects: --project=api --project=api-isolated
            suite: 9/32
          - part: api-10
            projects: --project=api --project=api-isolated
            suite: 10/32
          - part: api-11
            projects: --project=api --project=api-isolated
            suite: 11/32
          - part: api-12
            projects: --project=api --project=api-isolated
            suite: 12/32
          - part: api-13
            projects: --project=api --project=api-isolated
            suite: 13/32
          - part: api-14
            projects: --project=api --project=api-isolated
            suite: 14/32
          - part: api-15
            projects: --project=api --project=api-isolated
            suite: 15/32
          - part: api-16
            projects: --project=api --project=api-isolated
            suite: 16/32
          - part: api-17
            projects: --project=api --project=api-isolated
            suite: 17/32
          - part: api-18
            projects: --project=api --project=api-isolated
            suite: 18/32
          - part: api-19
            projects: --project=api --project=api-isolated
            suite: 19/32
          - part: api-20
            projects: --project=api --project=api-isolated
            suite: 20/32
          - part: api-21
            projects: --project=api --project=api-isolated
            suite: 21/32
          - part: api-22
            projects: --project=api --project=api-isolated
            suite: 22/32
          - part: api-23
            projects: --project=api --project=api-isolated
            suite: 23/32
          - part: api-24
            projects: --project=api --project=api-isolated
            suite: 24/32
          - part: api-25
            projects: --project=api --project=api-isolated
            suite: 25/32
          - part: api-26
            projects: --project=api --project=api-isolated
            suite: 26/32
          - part: api-27
            projects: --project=api --project=api-isolated
            suite: 27/32
          - part: api-28
            projects: --project=api --project=api-isolated
            suite: 28/32
          - part: api-29
            projects: --project=api --project=api-isolated
            suite: 29/32
          - part: api-30
            projects: --project=api --project=api-isolated
            suite: 30/32
          - part: api-31
            projects: --project=api --project=api-isolated
            suite: 31/32
          - part: api-32
            projects: --project=api --project=api-isolated
            suite: 32/32
          - part: ui-1
            projects: --project=ui --project=islands
            suite: 1/7
          - part: ui-2
            projects: --project=ui --project=islands
            suite: 2/7
          - part: ui-3
            projects: --project=ui --project=islands
            suite: 3/7
          - part: ui-4
            projects: --project=ui --project=islands
            suite: 4/7
          - part: ui-5
            projects: --project=ui --project=islands
            suite: 5/7
          - part: ui-6
            projects: --project=ui --project=islands
            suite: 6/7
          - part: ui-7
            projects: --project=ui --project=islands
            suite: 7/7
          # THE NODE BATCH (vitest.node-batch.config.ts, scripts/lib/node-batch.mjs): the full suite's `node` files
          # recorded under 200ms that no other list here runs, plus the post-merge failures it guards, one shared module
          # graph per worker; ci.yml's node job still runs every one of them. 236 files: ~4.3s per runner locally on two
          # runners (3 workers each), so three runners, predicted ~10s each on CI (an estimate: none has run there yet).
          # Their table is the committed one with main's measured node times laid over it (the steps after checkout).
          # THE PULL REQUEST'S OWN INSTALL: a lock this branch changed misses main's install on every push, and every runner
          # reconciles main's tree to it (~2.7s: the miss probe and `npm install`, run 43039126177). This runner, only on
          # that miss, runs a clean `npm ci` (never a reconciled tree: nothing stale is saved) and saves it under this
          # lock's key, in this pull request's cache scope; from the next push every runner restores an exact hit.
          # A clean install is ~14-24s; it runs beside the test runners, on the first push of each new lock only.
          - part: install
            install: true
          - part: node-1
            batch: 1/3
          - part: node-2
            batch: 2/3
          - part: node-3
            batch: 3/3
    steps:
      # Node 22, the install cache's (its key says node22; its native modules are compiled for that major's ABI): the hosted
      # tool cache's newest 22 goes on PATH (ubuntu-latest's own Node is a 24). setup-node found that same cached 22, then
      # spent 0.6s median, 2.9s p90 and 6.3s at worst printing npm's and yarn's versions from a cold disk (runs
      # 44027030734-44133274884), plus a post step; it now runs only when neither the cache nor the runner has a 22.
      # Without it, that Node's first start from the cold disk moved into the next step instead (lock-fingerprint, up to 4s,
      # run 44139796324): so this step runs FIRST, needing no checkout, and reads the binary into the page cache in the
      # background while checkout runs. It starts no Node when the cache has a 22; otherwise the runner's own is probed with
      # --version, which exits before JavaScript initialization (evaluating process.versions took 14.7s on the slowest
      # runner of run 43196988989, making its complete attempt 61s).
      # THE CLOCK'S ATTEMPT, FETCHED HERE IN THE BACKGROUND: the clock (the last step) reads only its run_started_at, and its
      # own `gh api` took 0.6s median, 2.0s p90 and 4.1s at worst after every job's tests. Every stream of each background
      # process is redirected, or the runner holds this step open until it ends; the attempt is written whole, then renamed,
      # so the clock reads it complete or fetches it itself.
      - id: runner-node
        name: Node 22 on PATH, and this attempt fetched for the clock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          attempt="$RUNNER_TEMP/pr-attempt.json"
          { gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" > "$attempt.part" && mv "$attempt.part" "$attempt"; } < /dev/null > /dev/null 2>&1 &
          cached=$(printf '%s\n' "$RUNNER_TOOL_CACHE"/node/22.*/x64/bin | sort -V | tail -n 1)
          if [ -x "$cached/node" ]; then
            printf '%s\n' "$cached" >> "$GITHUB_PATH"
            cat "$cached/node" < /dev/null > /dev/null 2>&1 &
            printf 'major=22\n' >> "$GITHUB_OUTPUT"
            printf 'Node 22 from the tool cache: %s\n' "$cached"
          else
            runner_version=$(node --version)
            runner_major=${runner_version#v}
            runner_major=${runner_major%%.*}
            printf 'major=%s\n' "$runner_major" >> "$GITHUB_OUTPUT"
            printf 'Runner Node: %s\n' "$runner_version"
          fi
      # THE CHECKOUT, HEDGED. actions/checkout's one `git fetch --depth=1` took 0.9s median and 1.8s p99 over 587 jobs (runs
      # 44138698759-44150141230), and 15-63s three times (44148017273's node-3 62.5s and api-30 15.3s, 44141023943's api-20
      # 18.8s): one connection stalled while bytes still trickled, so the low-speed abort below never fired, and the whole
      # run waited on that one runner (93s). This step fetches the same revision the same way (this run's exact
      # $GITHUB_SHA, depth 1, into the ref actions/checkout used) and, when an attempt has neither landed nor failed after
      # CHECKOUT_HEDGE_TICKS tenths of a second, or fails, starts another beside it, up to CHECKOUT_ATTEMPTS; the first to
      # land is checked out and the rest are stopped. Each attempt fetches into its own git directory under RUNNER_TEMP
      # with every stream redirected to its own log, since a stalled one left holding the step's output would hold the
      # step open; so which attempt won never changes what is checked out. The token reaches git only through its
      # environment (GIT_CONFIG_*), never argv or .git/config: nothing after this fetches or pushes, no test can read a
      # credential through git, and no post step has to remove one. Behaviour: scripts/__tests__/workflows.test.mjs.
      - id: checkout
        name: Check out this revision, hedging a stalled fetch
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_HTTP_LOW_SPEED_LIMIT: '1024'
          GIT_HTTP_LOW_SPEED_TIME: '10'
          CHECKOUT_HEDGE_TICKS: '30'
          CHECKOUT_ATTEMPTS: '4'
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          case "$GITHUB_REF" in
            refs/pull/*) ref="refs/remotes/pull/${GITHUB_REF#refs/pull/}" ;;
            refs/heads/*) ref="refs/remotes/origin/${GITHUB_REF#refs/heads/}" ;;
            *) ref=refs/remotes/origin/checkout ;;
          esac
          if [ -n "$GH_TOKEN" ]; then
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" GIT_CONFIG_VALUE_0
          fi
          attempts=0
          pids=()
          launch() {
            attempts=$((attempts + 1))
            dir="$RUNNER_TEMP/checkout-$attempts"
            rm -rf "$dir"
            git init -q "$dir"
            git -C "$dir" -c protocol.version=2 fetch --no-tags --no-recurse-submodules --depth=1 "$url" "+$GITHUB_SHA:$ref" < /dev/null > "$dir.log" 2>&1 &
            pids[attempts]=$!
            ticks=0
          }
          launch
          winner=
          while [ -z "$winner" ]; do
            sleep 0.1
            ticks=$((ticks + 1))
            live=0
            i=1
            while [ "$i" -le "$attempts" ]; do
              pid=${pids[i]}
              if [ -z "$pid" ]; then
                :
              elif kill -0 "$pid" 2> /dev/null; then
                live=$((live + 1))
              elif wait "$pid"; then
                winner=$i
                break
              else
                pids[i]=
                echo "::warning::Checkout attempt $i of $attempts failed:"
                cat "$RUNNER_TEMP/checkout-$i.log"
              fi
              i=$((i + 1))
            done
            if [ -n "$winner" ]; then
              break
            elif [ "$attempts" -lt "$CHECKOUT_ATTEMPTS" ] && { [ "$live" -eq 0 ] || [ "$ticks" -ge "$CHECKOUT_HEDGE_TICKS" ]; }; then
              launch
            elif [ "$live" -eq 0 ]; then
              echo "::error::Every one of $attempts checkout attempts failed"
              exit 1
            fi
          done
          i=1
          while [ "$i" -le "$attempts" ]; do
            pid=${pids[i]}
            if [ "$i" != "$winner" ] && [ -n "$pid" ]; then
              pkill -P "$pid" 2> /dev/null || true
              kill "$pid" 2> /dev/null || true
            fi
            i=$((i + 1))
          done
          cat "$RUNNER_TEMP/checkout-$winner.log"
          rm -rf .git
          mv "$RUNNER_TEMP/checkout-$winner/.git" .git
          git checkout -q --force --detach "$GITHUB_SHA"
          printf 'Checked out %s (%s) from attempt %s of %s\n' "$(git rev-parse HEAD)" "$ref" "$winner" "$attempts"
      # MAIN'S MEASURED NODE TIMES (scripts/lib/node-batch.mjs, `.github/workflows/node-timings.yml`): the node batch's
      # files and packing come from the committed table with the newest times main measured before this run laid over it,
      # add-only, so a file the full suite has timed under the cut joins without a hand refresh. Fetched IN THE BACKGROUND
      # (builtin-only, the runner's own Node) beside the install restore, and awaited before the batch. Every stream is
      # redirected, or the runner would hold this step open until the fetch closed the step's output pipe. Its status is
      # caught (`|| rc=$?`): the step's shell is `bash -e`, under which a failed fetch would end the subshell before it
      # wrote one, and the wait below would spin to the job's timeout.
      - if: matrix.batch
        name: Fetch main's measured node times in the background
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ( rc=0; node scripts/ci/ci.mjs node-timings > "$RUNNER_TEMP/node-timings.log" 2>&1 || rc=$?; echo "$rc" > "$RUNNER_TEMP/node-timings.part"; mv "$RUNNER_TEMP/node-timings.part" "$RUNNER_TEMP/node-timings.status" ) < /dev/null > /dev/null 2>&1 &
      # No `cache: npm`: the whole install is restored below, and npm's download cache would only add a restore.
      - if: steps.runner-node.outputs.major != '22'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      # ci.yml's whole-install cache, same key (see its `checks` job for why it holds the fonts too). Main's
      # `warm-caches` and every ci.yml miss save it; in this lane only the `install` runner saves, a clean `npm ci` of a
      # lock main has not installed yet (its matrix entry says why).
      - run: node scripts/ci/ci.mjs lock-fingerprint
      - if: matrix.install
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: own-install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/html-systems/font-manifest.json
          key: install-v5-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json') }}
          lookup-only: true
      - if: matrix.install
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: own-slim
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/html-systems/font-manifest.json
            !node_modules/@typescript/typescript-*
            !node_modules/@fontsource
            !node_modules/@fontsource-variable
            !node_modules/lucide-static/font
          key: install-slim-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json') }}
          lookup-only: true
      - if: matrix.install && steps.own-install.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - if: matrix.install && steps.own-install.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/html-systems/font-manifest.json
          key: install-v5-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json') }}
      # The slim install of a lock whose whole install exists but whose slim one does not (this pull request's first
      # run after the slim entry was introduced): the whole one, restored, is what it is cut from.
      - if: matrix.install && steps.own-install.outputs.cache-hit == 'true' && steps.own-slim.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/html-systems/font-manifest.json
          key: install-v5-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json') }}
      - if: matrix.install && steps.own-slim.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/html-systems/font-manifest.json
            !node_modules/@typescript/typescript-*
            !node_modules/@fontsource
            !node_modules/@fontsource-variable
            !node_modules/lucide-static/font
          key: install-slim-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json') }}
      # THE SLIM INSTALL, for the runners that only run Vitest: the whole install minus what no test here can load
      # (scripts/__tests__/slim-install.test.mjs names each and refuses an import of one): the native TypeScript compiler
      # (the `types` runner's), the @fontsource packages (copy-assets reads them at install; the fonts they make are kept),
      # lucide-static's icon font. About 29 MB of the 166 MB compressed entry. Exact key only: on a miss the whole install
      # is restored as before, so a lock main has not slimmed yet (this entry's first merge included) costs nothing.
      # EVERY FIRST CACHE DOWNLOAD IS BOUNDED (SEGMENT_DOWNLOAD_TIMEOUT_MINS, minutes a 128 MB segment, fractions allowed):
      # over 575 install restores the download took 1.4s median and 6.2s p99, then 35.5s once (run 44141023943's node-2,
      # stuck at 70.8% and again at 92.7%). Past the bound actions/cache abandons the download, extracts nothing and reports a
      # miss, so the next tier of this chain runs: the slim install falls back to the whole one, which falls back to the
      # nearest. The whole one is bounded as a second tier too: after ui-5's slim download was abandoned at 73.3%, the whole
      # one stalled 32s at 68.2% (run 44174517646, 67s). The nearest keeps the default and, on this lock's key, restores that
      # same entry, so a network slow everywhere costs time, never a cold `npm ci`. scripts/__tests__/ci-budget.test.mjs pins
      # each bound.
      - if: matrix.suite || matrix.shard || matrix.batch
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: slim
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '0.1'
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/html-systems/font-manifest.json
            !node_modules/@typescript/typescript-*
            !node_modules/@fontsource
            !node_modules/@fontsource-variable
            !node_modules/lucide-static/font
          key: install-slim-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json') }}
      - if: ${{ !matrix.install && steps.slim.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '0.1'
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/html-systems/font-manifest.json
          key: install-v5-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json') }}
      # A PULL REQUEST THAT CHANGES THE LOCK MISSES THAT KEY ON EVERY PUSH: only main saves it, after the merge.
      # A cold `npm ci` was 14-24s of #1018's 47s and 55s runs. So on a miss, restore the newest whole install
      # (this branch's, else main's; restore only, so no stale tree is ever saved) and let `npm install`
      # reconcile it to this lock: it adds, removes and prunes only what the lock changed. If that would rewrite
      # the lock (package.json and lock disagree), it is put back and `npm ci` decides, exactly as before.
      # copy-assets is the app workspace's postinstall, which an unchanged workspace does not re-run.
      - if: ${{ !matrix.install && steps.slim.outputs.cache-hit != 'true' && steps.install.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: near-install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/html-systems/font-manifest.json
          key: install-v5-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json') }}
          restore-keys: install-v5-${{ runner.os }}-${{ runner.arch }}-node22-
      # An exact hit here is this lock's own install, restored after the whole install's download was abandoned: nothing to reconcile.
      - if: ${{ !matrix.install && steps.slim.outputs.cache-hit != 'true' && steps.install.outputs.cache-hit != 'true' && steps.near-install.outputs.cache-hit != 'true' && steps.near-install.outputs.cache-matched-key != '' }}
        name: Reconcile the nearest install to this lock
        run: |
          npm install --no-audit --no-fund
          if git diff --quiet -- package-lock.json package.json 'services/*/package.json'; then
            node services/app/scripts/copy-assets.mjs
          else
            git checkout -- package-lock.json package.json 'services/*/package.json'
            npm ci --no-audit --no-fund
          fi
      - if: ${{ !matrix.install && steps.slim.outputs.cache-hit != 'true' && steps.install.outputs.cache-hit != 'true' && steps.near-install.outputs.cache-matched-key == '' }}
        run: npm ci --no-audit --no-fund
      # The root type check is incremental: start from the newest native build info any run of this repository
      # uploaded (scripts/ci/ci.mjs `type-info`), and pass this one on.
      - if: matrix.part == 'types'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/ci.mjs type-info
      - if: matrix.part == 'types'
        run: node scripts/ci/check-local.mjs validate --part=types
      - if: matrix.part == 'types'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tsgo-buildinfo
          path: node_modules/.cache/tsgo/root.tsbuildinfo
          # Kept as long as tested-tree evidence: a quiet stretch must not leave the next PR a cold type check.
          retention-days: 14
          if-no-files-found: ignore
      # actionlint reads every workflow and shellchecks every `run:` block; it runs beside the lint half.
      - if: matrix.part == 'lint'
        name: Lint the workflows and validate the rest
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          # A pinned executable preserves the same workflow/shell checks without a Docker pull/start.
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          # The release redirect can return persistent 504s; the immutable asset API is a bounded fallback.
          if ! curl --max-time 10 -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"; then
            curl --max-time 15 -fsSL -H 'Accept: application/octet-stream' -o "$RUNNER_TEMP/$archive" https://api.github.com/repos/rhysd/actionlint/releases/assets/384924896
          fi
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/$archive" actionlint
          "$RUNNER_TEMP/actionlint" -color & lint=$!
          rc=0
          node scripts/ci/check-local.mjs validate --part=lint || rc=1
          wait "$lint" || rc=1
          exit "$rc"
      - if: matrix.part == 'tests'
        run: node scripts/ci/fast-check.mjs
      # The test global setup's server reader and hosted libraries (build-runtime.global.ts), keyed by what they are
      # built from (scripts/ci/ci.mjs `test-builds-key`) and this runner's kind (`TEST_BUILDS_KIND` above); main's
      # warm-caches writes each kind's entry. Without one for this kind, main's whole entry for the same sources serves
      # (ci.yml's: the builds and the api modules), then this kind's newest. A pull request that changes those inputs
      # rebuilds them (~10s) and the last runner of each kind saves its entry, so its next push restores it.
      # The entry also carries the test database's schema image (services/app/test/setup/schema-image-file.ts): with it,
      # each Vitest worker restores its first database instead of running initdb and the boot DDL (660ms -> 170ms
      # measured locally). Only the file named by this checkout's schema key loads, so a stale entry is a miss. The
      # guard runners restore it too, for the contract and harness files that open a database.
      - if: matrix.suite || matrix.shard || matrix.batch
        id: test-builds-key
        run: node scripts/ci/ci.mjs test-builds-key
      # Bounded too: over 538 restores the download took 0.8s median and 1.9s p99, then 20.4s, and once a 16.9s "server is
      # busy" that ended in no entry at all (run 44150141230's ui-5). An abandoned download extracts nothing; one more restore
      # of the same entries follows, and without either the global setup builds them (~10s), exactly as on any miss.
      - if: matrix.suite || matrix.shard || matrix.batch
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: test-builds
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '0.05'
        with:
          path: |
            services/app/lib/build-assets
            services/app/public/libraries
            tmp/test-schema-image
            tmp/vitest-module-cache
          key: test-builds-v3-${{ runner.os }}-${{ env.TEST_BUILDS_KIND }}-${{ steps.test-builds-key.outputs.key }}-${{ steps.test-builds-key.outputs.modules }}
          restore-keys: |
            test-builds-v2-${{ runner.os }}-${{ steps.test-builds-key.outputs.key }}
            test-builds-v3-${{ runner.os }}-${{ env.TEST_BUILDS_KIND }}-
            test-builds-v2-${{ runner.os }}-
      - if: (matrix.suite || matrix.shard || matrix.batch) && steps.test-builds.outputs.cache-matched-key == ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: test-builds-retry
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '0.25'
        with:
          path: |
            services/app/lib/build-assets
            services/app/public/libraries
            tmp/test-schema-image
            tmp/vitest-module-cache
          key: test-builds-v3-${{ runner.os }}-${{ env.TEST_BUILDS_KIND }}-${{ steps.test-builds-key.outputs.key }}-${{ steps.test-builds-key.outputs.modules }}
          restore-keys: |
            test-builds-v2-${{ runner.os }}-${{ steps.test-builds-key.outputs.key }}
            test-builds-v3-${{ runner.os }}-${{ env.TEST_BUILDS_KIND }}-
            test-builds-v2-${{ runner.os }}-
      - if: matrix.shard
        run: node node_modules/vitest/vitest.mjs run --config vitest.guard.config.ts --shard=${{ matrix.shard }}
      - if: matrix.suite
        run: node node_modules/vitest/vitest.mjs run ${{ matrix.projects }} --shard=${{ matrix.suite }}
      - if: matrix.batch
        name: Wait for main's measured node times
        run: |
          until [ -f "$RUNNER_TEMP/node-timings.status" ]; do sleep 0.1; done
          cat "$RUNNER_TEMP/node-timings.log"
          exit "$(cat "$RUNNER_TEMP/node-timings.status")"
      - if: matrix.batch
        run: node node_modules/vitest/vitest.mjs run --config vitest.node-batch.config.ts --shard=${{ matrix.batch }}
      # The last runner of each kind saves that kind's entry on an exact miss, after its tests, so its transforms are in it:
      # packing puts the longest files first, often one to a runner, so the last runner holds the most files.
      - if: contains(fromJSON('["api-32","ui-7","guards-3","node-3"]'), matrix.part) && steps.test-builds.outputs.cache-hit != 'true' && steps.test-builds-retry.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            services/app/lib/build-assets
            services/app/public/libraries
            tmp/test-schema-image
            tmp/vitest-module-cache
          key: test-builds-v3-${{ runner.os }}-${{ env.TEST_BUILDS_KIND }}-${{ steps.test-builds-key.outputs.key }}-${{ steps.test-builds-key.outputs.modules }}
      - name: PR CI clock (warns at 40s; fails over 60s)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        # The attempt the first step fetched in the background; fetched here only if that never landed.
        run: |
          attempt="$RUNNER_TEMP/pr-attempt.json"
          [ -s "$attempt" ] || gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" > "$attempt"
          node scripts/lib/ci-elapsed.mjs --pr "$attempt" "$GITHUB_STEP_SUMMARY"
