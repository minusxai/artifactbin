name: pr fast

# PULL REQUEST CI BUDGET, A HARD RULE: aim for 40s; the limit is 60s. Each job's last step measures
# the run from its start (queue, setup and install included) and FAILS the pull request past 60s
# (scripts/lib/ci-elapsed.mjs --pr). Do not raise the budget: fix the critical path instead.
#
# This is the required pull request check. It runs validate (type check, knip, module graph, name and
# UI-primitive guards), the workflow lint, JavaScript syntax, the fast module test list
# (scripts/ci/fast-tests.json), the guard tests (scripts/ci/guard-tests.json), the contract tests
# (scripts/ci/contract-tests.json), EVERY api, api-isolated, ui and islands test (the `api-*` and `ui-*` parts) and the
# full suite's cheap node tests (the `node-*` parts), all at once, each runner restoring main's install cache. The api and jsdom suites reached main untested once too often
# (#1138, #1141: each a red main, and production held for a whole extra merge), so every pull request runs them. The guard tests read
# the repository's own files by path (workflows, package scripts, the skill tree), so no import graph selects them and
# the fast list's capability audit refuses them; the contract tests run another repository's post-merge scenario (the
# server's native acceptance) through the real handlers, which the audit refuses too. Each guards a contract whose
# break once reached main. WHEN MAIN GOES RED, find why this lane missed it and add a
# deterministic guard here (either list, or a contract test) within the budget. The root type
# check uses TypeScript 7's native compiler (scripts/lib/type-check.mjs): about 7s cold on a runner where tsc 5
# took 30s, and longer still from stale build info, so no diff size can push it past the limit. It starts from
# the newest incremental build info any run uploaded.
# The full suite stays in ci.yml: it runs on every push to main (and on demand) and gates deploys there; it does
# not run on pull requests. page-speed.yml is informational.
#
# No workflow-level `concurrency` group: cancel-in-progress holds a new run pending until the old one
# stops (ci.yml's header has the measurements), which alone would cost more than this lane's budget.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: fast (${{ matrix.part }})
    runs-on: ubuntu-latest
    # A job that reaches two minutes is already twice over the limit.
    timeout-minutes: 2
    # Reading this run's own attempt (the clock below) needs `actions: read`; a job-level block replaces
    # the workflow's, so `contents: read` is restated.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        part: [ types, lint, tests, guards, guards-2, guards-3 ]
        # The guard and contract tests were one 35-59s Vitest step, ~100s of worker CPU on the runner's 4 vCPUs (the
        # contracts boot a database per file). Three jobs split them by measured time
        # (vitest.guard.config.ts's timed sequencer over the guard runners' own times), each file once: on two, the
        # guard jobs were the slowest of the run in half of pr fast's runs (42-57s; Vitest 19-27s around a 15s file).
        include:
          - part: guards
            shard: 1/3
          - part: guards-2
            shard: 2/3
          - part: guards-3
            shard: 3/3
          # THE API AND JSDOM SUITES, ALL OF THEM: vitest.config.ts's api and api-isolated projects on 32 runners, its ui and
          # islands projects on 7, the same files ci.yml's api and ui jobs run after the merge, each group packed
          # longest-first by measured CI time (scripts/lib/timed-sequencer.mjs over scripts/ci/test-timings.json;
          # `--sums` prints each runner's load). Apart, not mixed: every worker imports the module graph of each project it
          # runs, and a runner given both kinds paid both on all three workers. None of them launches Chromium, so no
          # runner provisions a browser. Add a runner when a group's load nears the clock; never move a file out.
          # EVERY RUNNER DOWNLOADS THE 166 MB INSTALL AT ONCE, and that is what caps the count: at 42 test runners it took
          # a median 5s (p90 6-7, max 7-11); at 52 (40 api runners, run 43042914246) a median 6s, p90 11, max 20, with 18
          # runners past 8s, and the slowest jobs were those downloads, not their tests. So 32, not 40.
          - part: api-1
            projects: --project=api --project=api-isolated
            suite: 1/32
          - part: api-2
            projects: --project=api --project=api-isolated
            suite: 2/32
          - part: api-3
            projects: --project=api --project=api-isolated
            suite: 3/32
          - part: api-4
            projects: --project=api --project=api-isolated
            suite: 4/32
          - part: api-5
            projects: --project=api --project=api-isolated
            suite: 5/32
          - part: api-6
            projects: --project=api --project=api-isolated
            suite: 6/32
          - part: api-7
            projects: --project=api --project=api-isolated
            suite: 7/32
          - part: api-8
            projects: --project=api --project=api-isolated
            suite: 8/32
          - part: api-9
            projects: --project=api --project=api-isolated
            suite: 9/32
          - part: api-10
            projects: --project=api --project=api-isolated
            suite: 10/32
          - part: api-11
            projects: --project=api --project=api-isolated
            suite: 11/32
          - part: api-12
            projects: --project=api --project=api-isolated
            suite: 12/32
          - part: api-13
            projects: --project=api --project=api-isolated
            suite: 13/32
          - part: api-14
            projects: --project=api --project=api-isolated
            suite: 14/32
          - part: api-15
            projects: --project=api --project=api-isolated
            suite: 15/32
          - part: api-16
            projects: --project=api --project=api-isolated
            suite: 16/32
          - part: api-17
            projects: --project=api --project=api-isolated
            suite: 17/32
          - part: api-18
            projects: --project=api --project=api-isolated
            suite: 18/32
          - part: api-19
            projects: --project=api --project=api-isolated
            suite: 19/32
          - part: api-20
            projects: --project=api --project=api-isolated
            suite: 20/32
          - part: api-21
            projects: --project=api --project=api-isolated
            suite: 21/32
          - part: api-22
            projects: --project=api --project=api-isolated
            suite: 22/32
          - part: api-23
            projects: --project=api --project=api-isolated
            suite: 23/32
          - part: api-24
            projects: --project=api --project=api-isolated
            suite: 24/32
          - part: api-25
            projects: --project=api --project=api-isolated
            suite: 25/32
          - part: api-26
            projects: --project=api --project=api-isolated
            suite: 26/32
          - part: api-27
            projects: --project=api --project=api-isolated
            suite: 27/32
          - part: api-28
            projects: --project=api --project=api-isolated
            suite: 28/32
          - part: api-29
            projects: --project=api --project=api-isolated
            suite: 29/32
          - part: api-30
            projects: --project=api --project=api-isolated
            suite: 30/32
          - part: api-31
            projects: --project=api --project=api-isolated
            suite: 31/32
          - part: api-32
            projects: --project=api --project=api-isolated
            suite: 32/32
          - part: ui-1
            projects: --project=ui --project=islands
            suite: 1/7
          - part: ui-2
            projects: --project=ui --project=islands
            suite: 2/7
          - part: ui-3
            projects: --project=ui --project=islands
            suite: 3/7
          - part: ui-4
            projects: --project=ui --project=islands
            suite: 4/7
          - part: ui-5
            projects: --project=ui --project=islands
            suite: 5/7
          - part: ui-6
            projects: --project=ui --project=islands
            suite: 6/7
          - part: ui-7
            projects: --project=ui --project=islands
            suite: 7/7
          # THE NODE BATCH (vitest.node-batch.config.ts, scripts/lib/node-batch.mjs): the full suite's `node` files
          # recorded under 200ms that no other list here runs, plus the post-merge failures it guards, one shared module
          # graph per worker; ci.yml's node job still runs every one of them. 236 files: ~4.3s per runner locally on two
          # runners (3 workers each), so three runners, predicted ~10s each on CI (an estimate: none has run there yet).
          # THE PULL REQUEST'S OWN INSTALL: a lock this branch changed misses main's install on every push, and every runner
          # reconciles main's tree to it (~2.7s: the miss probe and `npm install`, run 43039126177). This runner, only on
          # that miss, runs a clean `npm ci` (never a reconciled tree: nothing stale is saved) and saves it under this
          # lock's key, in this pull request's cache scope; from the next push every runner restores an exact hit.
          # A clean install is ~14-24s; it runs beside the test runners, on the first push of each new lock only.
          - part: install
            install: true
          - part: node-1
            batch: 1/3
          - part: node-2
            batch: 2/3
          - part: node-3
            batch: 3/3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Node 22, the install cache's (its key says node22; its native modules are compiled for that major's ABI). The runner's
      # own Node serves when it is a 22 already, skipping setup-node's ~0.5s step and ~0.2s post step (run 42812079087,
      # job api-3); any other major gets setup-node exactly as before. The step prints the version it found.
      # --version exits before JavaScript initialization; evaluating process.versions took 14.7s on the slowest
      # runner of run 43196988989, making its complete attempt 61s. Shell expansion needs only the version string.
      - id: runner-node
        run: |
          runner_version=$(node --version)
          runner_major=${runner_version#v}
          runner_major=${runner_major%%.*}
          printf 'major=%s\n' "$runner_major" >> "$GITHUB_OUTPUT"
          printf 'Runner Node: %s\n' "$runner_version"
      # No `cache: npm`: the whole install is restored below, and npm's download cache would only add a restore.
      - if: steps.runner-node.outputs.major != '22'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      # ci.yml's whole-install cache, same key (see its `checks` job for why it holds the fonts too). Main's
      # `warm-caches` and every ci.yml miss save it; in this lane only the `install` runner saves, a clean `npm ci` of a
      # lock main has not installed yet (its matrix entry says why).
      - run: node scripts/ci/ci.mjs lock-fingerprint
      - if: matrix.install
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: own-install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/html-systems/font-manifest.json
          key: install-v5-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json') }}
          lookup-only: true
      - if: matrix.install
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: own-slim
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/html-systems/font-manifest.json
            !node_modules/@typescript/typescript-*
            !node_modules/@fontsource
            !node_modules/@fontsource-variable
            !node_modules/lucide-static/font
          key: install-slim-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json') }}
          lookup-only: true
      - if: matrix.install && steps.own-install.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - if: matrix.install && steps.own-install.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/html-systems/font-manifest.json
          key: install-v5-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json') }}
      # The slim install of a lock whose whole install exists but whose slim one does not (this pull request's first
      # run after the slim entry was introduced): the whole one, restored, is what it is cut from.
      - if: matrix.install && steps.own-install.outputs.cache-hit == 'true' && steps.own-slim.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/html-systems/font-manifest.json
          key: install-v5-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json') }}
      - if: matrix.install && steps.own-slim.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/html-systems/font-manifest.json
            !node_modules/@typescript/typescript-*
            !node_modules/@fontsource
            !node_modules/@fontsource-variable
            !node_modules/lucide-static/font
          key: install-slim-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json') }}
      # THE SLIM INSTALL, for the runners that only run Vitest: the whole install minus what no test here can load
      # (scripts/__tests__/slim-install.test.mjs names each and refuses an import of one): the native TypeScript compiler
      # (the `types` runner's), the @fontsource packages (copy-assets reads them at install; the fonts they make are kept),
      # lucide-static's icon font. About 29 MB of the 166 MB compressed entry. Exact key only: on a miss the whole install
      # is restored as before, so a lock main has not slimmed yet (this entry's first merge included) costs nothing.
      - if: matrix.suite || matrix.shard || matrix.batch
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: slim
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/html-systems/font-manifest.json
            !node_modules/@typescript/typescript-*
            !node_modules/@fontsource
            !node_modules/@fontsource-variable
            !node_modules/lucide-static/font
          key: install-slim-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json') }}
      - if: ${{ !matrix.install && steps.slim.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/html-systems/font-manifest.json
          key: install-v5-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json') }}
      # A PULL REQUEST THAT CHANGES THE LOCK MISSES THAT KEY ON EVERY PUSH: only main saves it, after the merge.
      # A cold `npm ci` was 14-24s of #1018's 47s and 55s runs. So on a miss, restore the newest whole install
      # (this branch's, else main's; restore only, so no stale tree is ever saved) and let `npm install`
      # reconcile it to this lock: it adds, removes and prunes only what the lock changed. If that would rewrite
      # the lock (package.json and lock disagree), it is put back and `npm ci` decides, exactly as before.
      # copy-assets is the app workspace's postinstall, which an unchanged workspace does not re-run.
      - if: ${{ !matrix.install && steps.slim.outputs.cache-hit != 'true' && steps.install.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: near-install
        with:
          path: |
            node_modules
            services/*/node_modules
            services/app/public/fonts
            services/app/lib/html-systems/font-manifest.json
          key: install-v5-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.ci-cache-key/install.json') }}
          restore-keys: install-v5-${{ runner.os }}-${{ runner.arch }}-node22-
      - if: ${{ !matrix.install && steps.slim.outputs.cache-hit != 'true' && steps.install.outputs.cache-hit != 'true' && steps.near-install.outputs.cache-matched-key != '' }}
        name: Reconcile the nearest install to this lock
        run: |
          npm install --no-audit --no-fund
          if git diff --quiet -- package-lock.json package.json 'services/*/package.json'; then
            node services/app/scripts/copy-assets.mjs
          else
            git checkout -- package-lock.json package.json 'services/*/package.json'
            npm ci --no-audit --no-fund
          fi
      - if: ${{ !matrix.install && steps.slim.outputs.cache-hit != 'true' && steps.install.outputs.cache-hit != 'true' && steps.near-install.outputs.cache-matched-key == '' }}
        run: npm ci --no-audit --no-fund
      # The root type check is incremental: start from the newest native build info any run of this repository
      # uploaded (scripts/ci/ci.mjs `type-info`), and pass this one on.
      - if: matrix.part == 'types'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/ci.mjs type-info
      - if: matrix.part == 'types'
        run: node scripts/ci/check-local.mjs validate --part=types
      - if: matrix.part == 'types'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tsgo-buildinfo
          path: node_modules/.cache/tsgo/root.tsbuildinfo
          # Kept as long as tested-tree evidence: a quiet stretch must not leave the next PR a cold type check.
          retention-days: 14
          if-no-files-found: ignore
      # actionlint reads every workflow and shellchecks every `run:` block; it runs beside the lint half.
      - if: matrix.part == 'lint'
        name: Lint the workflows and validate the rest
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          # A pinned executable preserves the same workflow/shell checks without a Docker pull/start.
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          # The release redirect can return persistent 504s; the immutable asset API is a bounded fallback.
          if ! curl --max-time 10 -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"; then
            curl --max-time 15 -fsSL -H 'Accept: application/octet-stream' -o "$RUNNER_TEMP/$archive" https://api.github.com/repos/rhysd/actionlint/releases/assets/384924896
          fi
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/$archive" actionlint
          "$RUNNER_TEMP/actionlint" -color & lint=$!
          rc=0
          node scripts/ci/check-local.mjs validate --part=lint || rc=1
          wait "$lint" || rc=1
          exit "$rc"
      - if: matrix.part == 'tests'
        run: node scripts/ci/fast-check.mjs
      # The test global setup's server reader and hosted libraries (build-runtime.global.ts), keyed by what they are
      # built from (scripts/ci/ci.mjs `test-builds-key`); main's warm-caches writes the entry. A pull request that
      # changes those inputs rebuilds them (~10s) and its first runner saves the result, so its next push restores it.
      # The entry also carries the test database's schema image (services/app/test/setup/schema-image-file.ts): with it,
      # each Vitest worker restores its first database instead of running initdb and the boot DDL (660ms -> 170ms
      # measured locally). Only the file named by this checkout's schema key loads, so a stale entry is a miss. The
      # guard runners restore it too, for the contract and harness files that open a database.
      - if: matrix.suite || matrix.shard || matrix.batch
        id: test-builds-key
        run: node scripts/ci/ci.mjs test-builds-key
      - if: matrix.suite || matrix.shard || matrix.batch
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: test-builds
        with:
          path: |
            services/app/lib/build-assets
            services/app/public/libraries
            tmp/test-schema-image
            tmp/vitest-module-cache
          key: test-builds-v2-${{ runner.os }}-${{ steps.test-builds-key.outputs.key }}
          restore-keys: test-builds-v2-${{ runner.os }}-
      - if: matrix.shard
        run: node node_modules/vitest/vitest.mjs run --config vitest.guard.config.ts --shard=${{ matrix.shard }}
      - if: matrix.suite
        run: node node_modules/vitest/vitest.mjs run ${{ matrix.projects }} --shard=${{ matrix.suite }}
      - if: matrix.batch
        run: node node_modules/vitest/vitest.mjs run --config vitest.node-batch.config.ts --shard=${{ matrix.batch }}
      - if: matrix.part == 'api-1' && steps.test-builds.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            services/app/lib/build-assets
            services/app/public/libraries
            tmp/test-schema-image
            tmp/vitest-module-cache
          key: test-builds-v2-${{ runner.os }}-${{ steps.test-builds-key.outputs.key }}
      - name: PR CI clock (warns at 40s; fails over 60s)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" > "$RUNNER_TEMP/pr-attempt.json"
          node scripts/lib/ci-elapsed.mjs --pr "$RUNNER_TEMP/pr-attempt.json" "$GITHUB_STEP_SUMMARY"
