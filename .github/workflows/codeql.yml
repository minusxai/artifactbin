name: CodeQL

# CODE SCANNING AFTER MERGE, NOT ON EVERY PULL REQUEST. The repository's default setup ran three
# analyses on every PR (JavaScript/TypeScript 103-109 s, Python 47 s, Actions 33 s): ~190 runner-s per
# PR beside a CI run that must fit in four minutes. The same queries run here on every push to main and
# weekly, so a finding lands on main after the merge instead of blocking it. Python is not analysed:
# its only sources are two binary-injection helpers (services/cli/scripts/sea-inject-*.py).
# Same default query suite as before. This is advanced setup: the repository's default setup must be
# off (state `not-configured`), or GitHub rejects these uploads.
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ actions, javascript-typescript ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: /language:${{ matrix.language }}
