name: Release afbin

# Bumps the CLI version and pushes the release branch, opening its PR where the token allows (see
# below). Nothing is built or published here: the PR's CI
# builds the four platform binaries and runs the Intel render proofs and the distributions
# conformance job (selected because the version changed, scripts/lib/ci-plan.mjs), and once the PR
# is merged and main's CI passes, `release-cli.yml` uploads the tested assets to GitHub Releases.
#
# Opening the PR needs a token that is allowed to: this organization forbids Actions from creating
# pull requests with the repository token, so an `AUTOMATION_TOKEN` secret (a PAT, as the server
# repository uses) is preferred. Without one the branch is still pushed and its CI still started —
# dispatched explicitly, because the repository token's events start no workflow — and the job
# summary carries the compare link to open the PR by hand. Nothing here fails for lack of a PAT.

on:
  workflow_dispatch:
    inputs:
      level:
        description: Which part of the version to bump
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-pr:
    name: Bump the CLI and push the release branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bump the CLI, its installer, its release pointer and its teaching
        id: bump
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          set -euo pipefail
          case "$LEVEL" in patch|minor|major) ;; *) echo "::error::unknown level $LEVEL"; exit 1;; esac
          npm run release:cli -- "$LEVEL"
          npm run generate:teaching -w services/cli
          version=$(node -p "require('./services/cli/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Push the release branch, start its CI, and open the PR where a token allows it
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
          HAS_PAT: ${{ secrets.AUTOMATION_TOKEN != '' }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          branch="release/afbin-v$VERSION"
          # Authored as whoever dispatched the release: a bot author makes GitHub append a
          # `Co-authored-by` trailer to the squash merge, and merge commits here are title-only.
          git config user.name "$ACTOR"
          git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Release afbin $VERSION"
          git push -u origin "$branch"
          # A PAT's pull_request event starts CI itself; the repository token's does not.
          if [ "$HAS_PAT" != "true" ]; then gh workflow run ci.yml --ref "$branch"; fi
          if gh pr create --base main --head "$branch" --title "Release afbin $VERSION" --body ""; then
            echo "Release PR opened for afbin $VERSION." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The release branch \`$branch\` is pushed and its CI is running, but this token may not open pull requests. Open it here: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1&title=Release+afbin+$VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi
